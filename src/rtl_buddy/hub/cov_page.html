<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rtl-buddy-cov</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/hub/assets/rtl-buddy-favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/hub/assets/rtl-buddy-favicon-16.png">
  <!--
    Served by rtl_buddy.hub.cov_page at GET /cov. Loads no external resources.
    The fallback tokens below repeat the ones the page cannot render without, in case
    /hub/theme.css 404s. They must stay BEFORE the sheet link: both select :root, so a
    later block would override the sheet, including its dark-mode block.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --bg:          #f8fafc;
      --panel:       #ffffff;
      --panel-2:     #f1f5f9;
      --line:        #e2e8f0;
      --line-strong: #cbd5e1;
      --fg:          #1e293b;
      --fg-muted:    #64748b;
      --fg-faint:    #94a3b8;
      --accent:      #2563eb;
      --ok:          #16a34a;
      --warn:        #b45309;
      --err:         #dc2626;
      /* Coverage ramp: the fill is hsl(pct * 1.2, --tint-s, --cov-l), so these must survive a missing sheet. */
      --tint-s:      70%;
      --cov-l:       82%;
      --cov-none:    #e5e7eb;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --fs-base:  13px;
      --fs-small: 11px;
      --radius-1: 3px;
      --radius-2: 4px;
    }
  </style>
  <link rel="stylesheet" href="/hub/theme.css">
  <style>
    /* Page-local derivations of the shared tokens. */
    /* Do not re-declare a sheet token here: both blocks select :root, so a later one would out-rank the sheet. */
    :root {
      --gutter:   3.2rem; /* line-number column */
      --markcol:  8rem;   /* hard cap on ONE metric column */
      /* Ends of the .tint ramp, one per half of a bit cell. */
      /* Derived from --cov-l so they still track the theme when the sheet 404s. */
      --tgl-hit:  hsl(120, var(--tint-s), var(--cov-l));
      --tgl-miss: hsl(0,   var(--tint-s), var(--cov-l));
    }
    * { box-sizing: border-box; }
    /* [hidden] must beat the display set on the ids below. */
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font: var(--fs-base)/1.45 var(--font-mono);
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
      padding: .5rem .75rem; border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 {
      font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .02em;
      white-space: nowrap;
    }
    header h1 small { color: var(--fg-muted); font-weight: 400; }
    .grow { flex: 1 1 auto; }
    input[type="search"], select {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line); border-radius: var(--radius-2);
      padding: .25rem .5rem;
    }
    input[type="search"] { min-width: 12rem; }
    input[type="search"]:focus, select:focus { outline: 1px solid var(--accent); }
    button {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line); border-radius: var(--radius-2);
      padding: .25rem .55rem; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    label.chk { display: inline-flex; align-items: center; gap: .3rem; cursor: pointer; }
    nav.switcher { display: flex; gap: .35rem; align-items: center; }
    nav.switcher a {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line-strong); border-radius: var(--radius-2);
      padding: .25rem .55rem; text-decoration: none; white-space: nowrap;
    }
    nav.switcher a:hover { border-color: var(--accent); color: var(--accent); }

    main { flex: 1 1 auto; display: flex; min-height: 0; }
    aside {
      width: 24rem; flex: none; border-right: 1px solid var(--line);
      background: var(--panel); overflow: auto; padding: .6rem .5rem;
    }
    /* The file view owns its scroller so the docked detail panel can sit outside it. */
    section#content {
      flex: 1 1 auto; min-width: 0; min-height: 0; position: relative;
      display: flex; flex-direction: column;
    }
    #dash { flex: 1 1 auto; overflow: auto; min-height: 0; }
    #file { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    #src-scroll { flex: 1 1 auto; overflow: auto; min-height: 0; }
    h2 {
      font-size: 12px; margin: .8rem 0 .4rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--fg-muted);
    }
    h2:first-child { margin-top: 0; }
    .muted { color: var(--fg-muted); }
    .faint { color: var(--fg-faint); }
    .msg-error { color: var(--err); font-weight: 600; }
    .msg-warn { color: var(--warn); font-weight: 600; }

    /* -- coverage ramp: one rule, both themes, driven by --h ---------- */
    .tint { background: hsl(var(--h), var(--tint-s), var(--cov-l)); }
    .tint.none { background: var(--cov-none); }

    /* -- lists + tables ---------------------------------------------- */
    ul.files { list-style: none; margin: 0; padding: 0; }
    ul.files li {
      display: grid; grid-template-columns: 1fr 4.5rem 3.2rem;
      gap: .4rem; align-items: center; padding: .15rem .3rem;
      border-radius: var(--radius-1); cursor: pointer;
    }
    ul.files li:hover { background: var(--panel-2); }
    ul.files li.sel { background: var(--panel-2); outline: 1px solid var(--accent); }
    ul.files li .path {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      direction: rtl; text-align: left;
    }
    .bar {
      height: .55rem; border-radius: var(--radius-1);
      background: var(--panel-2); overflow: hidden;
    }
    .bar > span { display: block; height: 100%; }
    .pct { text-align: right; font-size: var(--fs-small); color: var(--fg-muted); }
    table { border-collapse: collapse; width: 100%; font-size: var(--fs-small); }
    table th {
      text-align: right; font-weight: 600; color: var(--fg-muted);
      padding: .15rem .35rem; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: var(--panel);
    }
    table th:first-child, table td:first-child { text-align: left; }
    table td { padding: .12rem .35rem; text-align: right; }
    tr.row { cursor: pointer; }
    tr.row:hover td { background: var(--panel-2); }
    tr.row.sel td { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }

    /* -- dashboard ---------------------------------------------------- */
    #dash { padding: .75rem; }
    .cards { display: flex; gap: .5rem; flex-wrap: wrap; }
    .card {
      border: 1px solid var(--line); border-radius: var(--radius-3, 6px);
      background: var(--panel); padding: .5rem .6rem; min-width: 9rem;
    }
    .card .k { font-size: var(--fs-small); color: var(--fg-muted); text-transform: uppercase; letter-spacing: .08em; }
    .card .v { font-size: 20px; font-weight: 600; }
    .card .n { font-size: var(--fs-small); color: var(--fg-muted); }
    dl.kv { display: grid; grid-template-columns: 8rem 1fr; gap: .1rem .5rem; margin: 0; }
    dl.kv dt { color: var(--fg-muted); }
    dl.kv dd { margin: 0; overflow-wrap: anywhere; }

    /* -- source annotation -------------------------------------------- */
    #file-head {
      position: sticky; top: 0; z-index: 2; background: var(--panel);
      border-bottom: 1px solid var(--line); padding: .5rem .75rem;
      display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap;
    }
    #file-head .path { font-weight: 600; }
    .pill {
      display: inline-block; padding: 0 .4rem; border-radius: 999px;
      border: 1px solid var(--line-strong); font-size: var(--fs-small);
      color: var(--fg-muted); white-space: nowrap;
    }
    .pill.hot { border-color: var(--accent); color: var(--accent); }
    /* Elaboration lens: buttons joined into one strip, read as one choice. */
    .seg { display: inline-flex; }
    .seg button {
      padding: 0 .4rem; font-size: var(--fs-small); color: var(--fg-muted);
      border-radius: 0; border-right-width: 0;
    }
    .seg button:first-child { border-radius: 999px 0 0 999px; padding-left: .55rem; }
    .seg button:last-child {
      border-radius: 0 999px 999px 0; border-right-width: 1px; padding-right: .55rem;
    }
    .seg button.on {
      border-color: var(--accent); color: var(--accent); background: var(--panel);
    }
    .elab-head {
      display: flex; gap: .4rem; align-items: baseline;
      margin: .45rem 0 .2rem; font-size: var(--fs-small);
    }
    .elab-head:first-child { margin-top: 0; }
    /* Clickable pills show hover feedback like the buttons and switcher links. */
    .pill.act { cursor: pointer; }
    .pill.act:hover { border-color: var(--accent); color: var(--accent); }
    /* Cross-app row in the file header: smaller buttons, since they act on the open file. */
    .actions { display: inline-flex; gap: .25rem; flex-wrap: wrap; }
    .actions button { font-size: var(--fs-small); padding: .1rem .4rem; }
    button:disabled { opacity: .45; cursor: default; }
    button:disabled:hover { border-color: var(--line); }
    /* Pinned first row of the tests table: the merged view. */
    tr.row.all-tests td { border-bottom: 1px solid var(--line-strong); }
    tr.row.all-tests td:first-child { font-style: italic; }
    table#src { font-size: var(--fs-base); }
    table#src td { text-align: left; padding: 0 .4rem; white-space: pre; }
    table#src td.no {
      width: var(--gutter); text-align: right; color: var(--fg-faint);
      user-select: none; border-right: 1px solid var(--line);
    }

    table#src td.marks { width: 1%; white-space: nowrap; }
    table#src td.code { width: 100%; overflow-wrap: normal; }
    table#src tr.hot td.code { box-shadow: inset 0 0 0 1px var(--accent); }
    /* Every metric gets a capped, clipped column: one 32-bit bus is 64 toggle points and would push the code off screen. */
    /* The cap is on an inner block because max-width on a td is advisory in auto table layout. */
    table#src td.marks { text-align: right; padding: 0 .3rem; }
    table#src td.marks .marks-in {
      display: flex; gap: .15rem; align-items: center; justify-content: flex-end;
      max-width: var(--markcol); overflow: hidden; white-space: nowrap;
    }
    /* The L column is a hit count, not a badge: hover lists per-test hits, click opens the detail panel. */
    table#src td.hits {
      color: var(--fg-muted); font-size: var(--fs-small); padding: 0 .35rem;
    }
    table#src td.hits.act { cursor: pointer; }

    /* -- the source table's own header: per-file totals, per column --- */
    table#src thead th {
      font-size: var(--fs-small); font-weight: 600; line-height: 1.2;
      padding: .1rem .3rem .15rem; vertical-align: top; white-space: nowrap;
      border-bottom: 1px solid var(--line-strong);
    }
    table#src thead th.no { width: var(--gutter); }
    table#src thead th.mh { text-align: right; cursor: pointer; width: 1%; }
    table#src thead th.mh:hover, table#src thead th.mh.sort { color: var(--accent); }
    table#src thead th.mh .mh-num { font-weight: 400; color: var(--fg-faint); }
    table#src thead th.mh.sort .mh-num { color: var(--accent); }
    table#src thead th.code {
      text-align: left; font-weight: 400; color: var(--fg-faint);
    }
    .mark {
      display: inline-block; margin-right: .15rem; padding: 0 .25rem;
      border-radius: var(--radius-1); font-size: var(--fs-small);
      border: 1px solid var(--line-strong); cursor: pointer;
      color: var(--fg); max-width: 12rem; overflow: hidden;
      text-overflow: ellipsis;
    }
    .mark.miss { border-color: var(--err); color: var(--err); font-weight: 600; }
    .mark.sel { outline: 1px solid var(--accent); }
    .mark.badge { font-variant-numeric: tabular-nums; }
    .mark.badge.open { outline: 1px solid var(--accent); }

    /* -- docked detail panel: outside the code scroller so it stays visible -- */
    #detail {
      flex: none; display: flex; flex-direction: column; min-height: 0;
      max-height: 40vh; background: var(--panel);
      border-top: 1px solid var(--line-strong);
    }
    #detail-head {
      flex: none; display: flex; gap: .5rem; align-items: center;
      flex-wrap: wrap; padding: .3rem .75rem; font-size: var(--fs-small);
      border-bottom: 1px solid var(--line); color: var(--fg-muted);
    }
    #detail-head .where { font-weight: 600; color: var(--fg); }
    #detail-head button { padding: 0 .35rem; line-height: 1.3; }
    #detail-scroll { flex: 1 1 auto; overflow: auto; min-height: 0; padding: 0 .75rem .5rem; }
    /* The open line is marked on the code cell only, so the hit tint in the other columns stays. */
    table#src tr.open td.code { background: var(--panel-2); }
    table#src tr.open td.no { box-shadow: inset 2px 0 0 var(--accent); }
    /* Wrap so a declaration with many signals stays a few lines tall. */
    .tgs { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 1.6rem; }
    .tg { margin: .3rem 0 0; }
    .tg-head {
      display: flex; gap: .4rem; align-items: baseline;
      font-size: var(--fs-small);
    }
    .tg-name { font-weight: 600; color: var(--fg); }
    .tg-range, .tg-sum { color: var(--fg-muted); }
    .tg-rows { margin-top: .15rem; }
    .tg-row { display: flex; gap: 1px; margin-bottom: 2px; }
    /* One cell per bit: top half is 0→1, bottom half 1→0, each in the ramp's covered or uncovered colour. */
    .bit {
      width: .72rem; height: .72rem; flex: none; border-radius: 1px;
      cursor: pointer;
      --dir-up: var(--tgl-miss); --dir-down: var(--tgl-miss);
      background: linear-gradient(to bottom,
        var(--dir-up) 0 50%, var(--dir-down) 50% 100%);
    }
    .bit.up { --dir-up: var(--tgl-hit); }
    .bit.down { --dir-down: var(--tgl-hit); }
    .bit.absent { background: var(--cov-none); cursor: default; }
    /* Byte boundary. */
    .bit.sep { margin-right: .3rem; }
    .bit:hover { outline: 1px solid var(--fg-muted); }
    .bit.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
    .tg-chips { margin-top: .35rem; }
    /* Attribution of a clicked point, in the same panel as its grid. */
    #point {
      border-top: 1px dashed var(--line); margin-top: .4rem;
      padding: .35rem 0 0; font-size: var(--fs-small);
    }
    #point table { width: auto; min-width: 10rem; }
    #point table td { padding-right: .75rem; }

    footer {
      border-top: 1px solid var(--line); background: var(--panel);
      padding: .3rem .75rem; color: var(--fg-muted);
      display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
    }
    /* Shared hub chrome: connection dot and status words (connected / connecting… / offline), see docs/concepts/hub.md. */
    .dot { width: .55rem; height: .55rem; border-radius: 50%; display: inline-block; }
    .dot.connected { background: var(--ok); }
    .dot.connecting { background: var(--warn); }
    .dot.offline { background: var(--err); }
    /* Fourth status state, also a control: another cov tab took the hub slot and a click takes it back (showSuperseded). */
    .take-back {
      color: var(--err); font-weight: 600;
      cursor: pointer; text-decoration: underline;
    }

    #empty {
      position: absolute; inset: 0; display: none; place-items: center;
      text-align: center; padding: 2rem;
    }
    #empty.show { display: grid; }
    #empty code {
      background: var(--panel-2); padding: .1rem .35rem; border-radius: var(--radius-1);
    }
  </style>
  <script>
    %HUB_INJECTION%
  </script>
</head>
<body>
  <header>
    <h1>rtl-buddy-cov <small id="counts"></small></h1>
    <label class="chk" title="Which metric the FILE LIST is ranked and barred on — coldest first, files with no points of that kind last — and which the cold-only filter reads. It opens on toggle, where the holes usually are, and clicking a column header in the source view sets it too. The source view itself always shows all five. Toggle, expression and cover detail only exists when the run's raw database survived — an .info-only fallback carries line and branch alone.">
      metric <select id="metric"></select>
    </label>
    <label class="chk" title="Which figures the totals, file list and tests table show. PER ELABORATION counts a point once per elaborated module (what rb cov summary's run row reports): a block built under two parameterisations is two points. SOURCE POINTS counts it once, covered when any elaboration hit it (rb cov summary --by-source); the file list keeps the per-elaboration order. Open the pane on source points with /cov?by=source.">
      figures <select id="by">
        <option value="elab">per elaboration</option>
        <option value="source">source points</option>
      </select>
    </label>
    <label class="chk" title="Restrict the FILE LIST and the tests table to one module's sources. These are the ELABORATED names the simulator compiled (ip_async_fifo__DB13), because that is what the coverage model is keyed on and two parameterisations of one module are two entries here; the source name is what the module chips in the file header show. To count only one elaboration's points INSIDE an open file, use the elaboration lens in the file header.">
      module <select id="module"><option value="">all</option></select>
    </label>
    <input type="search" id="search" placeholder="filter files by path…" spellcheck="false">
    <label class="chk" title="Hide files that are fully covered for the selected metric.">
      <input type="checkbox" id="opt-cold"> cold only
    </label>
    <span class="grow"></span>
    <label class="chk" title="Clicking a line also broadcasts source_focused; the hub resolves it to an instance and highlights it in the schematic. Does nothing when no schematic tab is connected.">
      <input type="checkbox" id="opt-select" checked> sync schematic
    </label>
    <label class="chk" title="Clicking a line also jumps your editor to it — needs nvim with the rtl-buddy plugin (rb nvim-install) running in this project. Untick if no editor is connected.">
      <input type="checkbox" id="opt-open" checked> open in editor
    </label>
    <button id="reload" title="Re-fetch /cov.json (after another coverage run)">reload</button>
    <nav class="switcher" aria-label="hub apps">
      <a href="/" title="Every app this hub serves, plus its live state.">⌂ hub</a>
      <a href="/sch" target="_blank" rel="noopener" data-origin="view"
         title="Open the schematic in a new tab.">sch ↗</a>
      <a href="/gph" target="_blank" rel="noopener" data-origin="graph"
         title="Open the design knowledge graph in a new tab. Selecting a module here focuses it there.">gph ↗</a>
      <a href="/phy" target="_blank" rel="noopener" data-origin="phys"
         title="Open the physical pane in a new tab — area and power per module and per instance.">phy ↗</a>
    </nav>
  </header>

  <main>
    <aside>
      <h2>files</h2>
      <ul class="files" id="files"></ul>
      <h2>tests</h2>
      <div id="tests"><p class="muted">no per-test attribution in this run.</p></div>
    </aside>
    <section id="content">
      <div id="dash"></div>
      <div id="file" hidden>
        <div id="file-head"></div>
        <div id="src-scroll"><table id="src">
          <thead id="src-head"></thead><tbody id="src-body"></tbody>
        </table></div>
        <!--
          Outside #src-scroll so the panel stays visible for lines near the bottom of a long file.
          The attribution of a clicked point stacks in the same panel.
        -->
        <div id="detail" hidden>
          <div id="detail-head"></div>
          <div id="detail-scroll">
            <div id="detail-body"></div>
            <div id="point" hidden></div>
          </div>
        </div>
      </div>
      <div id="empty"><div id="empty-msg"></div></div>
    </section>
  </main>

  <footer>
    <span><span class="dot connecting" id="ws-dot"></span> <span id="ws-status">connecting…</span></span>
    <span id="peers" class="muted"></span>
    <span id="hub-version" class="muted"></span>
    <span class="grow"></span>
    <span id="msg" class="muted"></span>
  </footer>

<script>
(function () {
  'use strict';

  var COV_URL = window.__RTL_BUDDY_COV_URL__ || '/cov.json';
  var SOURCE_URL = window.__RTL_BUDDY_COV_SOURCE_URL__ || '/cov/source';

  // Fallback for a payload without hub.metrics.
  var METRICS = ['line', 'branch', 'toggle', 'expression', 'cover'];
  // Metric the pane opens on: toggle is where the holes usually are.
  var DEFAULT_METRIC = 'toggle';
  var METRIC_INITIAL = {
    line: 'L', branch: 'B', toggle: 'T', expression: 'E', cover: 'C'
  };

  var els = {
    counts: document.getElementById('counts'),
    metric: document.getElementById('metric'),
    by: document.getElementById('by'),
    module: document.getElementById('module'),
    search: document.getElementById('search'),
    cold: document.getElementById('opt-cold'),
    optSelect: document.getElementById('opt-select'),
    optOpen: document.getElementById('opt-open'),
    files: document.getElementById('files'),
    tests: document.getElementById('tests'),
    dash: document.getElementById('dash'),
    file: document.getElementById('file'),
    fileHead: document.getElementById('file-head'),
    srcHead: document.getElementById('src-head'),
    srcBody: document.getElementById('src-body'),
    srcScroll: document.getElementById('src-scroll'),
    detail: document.getElementById('detail'),
    detailHead: document.getElementById('detail-head'),
    detailBody: document.getElementById('detail-body'),
    point: document.getElementById('point'),
    empty: document.getElementById('empty'),
    emptyMsg: document.getElementById('empty-msg'),
    peers: document.getElementById('peers'),
    hubVersion: document.getElementById('hub-version'),
    msg: document.getElementById('msg'),
    wsDot: document.getElementById('ws-dot'),
    wsStatus: document.getElementById('ws-status')
  };

  var state = {
    payload: null,
    byPath: Object.create(null),
    modules: Object.create(null),
    metric: null,      // chosen on the first ingest, the user's pick after
    by: 'elab',        // which figures the tables show: 'elab' or 'source', see figuresOf
    module: '',
    filter: '',
    coldOnly: false,
    file: null,        // selected file path
    test: null,        // selected test name (attribution filter)
    elab: null,        // one elaborated module, or null for all of them

    focusLine: null,   // line to scroll to / highlight in the file view
    focusItem: null,   // point name to highlight in the file view
    expandedLine: null, // the line the docked detail panel is showing
    expandedMetric: null, // which of that line's columns it is showing
    sources: Object.create(null),
    pending: null      // cov_focus that arrived before the model did
  };

  // ---------------------------------------------------------------
  // small helpers
  // ---------------------------------------------------------------

  function note(text, level) {
    els.msg.textContent = text || '';
    els.msg.className =
      level === 'error' ? 'msg-error' : level === 'warn' ? 'msg-warn' : 'muted';
  }
  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }
  function elem(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text != null) { n.textContent = String(text); }
    return n;

  function pct(ratio) {
    return ratio == null ? '—' : (ratio * 100).toFixed(1) + '%';
  }
  // Hue 0 (red) at nothing covered to 120 (green) at all; saturation and lightness come from the theme tokens.
  function tint(node, ratio) {
    if (ratio == null) { node.classList.add('tint', 'none'); return node; }
    node.classList.add('tint');
    node.classList.remove('none');
    node.style.setProperty('--h', String(Math.round(ratio * 120)));
    return node;
  }
  // The figures the tables show for a run, test or file row: its source_totals under the source toggle, else its totals.
  function shownTotals(row, metric) {
    return figuresOf(row, metric, state.by);
  }
  function uuid() {
    if (window.crypto && crypto.randomUUID) { return crypto.randomUUID(); }

      : (function () { for (var i = 0; i < 16; i++) { b[i] = Math.floor(Math.random() * 256); } })();

  // ---------------------------------------------------------------
  // hub WebSocket — same /ws the SPA and the graph pane use
  // ---------------------------------------------------------------

  var ws = null, wsReady = false, retryMs = 500, pending = Object.create(null);
  // Set when a hello was refused because the cov slot was taken; the next hello asks to evict the incumbent. Cleared on welcome.
  var pendingTakeover = false;
  // Set when the hub evicted this tab for a newer cov tab. Reconnecting would evict that tab in turn, so retries stop
  // until the user takes the slot back.
  var superseded = false;

  // >>> hello-payload
  // Takeover is opt-in per hello: the first hello omits it, and only a retry after
  // `not_connected: cov client already registered` sets it. Same flow as the schematic SPA
  // (viewer/src/composables/useHub.js) and graph_page.html; change all three together.
  function helloPayload(takeover) {
    var payload = {
      client: 'cov', version: '1.0.0', capabilities: ['cov_focus']
    };
    if (takeover) { payload.takeover = true; }
    return payload;
  }
  // <<< hello-payload

  function sendHello() {
    return send({
      v: 1, id: uuid(), origin: 'cov', kind: 'request', type: 'hello',
      payload: helloPayload(pendingTakeover)
    });
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    try { ws = new WebSocket(proto + '//' + location.host + '/ws'); }
    catch (e) { scheduleReconnect(); return; }

    ws.addEventListener('open', sendHello);
    ws.addEventListener('message', function (ev) {
      var env; try { env = JSON.parse(ev.data); } catch (e) { return; }
      applyEnvelope(env);
    });
    ws.addEventListener('close', function () {
      wsReady = false;
      // The hub closes the socket after superseding us; do not repaint the strip or retry.
      if (superseded) { return; }
      els.wsDot.className = 'dot offline';
      els.wsStatus.textContent = 'offline';
      els.wsStatus.title = 'lost /ws — retrying';
      scheduleReconnect();
    });
    ws.addEventListener('error', function () { /* close handles it */ });
  }

  function scheduleReconnect() {
    if (superseded) { return; }
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 10000);
  }

  function send(env) {
    if (!ws || ws.readyState !== 1) { return false; }
    ws.send(JSON.stringify(env));
    return true;
  }
  function emit(type, payload) {
    return send({ v: 1, id: uuid(), origin: 'cov', kind: 'event', type: type, payload: payload });
  }
  function request(type, payload, onReply) {
    var id = uuid();
    if (onReply) { pending[id] = onReply; }
    return send({ v: 1, id: id, origin: 'cov', kind: 'request', type: type, payload: payload });
  }

  function applyEnvelope(env) {
    if (!env || typeof env !== 'object') { return; }
    // Responses carry the request's own id; there is no in_reply_to field.
    if ((env.kind === 'response' || env.kind === 'error') && pending[env.id]) {
      var cb = pending[env.id]; delete pending[env.id];
      cb(env);
    }
    switch (env.type) {
      case 'welcome':
        wsReady = true; retryMs = 500;
        pendingTakeover = false;
        clearTakeBack();
        els.wsDot.className = 'dot connected';
        els.wsStatus.textContent = 'connected';
        setHubVersion(env.payload && env.payload.server_version);
        setPeers(env.payload && env.payload.registered_clients);
        break;
      case 'peer_joined':
      case 'bye':
        // Ask the hub who is connected instead of tracking peers locally.
        request('state_snapshot', {}, function (reply) {
          if (reply.kind === 'response' && reply.payload) { setPeers(reply.payload.peers); }
        });
        break;
      case 'cov_focus':
        if (env.origin === 'cov') { break; }
        applyFocus(env.payload || {});
        break;
      case 'source_focused':
        if (env.origin === 'cov') { break; }
        focusFile(env.payload && env.payload.file,
                  { line: env.payload && env.payload.line, emit: false });
        break;
      case 'selection_changed':
        if (env.origin === 'cov') { break; }

        break;
      default:

      note('hub error: ' + env.payload.code + ': ' + env.payload.message, 'error');
    }

  // Handles the two hub errors about this tab's registration, not about a request. Returns true when handled.
  // Same rule as the schematic SPA and graph_page.html.
  function handleHubError(payload) {
    // A newer cov tab owns the slot: show the take-back control and stop reconnecting.
    if (payload.code === 'superseded') {
      superseded = true;
      showSuperseded();
      if (ws) { try { ws.close(); } catch (e) { /* already gone */ } }
      return true;

    // The polite hello lost to an incumbent: retry once, asking to evict it. The hub drops the socket after
    // refusing, so the flag usually rides the reconnect instead.
    if (payload.code === 'not_connected' && !pendingTakeover &&
        /already registered/i.test(payload.message || '')) {

    'one client per origin. Click to take the slot back — that tab goes ' +
    'offline instead.';

  function showSuperseded() {

    els.wsStatus.textContent = SUPERSEDED_TEXT;
    els.wsStatus.title = SUPERSEDED_HINT;
    els.wsStatus.className = 'take-back';
    els.wsStatus.setAttribute('role', 'button');
    els.wsStatus.setAttribute('tabindex', '0');
  }

  function clearTakeBack() {
    els.wsStatus.className = '';
    els.wsStatus.removeAttribute('role');
    els.wsStatus.removeAttribute('tabindex');
  }

  // The user asked for the slot back, so this hello requests the takeover.

    els.wsStatus.textContent = 'connecting…';
    els.wsStatus.title = hubTitle;

  // >>> origin-labels

  // Hand-duplicated in graph_page.html, landing_page.html, phys_page.html and the SPA
  // (rtl-buddy-sch viewer/src/displayNames.js); change all five together (rtl-buddy-sch docs/hub-protocol.md section 13).

  function setPeers(list) {
    if (!Array.isArray(list)) { return; }
    var next = list.slice().sort();
    var changed = next.join('') !== peers.join('');
    peers = next;
    els.peers.textContent =
      'peers: ' + (list.length ? list.map(originLabel).join(', ') : 'none');

  // >>> version-label
  // Same rule in graph_page.html and the SPA (viewer/src/buildInfo.js); change all three together.
  // Input is setuptools-scm's version, e.g. `6.26.2.dev13+g3f5b890e3.d20260806`. The label is the base plus

  function load() {

  function renderHeader() {
    var p = state.payload || {};

      var parts = [];
      METRICS.forEach(function (metric) {
        var t = figuresOf(p, metric, by);

        parts.push(METRIC_INITIAL[metric] + ' ' + pct(t.ratio));
      });
      return parts;
    }
    var parts = summary(state.by);
    if (p.simulator) { parts.push(p.simulator); }
    els.counts.textContent = parts.length ? '· ' + parts.join(' · ') : '';

  // The figures picker. A model without source_totals offers only per-elaboration figures.
  function renderByPicker() {
    var has = !!(state.payload && state.payload.source_totals);
    var source = els.by.querySelector('option[value="' + FIGURES_SOURCE + '"]');
    source.disabled = !has;
    source.textContent = has ? 'source points' : 'source points (none)';

  }

  // Set from the figures picker; re-renders every table and keeps ?by= in the address so a reload or bookmark keeps it.
  function setBy(by) {
    by = by === FIGURES_SOURCE ? FIGURES_SOURCE : FIGURES_ELAB;
    if (state.by === by) { return; }
    state.by = by;
    els.by.value = by;
    try {
      history.replaceState(null, '', location.pathname + searchWithBy(location.search, by) +
        location.hash);
    } catch (e) { /* a sandboxed frame cannot rewrite its address; the pick still applies */ }

    renderHeader();
    renderFiles();
    renderTests();
    renderDashboard();
    if (state.file) { renderFile(); }

  function initialMetric(payload) {
    var totals = (payload && payload.totals) || {};
    function has(metric) {
      return METRICS.indexOf(metric) >= 0 && (totals[metric] || {}).found;
    }
    if (has(DEFAULT_METRIC)) { return DEFAULT_METRIC; }
    for (var i = 0; i < METRICS.length; i++) {
      if (has(METRICS[i])) { return METRICS[i]; }
    }
    return METRICS[0];
  }

  function renderMetricPicker() {
    clear(els.metric);
    METRICS.forEach(function (metric) {
      var opt = elem('option', null, metric);
      opt.value = metric;
      var t = (state.payload.totals || {})[metric] || {};
      // A metric with no points is marked "(none)" instead of hidden, so it is not mistaken for a coverage hole.
      if (!t.found) { opt.textContent = metric + ' (none)'; }
      els.metric.appendChild(opt);
    });
    els.metric.value = state.metric;
  }

  // --- pure helpers, no DOM and no state -----------------------------
  // >>> figures

  // elaboration hit it. A row with no source_totals (a model older than them) shows its totals under either choice.
  var FIGURES_ELAB = 'elab';
  var FIGURES_SOURCE = 'source';

  function figuresOf(row, metric, by) {
    var key = by === FIGURES_SOURCE && row && row.source_totals ? 'source_totals' : 'totals';
    return (row && row[key] && row[key][metric]) || { found: 0, hit: 0, ratio: null };
  }

  function openedBy(search) {
    var found = /[?&]by=([^&]*)/.exec(String(search == null ? '' : search));
    return found && found[1] === FIGURES_SOURCE ? FIGURES_SOURCE : FIGURES_ELAB;
  }

    (points || []).forEach(function (point) {

  // <<< figures

  // >>> module-names
  // The model keys modules on the simulator's elaborated name (`ip_async_fifo__DB13`); the graph and source use
  // the source name. One trailing `__<alnum>` group is the difference: strip it once, only if a non-empty base remains.
  // Matches base_module_name in rtl_buddy/graph/coverage.py; change both together.
  function baseModuleName(name) {
    var text = String(name == null ? '' : name);
    var base = text.replace(/__[A-Za-z0-9]+$/, '');
    return base || text;
  }

  function moduleChips(names) {

    (names || []).forEach(function (name) {
      var base = baseModuleName(name);
      var chip = byBase[base];

      if (chip.names.indexOf(name) < 0) { chip.names.push(name); }

  function resolveModuleName(known, name) {

    var names = known || [];

    var base = baseModuleName(wanted);

  // >>> elaboration-lens
  // Builds on `baseModuleName`. The elaborated modules a file's points were recorded against.
  function elaborationsOf(row, metrics) {

    (metrics || []).forEach(function (metric) {
      ((row && row[metric]) || []).forEach(function (point) {

        if (!name || seen[name]) { return; }
        seen[name] = true; names.push(name);

    });
    return names.sort();
  }

  // Lens labels: the parameterisation suffix alone (`W13`) when all elaborations are of one module, else the full name.
  // The tooltip is always the full name.
  function elaborationSegments(names) {
    var uniq = [], seen = Object.create(null);
    (names || []).forEach(function (name) {
      var text = String(name == null ? '' : name);
      if (!text || seen[text]) { return; }
      seen[text] = true; uniq.push(text);

    uniq.sort();
    var bases = Object.create(null), count = 0;
    uniq.forEach(function (name) {

      if (!bases[base]) { bases[base] = true; count += 1; }

      return { name: name, label: count > 1 ? name : (suffix || base) };

  }

  // A source line can hold several line points (an `if` arm and its `else`, one per elaboration). The L column shows one

  function foldLinePoints(points, hits) {
    var byLine = Object.create(null);
    (points || []).forEach(function (point) {
      if (!point || point.line == null) { return; }
      var module = point.module || null;
      var fold = byLine[point.line];
      if (!fold) {
        fold = byLine[point.line] =
          { line: point.line, module: module, hits: 0, tests: {}, points: [], hit: 0 };
      } else if (fold.module !== module) {

      }
      fold.points.push(point);
      fold.hits += point.hits || 0;
      Object.keys(point.tests || {}).forEach(function (name) {

  function elaborationGroups(entries, hits) {

      var group = byName[name];

        groups.push(group);

      group.entries.push(entry);
      if (hits(entry.point) > 0) { group.hit += 1; }

  }

  function renderModulePicker() {
    var current = state.module;
