    Object.keys(state.modules).sort().forEach(function (name) {
      var opt = elem('option', null, name);
      opt.value = name;
      els.module.appendChild(opt);
    });
    els.module.value = state.modules[current] ? current : '';
    state.module = els.module.value;
  }

  // ---------------------------------------------------------------
  // file list
  // ---------------------------------------------------------------

  // --- pure helper, no DOM and no state ------------------------------
  // >>> file-ordering
  // Rank by the selected metric, by the same rule as `coldest_first` in rtl_buddy/cov/query.py: files with no points last,
  // then ratio ascending, then misses descending. Remaining ties keep the payload order.
  function coldestFirst(rows, metric) {
    return (rows || []).map(function (row, index) {
      var totals = (row && row.totals && row.totals[metric]) || {};
      var found = totals.found || 0;
      return {
        row: row,
        index: index,
        silent: found ? 0 : 1,
        ratio: totals.ratio == null ? 1 : totals.ratio,
        misses: found - (totals.hit || 0)
      };
    }).sort(function (a, b) {
      return (a.silent - b.silent) || (a.ratio - b.ratio) ||
             (b.misses - a.misses) || (a.index - b.index);
    }).map(function (entry) { return entry.row; });
  }
  // <<< file-ordering

  function visibleFiles() {
    var rows = (state.payload && state.payload.files) || [];
    return coldestFirst(rows.filter(function (row) {
      if (state.module && (row.modules || []).indexOf(state.module) < 0) { return false; }
      if (state.filter && row.path.toLowerCase().indexOf(state.filter) < 0) { return false; }
      if (state.coldOnly) {
        var t = shownTotals(row, state.metric);
        if (!t.found || t.hit >= t.found) { return false; }
      }
      return true;
    }), state.metric);
  }

  function renderFiles() {
    clear(els.files);
    var rows = visibleFiles();
    if (!rows.length) {
      els.files.appendChild(elem('li', 'muted', 'no files match.'));
      return;
    }
    rows.forEach(function (row) {
      var t = shownTotals(row, state.metric);
      var li = elem('li');
      li.classList.toggle('sel', state.file === row.path);
      // Right-to-left so a long path truncates at its start.
      var path = elem('span', 'path', row.path);
      path.title = row.path + (row.modules && row.modules.length
        ? '  ·  ' + row.modules.join(', ') : '');
      var bar = elem('span', 'bar');
      var fill = elem('span');
      tint(fill, t.ratio);
      fill.style.width = (t.ratio == null ? 0 : t.ratio * 100) + '%';
      bar.appendChild(fill);
      var num = elem('span', 'pct', t.found ? t.hit + '/' + t.found : '—');
      li.appendChild(path); li.appendChild(bar); li.appendChild(num);
      li.addEventListener('click', function () { selectFile(row.path, {}); });
      els.files.appendChild(li);
    });
  }

  // ---------------------------------------------------------------
  // tests table
  // ---------------------------------------------------------------

  // Every change to the test lens goes through here.
  function setLens(name) {
    if (state.test === name) { return; }
    state.test = name;
    renderTests();
    if (state.file) { renderFile(); }
    note(state.test
      ? 'attribution: showing what ' + state.test + ' hit'
      : 'attribution: all tests (merged)');
  }

  // Elaboration lens: count only one elaboration of a parameterised module. Composes with the test lens as an intersection.
  function setElab(name) {
    if (state.elab === name) { return; }
    state.elab = name || null;
    if (state.file) { renderFile(); }
    note(state.elab
      ? 'elaboration: counting only ' + state.elab
      : 'elaboration: all of them (merged)');
  }

  function elabControl(segs) {
    var wrap = elem('span', 'seg');
    var all = elem('button', state.elab ? null : 'on', 'all');
    all.title = 'Count every elaboration together — the model’s own numbers, ' +
      'which is what rb cov summary reports.';
    all.addEventListener('click', function () { setElab(null); });
    wrap.appendChild(all);
    segs.forEach(function (seg) {
      var b = elem('button', state.elab === seg.name ? 'on' : null, seg.label);
      b.title = seg.name +
        '\nCount only this elaboration’s points.';
      b.addEventListener('click', function () { setElab(seg.name); });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function elabPill() {
    var pill = elem('span', 'pill hot act', 'elab: ' + baseElabLabel(state.elab) + ' ×');
    pill.title = 'Only ' + state.elab + '’s points are counted. ' +
      'Click for all elaborations (merged).';
    pill.addEventListener('click', function (ev) {
      ev.stopPropagation();
      setElab(null);
    });
    return pill;
  }

  function baseElabLabel(name) {
    var seg = elaborationSegments([name])[0];
    return seg ? seg.label : String(name || '');
  }

  // Shown where the numbers are; clicking it clears the lens.
  function lensPill() {
    var pill = elem('span', 'pill hot act', 'lens: ' + state.test + ' ×');
    pill.title = 'Only what ' + state.test +
      ' hit is counted. Click for all tests (merged).';
    pill.addEventListener('click', function (ev) {
      ev.stopPropagation();
      setLens(null);
    });
    return pill;
  }

  function renderTests() {
    clear(els.tests);
    var rows = (state.payload && state.payload.tests) || [];
    if (!rows.length) {
      els.tests.appendChild(elem('p', 'muted', 'no per-test attribution in this run.'));
      return;
    }
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var htr = document.createElement('tr');
    htr.appendChild(elem('th', null, 'test'));
    METRICS.forEach(function (m) { htr.appendChild(elem('th', null, METRIC_INITIAL[m])); });
    thead.appendChild(htr); table.appendChild(thead);
    var tbody = document.createElement('tbody');
    // The always-present way back to the merged view.
    var all = elem('tr', 'row all-tests');
    all.classList.toggle('sel', !state.test);
    var allName = elem('td', null, 'all tests (merged)');
    allName.title = 'Every test in the run, merged — what the pane shows by default. ' +
      'Pick a test below to see its contribution alone.';
    all.appendChild(allName);
    METRICS.forEach(function (m) {
      var t = shownTotals(state.payload, m);
      all.appendChild(elem('td', null, t.found ? pct(t.ratio) : '—'));
    });
    all.addEventListener('click', function () { setLens(null); });
    tbody.appendChild(all);
    rows.forEach(function (row) {
      var tr = elem('tr', 'row');
      tr.classList.toggle('sel', state.test === row.name);
      var name = elem('td', null, row.name);
      name.title = row.suite ? 'from ' + row.suite : '';
      tr.appendChild(name);
      METRICS.forEach(function (m) {
        var t = shownTotals(row, m);
        var td = elem('td', null, t.found ? pct(t.ratio) : '—');
        tr.appendChild(td);
      });
      // A second click on the selected test also clears the lens.
      tr.addEventListener('click', function () {
        setLens(state.test === row.name ? null : row.name);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    els.tests.appendChild(table);
  }

  // ---------------------------------------------------------------
  // dashboard
  // ---------------------------------------------------------------

  function renderDashboard() {
    clear(els.dash);
    var p = state.payload || {};
    var cards = elem('div', 'cards');
    var unit = state.by === FIGURES_SOURCE && p.source_totals ? ' source points' : ' points';
    METRICS.forEach(function (metric) {
      if (!(p.totals || {})[metric]) { return; }
      var t = shownTotals(p, metric);
      var card = elem('div', 'card');
      card.appendChild(elem('div', 'k', metric));
      var v = elem('div', 'v', t.found ? pct(t.ratio) : '—');
      card.appendChild(v);
      card.appendChild(elem('div', 'n', t.found ? t.hit + ' / ' + t.found + unit : 'not collected'));
      var bar = elem('div', 'bar');
      var fill = elem('span');
      tint(fill, t.ratio);
      fill.style.width = (t.ratio == null ? 0 : t.ratio * 100) + '%';
      bar.appendChild(fill);
      card.appendChild(bar);
      cards.appendChild(card);
    });
    els.dash.appendChild(cards);

    els.dash.appendChild(elem('h2', null, 'run'));
    var dl = elem('dl', 'kv');
    [['manifest', p.manifest], ['generated', p.generated_at], ['command', p.run_command],
     ['suite', p.suite], ['builder', p.builder], ['simulator', p.simulator],
     ['merge mode', p.merge_mode], ['model', (p.hub || {}).model]
    ].forEach(function (pair) {
      if (pair[1] == null) { return; }
      dl.appendChild(elem('dt', null, pair[0]));
      dl.appendChild(elem('dd', null, pair[1]));
    });
    els.dash.appendChild(dl);

    if ((p.covers || []).length) {
      els.dash.appendChild(elem('h2', null, 'cover points'));
      var table = document.createElement('table');
      var thead = document.createElement('thead');
      var htr = document.createElement('tr');
      ['name', 'module', 'file', 'hits'].forEach(function (h) {
        htr.appendChild(elem('th', null, h));
      });
      thead.appendChild(htr); table.appendChild(thead);
      var tbody = document.createElement('tbody');
      p.covers.forEach(function (row) {
        var tr = elem('tr', 'row');
        tr.appendChild(elem('td', null, row.name || '—'));
        var mod = elem('td', null, row.module ? baseModuleName(row.module) : '—');
        if (row.module && baseModuleName(row.module) !== row.module) {
          mod.title = 'elaborated as ' + row.module;
        }
        tr.appendChild(mod);
        tr.appendChild(elem('td', null, row.file || '—'));
        var hits = elem('td', null, row.hits);
        if (!row.hits) { hits.className = 'msg-error'; }
        tr.appendChild(hits);
        tr.addEventListener('click', function () {
          selectFile(row.file, { line: row.line, item: row.name, metric: 'cover' });
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      els.dash.appendChild(table);
    }

    els.dash.appendChild(elem('h2', null, 'coldest files'));
    els.dash.appendChild(elem('p', 'muted',
      'Pick one on the left — the list is ranked coldest first for the metric ' +
      'selected above, with files that have no points of it last.'));
  }

  // ---------------------------------------------------------------
  // per-file source annotation
  // ---------------------------------------------------------------

  function selectFile(path, opts) {
    opts = opts || {};
    var row = path && state.byPath[path];
    if (!row) {
      note('no coverage recorded for ' + path, 'warn');
      return false;
    }
    // The detail panel and the elaboration lens do not survive a change of file.
    if (state.file !== path) {
      state.expandedLine = null;
      state.expandedMetric = null;
      state.elab = null;
    }
    if (opts.elab !== undefined) { state.elab = opts.elab; }
    state.file = path;
    state.focusLine = opts.line || null;
    state.focusItem = opts.item || null;
    if (opts.metric && METRICS.indexOf(opts.metric) >= 0) {
      state.metric = opts.metric;
      els.metric.value = opts.metric;
    }
    renderFiles();
    els.dash.hidden = true;
    els.file.hidden = false;
    ensureSource(path, function () { renderFile(); });
    return true;
  }

  function ensureSource(path, done) {
    if (state.sources[path] !== undefined) { done(); return; }
    fetch(SOURCE_URL + '?path=' + encodeURIComponent(path), { cache: 'no-store' })
      .then(function (r) {
        return r.json().then(function (body) { return { ok: r.ok, body: body }; });
      })
      .then(function (res) {
        // A missing source degrades the annotation to line numbers without text.
        state.sources[path] = res.ok && Array.isArray(res.body.lines)
          ? res.body.lines : null;
        if (!res.ok) { note((res.body && res.body.error) || ('no source for ' + path), 'warn'); }
        done();
      })
      .catch(function (e) {
        state.sources[path] = null;
        note('could not read source for ' + path + ': ' + e, 'warn');
        done();
      });
  }

  function pointsByLine(row) {
    var index = Object.create(null);
    METRICS.forEach(function (metric) {
      pointsOfElaboration(row[metric], state.elab).forEach(function (point) {
        if (metric === 'line' || point.line == null) { return; }
        (index[point.line] = index[point.line] || []).push({ metric: metric, point: point });
      });
    });
    return index;
  }

  // --- pure helpers, no DOM and no state -----------------------------
  // tests/test_hub_cov_page.py evaluates the code between these markers in node, so it must not use anything outside them.
  // >>> toggle-grouping
  // A toggle point is `<base>[<bit>]:<dir>` (`paddr[3]:1->0`; no bit for scalars). The base may contain brackets,
  // so the bus index is the last bracket before the colon (the lazy first group).
  var TOGGLE_NAME = /^(.*?)(?:\[(\d+)\])?:(0->1|1->0)$/;

  function parseToggleName(name) {
    var m = TOGGLE_NAME.exec(name == null ? '' : String(name));
    if (!m) { return null; }
    return { base: m[1], bit: m[2] == null ? null : parseInt(m[2], 10), dir: m[3] };
  }

  // One group per base signal, one cell per bit, MSB first so the grid reads like the declaration. `total` counts directions.
  function groupToggles(entries) {
    var groups = [], byKey = Object.create(null);
    (entries || []).forEach(function (entry) {
      var point = (entry && entry.point) || {};
      var parsed = parseToggleName(point.name);
      // An unparseable name becomes its own one-cell group so it stays reachable.
      if (!parsed) { parsed = { base: String(point.name || '(unnamed)'), bit: null, dir: '0->1' }; }
      var key = (point.module || '') + ' ' + parsed.base;
      var group = byKey[key];
      if (!group) {
        group = byKey[key] = {
          base: parsed.base, module: point.module || '',
          scalar: true, min: null, max: null, total: 0,
          byBit: Object.create(null), cells: []
        };
        groups.push(group);
      }
      var bitKey = parsed.bit == null ? 's' : String(parsed.bit);
      var cell = group.byBit[bitKey];
      if (!cell) { cell = group.byBit[bitKey] = { bit: parsed.bit, up: null, down: null }; }
      var slot = parsed.dir === '0->1' ? 'up' : 'down';
      if (cell[slot]) { slot = slot === 'up' ? 'down' : 'up'; }
      if (cell[slot]) { return; }
      cell[slot] = point;
      group.total += 1;
      if (parsed.bit != null) {
        group.scalar = false;
        group.min = group.min == null ? parsed.bit : Math.min(group.min, parsed.bit);
        group.max = group.max == null ? parsed.bit : Math.max(group.max, parsed.bit);
      }
    });
    groups.forEach(function (group) {
      if (group.scalar) {
        group.cells = [group.byBit.s || { bit: null, up: null, down: null }];
        return;
      }
      for (var b = group.max; b >= group.min; b--) {
        // A hole in a bus keeps its place so the bits to its right do not shift.
        group.cells.push(group.byBit[String(b)] || { bit: b, up: null, down: null, absent: true });
      }
    });
    return groups;
  }

  // Rows of 32 bits, MSB row first.
  function chunkBits(cells, per) {
    var rows = [], i;
    for (i = 0; i < cells.length; i += per) { rows.push(cells.slice(i, i + per)); }
    return rows.length ? rows : [[]];
  }
  // <<< toggle-grouping

  function hitsFor(point) {
    // With a test lens on, show that test's hits.
    if (!state.test) { return point.hits || 0; }
    return ((point.tests || {})[state.test]) || 0;
  }

  function attribution(point) {
    var tests = point.tests || {};
    var names = Object.keys(tests).sort();
    if (!names.length) { return 'no per-test attribution'; }
    return names.map(function (n) { return n + ': ' + tests[n]; }).join('\n');
  }

  // ---------------------------------------------------------------
  // the marks column and its docked detail panel
  // ---------------------------------------------------------------

  //: line number -> entries of the rendered file.
  var lineMarks = Object.create(null);

  //: line number -> that line's line-coverage points, folded by `foldLinePoints`.
  var linePoints = Object.create(null);

  // Toggle always collapses to a badge; other metrics only when a line has more than one point.
  function collapses(metric, list) {
    return metric === 'toggle' || list.length > 1;
  }

  //: One line's points of one metric.
  function entriesOn(lineNo, metric) {
    return (lineMarks[lineNo] || []).filter(function (entry) {
      return entry.metric === metric;
    });
  }

  // The metric is the column, so the chip carries only the name.
  function namedMark(entry) {
    var h = hitsFor(entry.point);
    var mark = elem('span', 'mark' + (h > 0 ? '' : ' miss'),
      entry.point.name || '(unnamed)');
    mark.title = entry.metric + ' · ' + (entry.point.name || '(unnamed)') +
      (entry.point.module ? ' · ' + entry.point.module : '') +
      ' · hits ' + h + '\n' + attribution(entry.point);
    if (state.focusItem && entry.point.name === state.focusItem) {
      mark.classList.add('sel');
    }
    mark.addEventListener('click', function (ev) {
      ev.stopPropagation();
      selectDetail(mark);
      showPoint(entry.metric, entry.point);
    });
    return mark;
  }

  function metricBadge(metric, list, lineNo) {
    var hit = 0;
    list.forEach(function (entry) { if (hitsFor(entry.point) > 0) { hit += 1; } });
    var badge = elem('span', 'mark badge' + (hit ? '' : ' miss'),
      hit + '/' + list.length);
    tint(badge, list.length ? hit / list.length : null);
    if (state.expandedLine === lineNo && state.expandedMetric === metric) {
      badge.classList.add('open');
    }
    badge.title = list.length + ' ' + metric + ' point' + (list.length === 1 ? '' : 's') +
      ' on this line · ' + hit + ' hit' +
      (state.test ? ' by ' + state.test : '') + '\nclick for the detail panel';
    badge.addEventListener('click', function (ev) {
      ev.stopPropagation();
      toggleDetail(lineNo, metric);
    });
    return badge;
  }

  // One cell: a badge, or the point's name for a single named point. Empty for most lines.
  function renderCell(box, lineNo, metric) {
    var list = entriesOn(lineNo, metric);
    if (!list.length) { return; }
    if (!collapses(metric, list)) {
      list.forEach(function (entry) { box.appendChild(namedMark(entry)); });
      return;
    }
    box.appendChild(metricBadge(metric, list, lineNo));
  }

  // Exactly one point's attribution is shown, so exactly one cell or chip is selected.
  function selectDetail(node) {
    Array.prototype.forEach.call(
      document.querySelectorAll('.mark.sel, .bit.sel'),
      function (n) { n.classList.remove('sel'); }
    );
    node.classList.add('sel');
  }

  function bitCell(group, cell) {
    var label = group.base + (cell.bit == null ? '' : '[' + cell.bit + ']');
    var node = elem('span', 'bit');
    if (cell.absent) {
      node.classList.add('absent');
      node.title = label + ' — no toggle point in this run';
      return node;
    }
    var up = cell.up, down = cell.down;
    var upHits = up ? hitsFor(up) : null;
    var downHits = down ? hitsFor(down) : null;
    if (upHits > 0) { node.classList.add('up'); }
    if (downHits > 0) { node.classList.add('down'); }
    node.title = label + ' — 0→1: ' + (up ? upHits + ' hits' : 'no point') +
      ' · 1→0: ' + (down ? downHits + ' hits' : 'no point');
    if (state.focusItem &&
        ((up && up.name === state.focusItem) || (down && down.name === state.focusItem))) {
      node.classList.add('sel');
    }
    // Open the uncovered direction when only one is uncovered; otherwise 0→1.
    var pick = up;
    if (up && down && upHits > 0 && downHits === 0) { pick = down; }
    else if (up && down && downHits > 0 && upHits === 0) { pick = up; }
    else if (!up) { pick = down; }
    node.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (!pick) { return; }
      selectDetail(node);
      showPoint('toggle', pick);
    });
    return node;
  }

  function renderToggleGroup(group) {
    var wrap = elem('div', 'tg');
    var head = elem('div', 'tg-head');
    var name = elem('span', 'tg-name', group.base);
    name.title = group.module ? group.base + ' · ' + group.module : group.base;
    head.appendChild(name);
    if (!group.scalar) {
      head.appendChild(elem('span', 'tg-range', '[' + group.max + ':' + group.min + ']'));
    }
    var covered = 0;
    group.cells.forEach(function (cell) {
      if (cell.up && hitsFor(cell.up) > 0) { covered += 1; }
      if (cell.down && hitsFor(cell.down) > 0) { covered += 1; }
    });
    head.appendChild(elem('span', 'tg-sum', covered + '/' + group.total + ' dirs'));
    wrap.appendChild(head);
    var rows = elem('div', 'tg-rows');
    chunkBits(group.cells, 32).forEach(function (cells) {
      var row = elem('div', 'tg-row');
      cells.forEach(function (cell, i) {
        var node = bitCell(group, cell);
        // Byte gap after bits that are multiples of 8, except the last cell of a row.
        if (cell.bit != null && cell.bit % 8 === 0 && i < cells.length - 1) {
          node.classList.add('sep');
        }
        row.appendChild(node);
      });
      rows.appendChild(row);
    });
    wrap.appendChild(rows);
    return wrap;
  }

  // With the lens off and points from several elaborations, show a subhead with its own score per elaboration;
  // the subhead enters the lens.
  function renderDetailBody(metric, entries) {
    var groups = state.elab ? null : elaborationGroups(entries, hitsFor);
    if (!groups || groups.length < 2) {
      els.detailBody.appendChild(detailBlock(metric, entries));
      return;
    }
    groups.forEach(function (group) {
      els.detailBody.appendChild(elabSubhead(group));
      els.detailBody.appendChild(detailBlock(metric, group.entries));
    });
  }

  function detailBlock(metric, entries) {
    if (metric === 'toggle') {
      var grid = elem('div', 'tgs');
      groupToggles(entries).forEach(function (group) {
        grid.appendChild(renderToggleGroup(group));
      });
      return grid;
    }
    // Non-toggle metrics keep named chips: there are few per line and the name is the information.
    var chips = elem('div', 'tg-chips');
    entries.forEach(function (entry) { chips.appendChild(namedMark(entry)); });
    return chips;
  }

  function elabSubhead(group) {
    var head = elem('div', 'elab-head');
    var chip = elem('span', 'pill act',
      group.module ? baseElabLabel(group.module) : '(no module)');
    chip.title = (group.module || 'points with no module recorded') +
      '\nclick to count only this elaboration, here and in the columns above';
    chip.addEventListener('click', function (ev) {
      ev.stopPropagation();
      setElab(group.module || null);
    });
    head.appendChild(chip);
    head.appendChild(elem('span', 'muted', group.hit + '/' + group.entries.length));
    return head;
  }

  function detailWhere(lineNo) {
    var where = elem('span', 'where',
      (state.file || '').split('/').pop() + ':' + lineNo);
    where.title = state.file + ':' + lineNo;
    els.detailHead.appendChild(where);
  }

  function appendDetailClose() {
    els.detailHead.appendChild(elem('span', 'grow'));
    var close = elem('button', null, '×');
    close.title = 'Close the detail panel';
    close.addEventListener('click', function (ev) {
      ev.stopPropagation();
      closeDetail();
    });
    els.detailHead.appendChild(close);
  }

  function closeDetail() {
    els.detail.hidden = true;
    clear(els.detailHead);
    clear(els.detailBody);
    clear(els.point);
    els.point.hidden = true;
    Array.prototype.forEach.call(
      els.srcBody.querySelectorAll('.mark.badge.open'),
      function (badge) { badge.classList.remove('open'); }
    );
    Array.prototype.forEach.call(
      els.srcBody.querySelectorAll('tr.open'),
      function (tr) { tr.classList.remove('open'); }
    );
    state.expandedLine = null;
    state.expandedMetric = null;
  }

  // Cell clicks only inspect; unlike a row click they do not drive the editor or the schematic.
  function bindCellClick(node, lineNo, metric) {
    node.addEventListener('click', function (ev) {
      ev.stopPropagation();
      toggleDetail(lineNo, metric);
    });
  }

  function bindDetailToRow(host, lineNo, metric, opts) {
    els.detail.hidden = false;
    state.expandedLine = lineNo;
    state.expandedMetric = metric;
    host.classList.add('open');
    host.scrollIntoView({ block: opts.scroll ? 'center' : 'nearest' });
  }

  function openDetail(lineNo, metric, opts) {
    opts = opts || {};
    closeDetail();
    var host = els.srcBody.querySelector('tr[data-line="' + lineNo + '"]');
    var entries = entriesOn(lineNo, metric);
    if (!host || !entries.length || !collapses(metric, entries)) { return false; }

    detailWhere(lineNo);
    var hit = 0;
    entries.forEach(function (entry) { if (hitsFor(entry.point) > 0) { hit += 1; } });
    els.detailHead.appendChild(elem('span', 'pill',
      METRIC_INITIAL[metric] + ' ' + hit + '/' + entries.length));
    if (state.test) { els.detailHead.appendChild(lensPill()); }
    if (state.elab) { els.detailHead.appendChild(elabPill()); }
    appendDetailClose();

    renderDetailBody(metric, entries);

    bindDetailToRow(host, lineNo, metric, opts);
    var cell = host.querySelector('td.marks[data-metric="' + metric + '"]');
    Array.prototype.forEach.call((cell || host).querySelectorAll('.mark.badge'),
      function (badge) { badge.classList.add('open'); });
    return true;
  }

  // The slot is a (line, metric) pair, so a second click on the same badge closes the panel.
  function toggleDetail(lineNo, metric) {
    if (state.expandedLine === lineNo && state.expandedMetric === metric) {
      closeDetail();
      return;
    }
    if (metric === 'line') { openLineDetail(lineNo, {}); }
    else { openDetail(lineNo, metric, {}); }
  }

  // The hit-count column opens the same panel as a badge.
  function openLineDetail(lineNo, opts) {
    opts = opts || {};
    closeDetail();
    var host = els.srcBody.querySelector('tr[data-line="' + lineNo + '"]');
    var point = linePoints[lineNo];
    if (!host || !point) { return false; }
    detailWhere(lineNo);
    els.detailHead.appendChild(elem('span', 'pill', 'line'));
    if (point.points.length > 1) {
      els.detailHead.appendChild(elem('span', 'pill',
        METRIC_INITIAL.line + ' ' + point.hit + '/' + point.points.length));
    }
    els.detailHead.appendChild(elem('span', 'pill', hitsFor(point) + ' hits'));
    if (state.test) { els.detailHead.appendChild(lensPill()); }
    if (state.elab) { els.detailHead.appendChild(elabPill()); }
    appendDetailClose();
    bindDetailToRow(host, lineNo, 'line', opts);
    showPoint('line', point);
    return true;
  }

  // Find the (line, metric) cell holding the focused item; the point's name identifies its column.
  function focusedCell() {
    var found = null;
    if (!state.focusItem) { return null; }
    Object.keys(lineMarks).forEach(function (key) {
      if (found) { return; }
      (lineMarks[key] || []).forEach(function (entry) {
        if (found || entry.point.name !== state.focusItem) { return; }
        found = { line: parseInt(key, 10), metric: entry.metric };
      });
    });
    // A lone named point is its own chip and has no panel to open.
    if (found && !collapses(found.metric, entriesOn(found.line, found.metric))) {
      return null;
    }
    return found;
  }

  // Set from the picker or a column header; ranks the file list.
  function setMetric(metric) {
    if (METRICS.indexOf(metric) < 0 || state.metric === metric) { return; }
    state.metric = metric;
    els.metric.value = metric;
    renderFiles();
    if (state.file) { renderFile(); }
  }

  // A file's totals for one metric. Without a lens these are the model's numbers (as in `rb cov summary`); with one they are
  // recounted so the header matches the cells below. The test lens changes who hit the points; the elaboration lens changes
  // which points exist, so `found` is recounted too. Both on is the intersection.
  function fileTotals(row, metric) {
    var t = shownTotals(row, metric);
    var elab = state.elab;
    if (!state.test && !elab) { return t; }
    if (!elab && !t.found) { return t; }
    // Source points under a test lens: collapse the file's points the way its source_totals did.
    if (!elab && state.by === FIGURES_SOURCE && row.source_totals) {
      return sourceCount(row[metric], hitsFor);
    }
    var points = pointsOfElaboration(row[metric], elab);
    var found = elab ? points.length : t.found;
    var hit = 0;
    points.forEach(function (point) { if (hitsFor(point) > 0) { hit += 1; } });
    return { found: found, hit: hit, ratio: found ? hit / found : null };
  }

  function renderSrcHead(row) {
    clear(els.srcHead);
    var tr = document.createElement('tr');
    tr.appendChild(elem('th', 'no'));
    METRICS.forEach(function (metric) {
      var t = fileTotals(row, metric);
      var th = elem('th', 'mh' + (metric === state.metric ? ' sort' : ''));
      th.dataset.metric = metric;
      // Two lines and whole percents keep five columns narrow.
      th.appendChild(elem('div', 'mh-top',
        METRIC_INITIAL[metric] + ' ' +
        (t.found ? Math.round(t.ratio * 100) + '%' : '—')));
      if (t.found) { th.appendChild(elem('div', 'mh-num', t.hit + '/' + t.found)); }
      var unit = state.by === FIGURES_SOURCE && row.source_totals && !state.elab
        ? ' source points' : ' points';
      th.title = metric + (t.found
        ? ': ' + t.hit + ' of ' + t.found + unit + ' in this file hit' +
          (state.test ? ' by ' + state.test : '') +
          (state.elab ? ', counting only ' + state.elab : '')
        : ': no points in this file' + (state.elab ? ' for ' + state.elab : '')) +
        '\nclick to rank the file list on ' + metric;
      th.addEventListener('click', function () { setMetric(metric); });
      tr.appendChild(th);
    });
    tr.appendChild(elem('th', 'code', 'source'));
    els.srcHead.appendChild(tr);
  }

  function renderFile() {
    var row = state.byPath[state.file];
    if (!row) { return; }
    clear(els.fileHead);
    var back = elem('button', null, '← overview');
    back.title = 'Back to the run dashboard.';
    back.addEventListener('click', showDashboard);
    els.fileHead.appendChild(back);
    els.fileHead.appendChild(elem('span', 'path', row.path));
    // Chips show the source module name and list the elaborated names in the tooltip. The graph is sent the source name,
    // the only one it has nodes for. The first chip is the primary module the send buttons use.
    var primary = null;
    moduleChips(row.modules).forEach(function (chip) {
      if (primary === null) { primary = chip.base; }
      var pill = elem('span', 'pill act', chip.base);
      var elaborated = chip.names.length > 1 || chip.names[0] !== chip.base
        ? 'elaborated as ' + chip.names.join(', ') + '\n' : '';
      pill.title = elaborated + 'click to focus module:' + chip.base +
        ' in the graph pane';
      pill.addEventListener('click', function () { focusModuleElsewhere(chip.base); });
      els.fileHead.appendChild(pill);
    });
    actionsBase = primary;
    actionsEl = renderActions(actionsBase);
    els.fileHead.appendChild(actionsEl);
    // Show the lens control only when the file has more than one elaboration.
    var elabs = elaborationsOf(row, METRICS);
    if (state.elab && elabs.indexOf(state.elab) < 0) { state.elab = null; }
    if (elabs.length > 1) {
      els.fileHead.appendChild(elabControl(elaborationSegments(elabs)));
    }
    if (state.test) { els.fileHead.appendChild(lensPill()); }

    var lines = state.sources[row.path];
    var byLine = foldLinePoints(pointsOfElaboration(row.line, state.elab), hitsFor);
    var marks = pointsByLine(row);
    lineMarks = marks;
    linePoints = byLine;
    // The rows are rebuilt below, so reset the open line and reopen it against the new rows.
    var reopen = state.expandedLine;
    var reopenMetric = state.expandedMetric;
    state.expandedLine = null;
    var last = lines ? lines.length : 0;
    Object.keys(byLine).concat(Object.keys(marks)).forEach(function (n) {
      last = Math.max(last, parseInt(n, 10) || 0);
    });

    renderSrcHead(row);
    clear(els.srcBody);
    var target = null;
    for (var n = 1; n <= last; n++) {
      var tr = elem('tr');
      tr.dataset.line = String(n);
      tr.appendChild(elem('td', 'no', n));

      // One column per metric, in the run's order, independent of the ranking metric.
      METRICS.forEach(function (metric) {
        var cell = elem('td', 'marks' + (metric === 'line' ? ' hits' : ''));
        cell.dataset.metric = metric;
        if (metric === 'line') {
          // The L column is a hit count, not a badge, tinted by the share of the line's points hit.
          var point = byLine[n];
          if (point) {
            var h = hitsFor(point);
            var many = point.points.length > 1;
            cell.textContent = h;
            cell.title = (many
              ? point.hit + ' of ' + point.points.length + ' line points on this line hit\n'
              : '') + attribution(point) + '\nclick for the detail panel';
            tint(cell, point.hit / point.points.length);
            cell.classList.add('act');
            bindCellClick(cell, n, 'line');
          }
          tr.appendChild(cell);
          return;
        }
        var box = elem('div', 'marks-in');
        renderCell(box, n, metric);
        cell.appendChild(box);
        tr.appendChild(cell);
      });

      var code = elem('td', 'code', lines && lines[n - 1] != null ? lines[n - 1] : '');
      tr.appendChild(code);

      (function (lineNo) {
        tr.addEventListener('click', function () { activateLine(lineNo); });
      })(n);
      if (state.focusLine === n) { tr.classList.add('hot'); target = tr; }
      els.srcBody.appendChild(tr);
    }
    closeDetail();
    if (target) { target.scrollIntoView({ block: 'center' }); }
    // A focused point wins over the open panel; otherwise the panel survives a re-render.
    var cell = focusedCell();
    var open = cell ? cell.line : reopen;
    var metric = cell ? cell.metric : reopenMetric;
    if (open == null || !metric) { return; }
    if (metric === 'line') { openLineDetail(open, { scroll: target == null }); }
    else { openDetail(open, metric, { scroll: target == null }); }
  }

  function showDashboard() {
    state.file = null;
    state.focusLine = null;
    state.focusItem = null;
    // The elaboration lens applies within one file.
    state.elab = null;
    closeDetail();
    els.file.hidden = true;
    els.dash.hidden = false;
    renderFiles();
  }

  // One point's attribution, docked in the line's panel; clicking another cell updates it in place.
  function showPoint(metric, point) {
    clear(els.point);
    els.point.hidden = false;
    els.detail.hidden = false;
    if (!els.detailHead.firstChild) {
      // A chip kept inline has no line panel, so create a header to close from.
      var where = elem('span', 'where',
        (state.file || '').split('/').pop() + ':' + point.line);
      where.title = state.file + ':' + point.line;
      els.detailHead.appendChild(where);
      appendDetailClose();
    }
    // Line points have no name, and the panel header already names the metric.
    var parts = [];
    if (metric !== 'line') { parts.push(metric); }
    if (point.name) { parts.push(point.name); }
    // Text uses the source module name; the tooltip carries the elaborated key.
    if (point.module) { parts.push(baseModuleName(point.module)); }
    parts.push('line ' + point.line, 'hits ' + (point.hits || 0));
    var head = elem('strong', null, parts.join(' · '));
    if (point.module && baseModuleName(point.module) !== point.module) {
      head.title = 'elaborated as ' + point.module;
    }
    els.point.appendChild(head);
    var tests = point.tests || {};
    var names = Object.keys(tests).sort();
    if (!names.length) {
      els.point.appendChild(elem('div', 'muted', 'no per-test attribution'));
      return;
    }
    var table = document.createElement('table');
    var tbody = document.createElement('tbody');
    names.forEach(function (name) {
      var tr = elem('tr', 'row');
      tr.appendChild(elem('td', null, name));
      var td = elem('td', null, tests[name]);
      if (!tests[name]) { td.className = 'faint'; }
      tr.appendChild(td);
      tr.addEventListener('click', function () {
        setLens(state.test === name ? null : name);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    els.point.appendChild(table);
  }

  // ---------------------------------------------------------------
  // clicks → hub envelopes
  // ---------------------------------------------------------------

  function activateLine(line) {
    state.focusLine = line;
    Array.prototype.forEach.call(els.srcBody.children, function (tr) {
      tr.classList.toggle('hot', tr.dataset.line === String(line));
    });
    var did = [];
    if (els.optSelect.checked) {
      // source_focused, not selection_changed: this pane knows files and modules, not instance paths, so the hub's
      // resolver derives the schematic selection.
      if (emit('source_focused', { file: state.file, line: line, col: 1 })) {
        did.push('focus ' + state.file + ':' + line);
      }
    }
    if (els.optOpen.checked) {
      var payload = { file: state.file, line: line, col: 1 };
      if (request('open_source', payload, function (reply) {
        if (reply.kind === 'error') {
          note(reply.payload.code === 'not_connected'
            ? 'no editor connected — start nvim with the rtl-buddy plugin (rb nvim-install), or untick "open in editor"'
            : 'open_source: ' + reply.payload.code + ': ' + reply.payload.message, 'error');
        }
      })) {
        did.push('open ' + payload.file + ':' + line);
      }
    }
    if (did.length) { note(did.join('  ·  ')); }
    else if (!wsReady) { note('hub not connected', 'error'); }
  }

  function focusModuleElsewhere(base) {
    // Send the source name (baseModuleName): the graph has no node for an elaborated name, and a graph_focus miss is silent.
    var name = baseModuleName(base);
    if (emit('graph_focus', { node: 'module:' + name })) {
      note('graph-focus module:' + name);
      return true;
    }
    note('hub not connected', 'error');
    return false;
  }

  // ---------------------------------------------------------------
  // cross-app actions
  // ---------------------------------------------------------------

  // `send → X` sends the open file's module to an already open X tab. Both apps get the same graph_focus envelope
  // (`module:<name>`), which the graph pane and the schematic both understand. The hub replays the latest one to
  // peers that register later (_replay_cached_state in hub/server.py).
  var APPS = [
    { origin: 'graph', prose: 'the graph pane' },
    { origin: 'view', prose: 'the schematic' }
  ];

  var OVERLAP = 'Hub events are broadcasts: this same graph_focus moves ' +
    'the graph pane AND the schematic, whichever of them is open.';
  var NO_MODULE = 'This file records no module, so there is nothing to ' +
    'point the other apps at.';

  function actionButton(label, title, disabled, onClick) {
    var b = elem('button', null, label);
    b.title = title;
    if (disabled) { b.disabled = true; } else { b.addEventListener('click', onClick); }
    return b;
  }

  // Sends only: opening an app is the header switcher's job, and the hub replays the cached focus to late joiners.
  function renderActions(base) {
    var box = elem('div', 'actions');
    APPS.forEach(function (app) {
      var live = hasPeer(app.origin);
      box.appendChild(actionButton(
        'send → ' + originLabel(app.origin),
        !base ? NO_MODULE
           : !live ? app.prose + ' is not connected — open it from the header links'
           : 'Send module:' + baseModuleName(base) + ' to ' + app.prose +
             ', without leaving this tab. ' + OVERLAP,
        !base || !live,
        function () { focusModuleElsewhere(base); }));
    });
    return box;
  }

  // Rebuilt in place when the peer list changes; re-rendering the file would lose the scroll position and open panel.
  var actionsEl = null, actionsBase = null;

  function refreshActions() {
    if (!actionsEl || !actionsEl.parentNode) { return; }
    var next = renderActions(actionsBase);
    actionsEl.parentNode.replaceChild(next, actionsEl);
    actionsEl = next;
  }

  // ---------------------------------------------------------------
  // inbound focus
  // ---------------------------------------------------------------

  function focusFile(path, opts) {
    opts = opts || {};
    if (typeof path !== 'string' || !path) { return false; }
    var row = state.byPath[path];
    if (!row) {
      // Absolute paths are accepted; the model keys project-relative paths, so try a suffix match.
      var hit = Object.keys(state.byPath).filter(function (known) {
        return path.endsWith('/' + known) || known.endsWith('/' + path);
      });
      if (hit.length !== 1) { return false; }
      path = hit[0];
    }
    return selectFile(path, { line: opts.line, item: opts.item, metric: opts.metric });
  }

  // Senders may name a module by source or elaborated name; resolve to the elaborated name before filtering.
  function focusModule(name, opts) {
    var known = Object.keys(state.modules).sort();
    var resolved = resolveModuleName(known, name);
    if (resolved === null) { return false; }
    var rows = ((state.payload && state.payload.files) || []).filter(function (row) {
      return (row.modules || []).indexOf(resolved) >= 0;
    });
    if (!rows.length) { return false; }
    state.module = resolved;
    els.module.value = resolved;
    renderFiles();
    // Naming an elaboration verbatim turns the lens on. Naming the module by its source name means the whole module, so the
    // lens stays off, as it does when the file has a single elaboration (its control is hidden).
    var spans = elaborationsOf(rows[0], METRICS).length > 1;
    var elab = spans && resolved === String(name) ? resolved : null;
    return selectFile(rows[0].path, {
      line: opts.line, item: opts.item, metric: opts.metric, elab: elab
    });
  }

  // The wire spells a test `test:<suite>#<name>` but the model keys the bare name, so match the fragment after `#`.
  // Exact match first.
  function focusTest(name) {
    var rows = (state.payload && state.payload.tests) || [];
    function known(candidate) {
      return rows.some(function (row) { return row.name === candidate; });
    }
    if (!known(name)) {
      var hash = String(name).lastIndexOf('#');
      var bare = hash < 0 ? null : String(name).slice(hash + 1);
      if (!bare || !known(bare)) { return false; }
      name = bare;
    }
    state.test = name;
    renderTests();
    if (state.file) { renderFile(); }
    return true;
  }

  function applyFocus(payload) {
    if (!state.payload) {
      // The hub replays a cached focus on connect, usually before the model loads; hold it until then.
      state.pending = payload;
      return;
    }
    var target = payload && payload.target;
    if (typeof target !== 'string' || !target) { return; }
    var opts = { line: payload.line, item: payload.item, metric: payload.metric };
    var ok;
    if (target.indexOf('module:') === 0) {
      ok = focusModule(target.slice(7), opts);
    } else if (target.indexOf('test:') === 0) {
      ok = focusTest(target.slice(5));
    } else {
      ok = focusFile(target.indexOf('file:') === 0 ? target.slice(5) : target, opts);
    }
    // A miss is soft: report it and keep the current focus.
    note(ok ? 'focused ' + target : 'cov-focus: no ' + target + ' in this run',
         ok ? null : 'warn');
  }

  function focusByInstancePath(ip) {
    if (Array.isArray(ip)) { ip = ip[0]; }
    if (typeof ip !== 'string' || !ip || !state.payload) { return; }
    // Heuristic: strip common instance prefixes off the leaf and match a module. A miss does nothing.
    var leaf = ip.split('.').pop();
    var candidates = [leaf, leaf.replace(/^(u|i|inst|dut)_/, '')];
    var known = Object.keys(state.modules).sort();
    for (var i = 0; i < candidates.length; i++) {
      // Instance names are source names, resolved like an inbound module target.
      if (resolveModuleName(known, candidates[i]) !== null) {
        focusModule(candidates[i], {});
        return;
      }
    }
  }

  // ---------------------------------------------------------------
  // wiring
  // ---------------------------------------------------------------

  els.metric.addEventListener('change', function () {
    state.metric = els.metric.value;
    renderFiles();
    if (state.file) { renderFile(); }
  });
  els.by.addEventListener('change', function () { setBy(els.by.value); });
  els.module.addEventListener('change', function () {
    state.module = els.module.value;
    renderFiles();
  });
  els.search.addEventListener('input', function () {
    state.filter = els.search.value.trim().toLowerCase();
    renderFiles();
  });
  els.cold.addEventListener('change', function () {
    state.coldOnly = els.cold.checked;
    renderFiles();
  });
  document.getElementById('reload').addEventListener('click', function () {
    state.sources = Object.create(null);
    load();
  });
  // The status word doubles as the take-back control while superseded; takeBack does nothing otherwise.
  els.wsStatus.addEventListener('click', takeBack);
  els.wsStatus.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); takeBack(); }
  });

  relabelSwitcher();
  state.by = openedBy(location.search);
  els.by.value = state.by;
  connect();
  load();
})();
</script>
</body>
</html>
