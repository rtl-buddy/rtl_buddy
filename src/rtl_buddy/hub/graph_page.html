    var plus = text.indexOf('+');
    var base = plus < 0 ? text : text.slice(0, plus);
    if (!base) { return null; }
    var local = plus < 0 ? '' : text.slice(plus + 1);
    var found = /(^|[.\-_])g([0-9a-fA-F]{4,})(?=$|[.\-_])/.exec(local);
    return found ? base + ' @ ' + found[2].slice(0, 9) : base;
  }
  // <<< version-label

  // Re-read on every welcome: a reconnect can land on a hub restarted on a
  // newer build. Kept so the strip's tooltip can be restored after
  // `showSuperseded` borrows it.
  var hubTitle = '';

  function setHubVersion(raw) {
    var full = raw ? String(raw) : '';
    var label = versionLabel(full);
    els.hubVersion.textContent = label ? 'rtl-buddy ' + label : '';
    els.hubVersion.title = full;
    hubTitle = 'hub ' + full;
    els.wsStatus.title = hubTitle;
  }

  // ---------------------------------------------------------------
  // graph loading + indexing
  // ---------------------------------------------------------------

  function load() {
    note('loading ' + GRAPH_URL + '…');
    fetch(GRAPH_URL, { cache: 'no-store' }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (res) {
      if (!res.ok) { showEmpty(res.body && res.body.error); return; }
      ingest(res.body);
    }).catch(function (e) {
      showEmpty('could not read ' + GRAPH_URL + ': ' + e);
    });
  }

  function showEmpty(message) {
    els.empty.classList.add('show');
    els.emptyMsg.textContent = '';
    // Mascot on the "no data yet" panel: the pane's only artwork (identity
    // marks only).
    var art = document.createElement('img');
    art.src = '/hub/assets/rtl-buddy-mascot-240.png';
    art.width = 120; art.height = 120; art.alt = '';
    els.emptyMsg.appendChild(art);
    var p = document.createElement('p');
    p.textContent = message || 'no graph to show.';
    var q = document.createElement('p');
    q.className = 'muted';
    q.appendChild(document.createTextNode('Build one with '));
    var c = document.createElement('code'); c.textContent = 'rb graph build';
    q.appendChild(c);
    q.appendChild(document.createTextNode(', then press reload.'));
    els.emptyMsg.appendChild(p); els.emptyMsg.appendChild(q);
    note('');
  }

  // ---------------------------------------------------------------
  // the physical model: /phy.json, its run selector, its muted state
  // ---------------------------------------------------------------

  // The label the markup gives the heat control, kept so the muted state can
  // borrow the title and give it back.
  var heatTitle = els.optHeatWrap.title;
  var heatRunTitle = els.heatRunWrap.title;

  // >>> heat-run-url
  // The run selector as pure rules: the URL for a run, what a selector value
  // means, how an entry reads, and which entries are offered.
  //
  // `null` (an empty selector value) means the newest manifest, the bare
  // `/phy.json`. A pane left alone follows the run that finished last; choosing
  // the entry marked `newest` keeps following rather than pinning today's
  // newest directory. Same as the /phy pane's `requestedDir` and `runValue`:
  // one `?dir=` coordinate, so a run chosen in either pane is the same run.
  function heatPhyUrl(base, dir) {
    if (!dir) { return base; }
    return base + (base.indexOf('?') >= 0 ? '&' : '?') +
           'dir=' + encodeURIComponent(dir);
  }

  // The run this TAB opened on, from its query string (`/gph?dir=<phys dir>`).
  // With no parameter the selector starts on the newest, as in /phy.
  function openedDir(search) {
    var found = /[?&]dir=([^&]*)/.exec(String(search == null ? '' : search));
    return found ? decodeURIComponent(found[1].replace(/\+/g, ' ')) : null;
  }

  // Entry label `run · top · mode (activity)`, leaving out parts the producers
  // did not record. A compact form of /phy's entry; the artefact directory and
  // configuration fingerprint go on the hover.
  //
  // Both marks are shown: which run the tints are OF, and which one a reload
  // with nothing selected would follow.
  function heatRunLabel(entry, shownManifest) {
    var parts = [(entry && entry.run) || (entry && entry.phys_dir) || '(unnamed)'];
    var mode = entry && entry.mode;
    var activity = entry && entry.activity && entry.activity.label;
    [entry && entry.top, mode && activity ? mode + ' (' + activity + ')' : mode]
      .forEach(function (part) { if (part) { parts.push(part); } });
    var marks = [];
    if (shownManifest && entry && entry.manifest === shownManifest) {
      marks.push('shown');
    }
    if (entry && entry.newest) { marks.push('newest — follows'); }
    return parts.join(' · ') + (marks.length ? ' [' + marks.join(', ') + ']' : '');
  }

  // The run being SHOWN, as a selector entry built from the payload header. The
  // listing is capped (`phys_page.RUNS_LIMIT`), so the shown run can fall off
  // its end when newer runs land; putting it back keeps the control consistent
  // with the tints (phys_page.html `shownEntry`).
  function shownRunEntry(payload) {
    if (!payload) { return null; }
    return {
      run: payload.run, top: payload.top,
      phys_dir: (payload.artefacts || {}).phys_dir,
      manifest: payload.manifest,
      mode: payload.power_mode, activity: payload.power_activity,
      fingerprint: null, newest: false, error: null
    };
  }

  function heatRunEntries(payload, block) {
    var entries = ((block && block.runs) || []).slice();
    var shown = (payload || {}).manifest || null;
    var listed = entries.some(function (entry) {
      return !!entry && entry.manifest === shown;
    });
    if (!listed) {
      var current = shownRunEntry(payload);
      if (current) { entries.unshift(current); }
    }
    return entries;
  }

  // What an entry selects with: the newest uses the EMPTY value, since pinning
  // its directory would stop following.
  function heatRunValue(entry) {
    return entry && entry.newest ? '' : String((entry && entry.phys_dir) || '');
  }
  // <<< heat-run-url

  // >>> heat-load-step
  // What one finished `/phy.json` fetch does to the pane, as a pure decision.
  // `shown` is `{phys: <payload|null>, dir: <selected run|null>}`; `result` is
  // `{ok, requested, body, message}`.
  //
  // A refused run switch is a refusal of the SWITCH, not of the model on
  // screen: the selected run is committed only when a body arrives, and a
  // failure with a payload in hand keeps the payload, the run and the overlay.
  // Mirrors /phy's `load` / `loadFailed`.
  //
  // With nothing ever loaded: a `?dir=` the tab was opened with may be a typo
  // or a pruned run, so the answer is `refetch` (ask for the newest and say the
  // requested run was not found). With no run requested there is nothing to try
  // and the control is muted.
  function physLoadStep(shown, result) {
    var held = shown && shown.phys;
    if (result && result.ok) {
      return {
        phys: result.body, dir: (result.requested || null),
        refetch: false, message: null, level: 'info'
      };
    }
    var message = (result && result.message) || null;
    if (held) {
      return {
        phys: held, dir: (shown.dir || null), refetch: false,
        message: message || 'could not read that run', level: 'error'
      };
    }
    if (result && result.requested) {
      return {
        phys: null, dir: null, refetch: true,
        message: 'physical run ' + result.requested + ' could not be read' +
          (message ? ' (' + message + ')' : '') + ' — showing the newest run',
        level: 'warn'
      };
    }
    return { phys: null, dir: null, refetch: false, message: message, level: 'warn' };
  }
  // <<< heat-load-step

  // Which fetch is current: a response from a request a later one superseded
  // must not commit.
  var physGeneration = 0;

  // One-shot status line for the NEXT successful ingest; the fallback refetches
  // at once, so a warning written earlier would be overwritten by `loading…`.
  var physPendingNote = null;

  function loadPhys(requested) {
    if (!PHY_URL) { mutePhys(HEAT_ABSENT); return; }
    // The run this FETCH is for; `state.physDir` moves in `applyPhysLoad`, on
    // success only.
    var dir = arguments.length ? (requested || null) : state.physDir;
    var url = heatPhyUrl(PHY_URL, dir);
    var generation = ++physGeneration;
    note('loading ' + url + '…');
    fetch(url, { cache: 'no-store' }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (res) {
      applyPhysLoad(generation, {
        ok: res.ok, requested: dir, body: res.body,
        message: (res.body && res.body.error) || null
      });
    }).catch(function (e) {
      applyPhysLoad(generation, {
        ok: false, requested: dir, body: null,
        message: 'could not read ' + url + ': ' + e
      });
    });
  }

  function applyPhysLoad(generation, result) {
    if (generation !== physGeneration) { return; }
    var next = physLoadStep({ phys: state.phys, dir: state.physDir }, result);
    state.phys = next.phys;
    state.physDir = next.dir;
    if (next.refetch) {
      state.heat = null;
      physPendingNote = next.message;
      loadPhys(null);
      return;
    }
    if (result.ok) { ingestPhys(next.phys); return; }
    if (next.phys) {
      // The model on screen is untouched, so only the picker moves, back to the
      // run being shown.
      renderHeatControls();
      note(next.message, next.level);
      return;
    }
    mutePhys(next.message);
  }

  // No model to paint with AT ALL (no manifest, or a first load with nothing to
  // fall back to). The control carries the reason (the 404 body when sent,
  // which names the commands that produce a model) and the tints come off. A
  // refused SWITCH never reaches here (`physLoadStep`).
  //
  // Controls only: start-up mutes them without a status line, because the
  // graph's own load writes there.
  function mutePhysControl(message) {
    els.optHeat.checked = false;
    els.optHeat.disabled = true;
    els.optHeatWrap.classList.add('muted');
    els.optHeatWrap.title = message || HEAT_ABSENT;
    els.heatMetricWrap.hidden = true;
    els.heatRunWrap.hidden = true;
  }

  function mutePhys(message) {
    mutePhysControl(message);
    state.phys = null;
    state.heat = null;
    physPendingNote = null;
    renderLegend(state.categories);
    render();
    renderInspector(state.selected ? state.byId[state.selected] : null);
    note(message || HEAT_ABSENT, 'warn');
    // A focus held for a model that is not coming can still be answered when
    // its target is a `module:` the graph carries (`drainPhysFocus`).
    drainPhysFocus();
  }

  function ingestPhys(payload) {
    state.phys = payload || null;
    var hub = (payload && payload.hub) || {};
    // Switcher order: the payload's, else the built-in list (older hub).
    if (Array.isArray(hub.metrics) && hub.metrics.length) { HEAT_METRICS = hub.metrics; }
    state.heat = joinPhys(state.links, state.phys);
    // A first load lands on a metric this model can answer; a metric the reader
    // chose is kept.
    if (!state.heatMetric || HEAT_METRICS.indexOf(state.heatMetric) < 0) {
      state.heatMetric = initialHeatMetric(payload);
    }
    els.optHeat.disabled = false;
    els.optHeatWrap.classList.remove('muted');
    els.optHeatWrap.title = heatTitle;
    renderHeatControls();
    renderLegend(state.categories);
    render();
    renderInspector(state.selected ? state.byId[state.selected] : null);
    noteHeat();
    if (physPendingNote) { note(physPendingNote, 'warn'); physPendingNote = null; }
    // A focus that arrived before the model is answered now.
    drainPhysFocus();
  }

  // Say what the join managed: an empty tint looks like a design that burns
  // nothing. The two causes (no synthesis half; no elaboration to attribute
  // rows through) have different fixes.
  function noteHeat() {
    var join = state.heat;
    if (!join || !els.optHeat.checked) { return; }
    var parts = ['heat: ' + state.heatMetric];
    if (join.rows.instances) {
      parts.push(join.attributed + '/' +
        (join.attributed + join.unattributed) + ' instance rows rolled up');
    }
    if (join.rows.instances && !join.rooted) {
      note(parts.join('  ·  ') + ' — no elaboration rooted at ' +
        (join.top || '(unknown top)') +
        ' in this graph, so no leaf power could be attributed', 'warn');
      return;
    }
    if (join.unattributed) {
      parts.push(join.unattributed + ' outside the design tier');
    }
    note(parts.join('  ·  '));
  }

  // The overlay's two selects appear with the overlay and cannot be populated
  // before the payload lands.
  function renderHeatControls() {
    if (!state.phys || !els.optHeat.checked) {
      els.heatMetricWrap.hidden = true;
      els.heatRunWrap.hidden = true;
      return;
    }
    renderHeatMetrics();
    renderHeatRuns();
  }

  function renderHeatMetrics() {
    var rows = (state.heat && state.heat.rows) || { modules: 0, instances: 0 };
    while (els.heatMetric.firstChild) {
      els.heatMetric.removeChild(els.heatMetric.firstChild);
    }
    HEAT_METRICS.forEach(function (metric) {
      var def = HEAT_METRIC_DEFS[metric] || {};
      var opt = document.createElement('option');
      opt.value = metric;
      // A metric whose half this run did not produce is kept, with the command
      // that would fill it, as in /phy.
      opt.textContent = (def.half && !rows[def.half])
        ? metric + ' (run ' + (HEAT_HALF_PRODUCER[def.half] || '?') + ')'
        : metric;
      els.heatMetric.appendChild(opt);
    });
    els.heatMetric.value = state.heatMetric;
    els.heatMetricWrap.hidden = !els.optHeat.checked;
  }

  function renderHeatRuns() {
    var block = (state.phys && state.phys.runs) || {};
    var shown = (state.phys || {}).manifest || null;
    var entries = heatRunEntries(state.phys, block);
    while (els.heatRun.firstChild) { els.heatRun.removeChild(els.heatRun.firstChild); }
    // RESET, never append: this runs on every render.
    els.heatRunWrap.title = heatRunTitle;
    entries.forEach(function (entry) {
      var opt = document.createElement('option');
      opt.value = heatRunValue(entry);
      opt.textContent = heatRunLabel(entry, shown);
      opt.title = [entry.phys_dir, entry.fingerprint, entry.error]
        .filter(function (part) { return !!part; }).join(' · ');
      els.heatRun.appendChild(opt);
      if (entry.manifest === shown) { els.heatRun.value = opt.value; }
    });
    if (typeof block.count === 'number' && block.count > entries.length) {
      els.heatRunWrap.title = heatRunTitle + ' Showing the newest ' +
        entries.length + ' of ' + block.count + ' runs; `rb phys runs` lists them all.';
    }
    // One run is not a choice; /phy hides its selector on the same test.
    els.heatRunWrap.hidden = !els.optHeat.checked || entries.length < 2;
  }

  function setHeatMetric(metric) {
    if (HEAT_METRICS.indexOf(metric) < 0) { return; }
    state.heatMetric = metric;
    els.heatMetric.value = metric;
    renderLegend(state.categories);
    render();
    renderInspector(state.selected ? state.byId[state.selected] : null);
    noteHeat();
  }

  function ingest(payload) {
    els.empty.classList.remove('show');
    state.nodes = (payload.nodes || []).filter(function (n) { return n && n.id; });
    state.links = (payload.links || []).filter(function (l) {
      return l && typeof l.source === 'string' && typeof l.target === 'string';
    });
    state.byId = Object.create(null);
    state.out = Object.create(null);
    state.inc = Object.create(null);
    state.nodes.forEach(function (n) { state.byId[n.id] = n; });
    state.links.forEach(function (l) {
      // A link endpoint with no node is a dangling target
      // (graph.merge.dangling_targets); materialise it as an attribute-less
      // node.
      [l.source, l.target].forEach(function (id) {
        if (!state.byId[id]) {
          var ghost = { id: id, type: 'dangling', label: id, dangling: true };
          state.byId[id] = ghost; state.nodes.push(ghost);
        }
      });
      (state.out[l.source] = state.out[l.source] || []).push(l);
      (state.inc[l.target] = state.inc[l.target] || []).push(l);
    });

    var hub = (payload.graph && payload.graph.hub) || {};
    if (Array.isArray(hub.columns) && hub.columns.length) { COLUMNS = hub.columns; }
    state.coverage = hub.coverage || null;
    // Show the control only when there is coverage, ticked.
    els.optCovWrap.hidden = !state.coverage;
    if (state.coverage && !els.optCov.dataset.touched) { els.optCov.checked = true; }
    // The physical join spans both documents and the graph just changed (a
    // rebuild renames, adds and drops the instance nodes the roll-up walks), so
    // recompute it. The model is not re-fetched; `reload` does that while the
    // overlay is on.
    if (state.phys) {
      state.heat = joinPhys(state.links, state.phys);
      // Per-half annotations and picker marks follow the join.
      renderHeatControls();
    }
    renderHeader(hub);
    state.categories = hub.categories || {};
    renderLegend(state.categories);
    layoutInit();
    render();
    fit();
    startTicking();
    note(state.nodes.length + ' nodes, ' + state.links.length + ' links');
  }

  function renderHeader(hub) {
    var parts = [];
    var c = hub.counts || {};
    parts.push((c.nodes != null ? c.nodes : state.nodes.length) + ' nodes');
    parts.push((c.links != null ? c.links : state.links.length) + ' links');
    var s = hub.overlay_summary;
    if (s && s.statuses) {
      var st = Object.keys(s.statuses).sort().map(function (k) {
        return s.statuses[k] + ' ' + k;
      });
      if (st.length) { parts.push(st.join(' / ')); }
    } else if (hub.overlay_path == null) {
      parts.push('no results overlay');
    }
    var cs = hub.coverage && hub.coverage.summary;
    if (cs) {
      parts.push(pct((hub.coverage.totals && hub.coverage.totals.line || {}).ratio) +
        ' line');
      parts.push(cs.exercised + '/' + cs.items + ' items exercised');
      if (cs['observed-but-undeclared']) {
        parts.push(cs['observed-but-undeclared'] + ' undeclared');
      }
    }
    els.counts.textContent = '· ' + parts.join(' · ');
  }

  function renderLegend(counts) {
    els.legend.textContent = '';
    COLUMNS.forEach(function (col) {
      var count = counts[col] || 0;
      // An empty flow column is a fact about the project (no fpv suites yet),
      // so it keeps its band and label; only an empty `other` drops out of the
      // legend.
      if (!count && col === 'other') { return; }
      var label = document.createElement('label');
      label.className = 'chk';
      var box = document.createElement('input');
      box.type = 'checkbox'; box.checked = !state.hiddenCols[col];
      box.addEventListener('change', function () {
        state.hiddenCols[col] = !box.checked;
        render();
      });
      var sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = COLUMN_COLOR[col] || 'var(--col-other)';
      label.appendChild(box); label.appendChild(sw);
      label.appendChild(document.createTextNode(col + ' ' + count));
      els.legend.appendChild(label);
    });
    renderHeatLegend();
    if (!coverageOn()) { return; }
    var ramp = document.createElement('span');
    ramp.className = 'legend';
    ramp.title = 'Design nodes are filled by line coverage; a coverage item is ' +
      'ringed by whether the run exercised it.';
    [['0%', 0], ['50%', 0.5], ['100%', 1], ['no data', null]].forEach(function (stop) {
      var sw = document.createElement('span');
      sw.className = 'cov-swatch';
      tintHue(sw, stop[1]);
      var wrap = document.createElement('span');
      wrap.className = 'chk';
      wrap.appendChild(sw);
      wrap.appendChild(document.createTextNode(stop[0]));
      ramp.appendChild(wrap);
    });
    els.legend.appendChild(ramp);
  }

  // Heat ramp legend: the three stops plus "not measured", labelled with the
  // values they stand for.
  function renderHeatLegend() {
    if (!heatOn()) { return; }
    var max = heatMaxOf(moduleNamesInGraph(), state.heat, state.heatMetric);
    var ramp = document.createElement('span');
    ramp.className = 'legend';
    ramp.title = 'Module nodes are filled by ' + state.heatMetric +
      ', against the largest module in this graph. Cells and area are the ' +
      'module definition’s, from the synthesis half; power is summed ' +
      'over every instantiation of the module.';
    ramp.appendChild(document.createTextNode(state.heatMetric));
    [[0, 0], [0.5, 0.5], [1, 1], [null, null]].forEach(function (stop) {
      var sw = document.createElement('span');
      sw.className = 'heat-swatch';
      var value = stop[0] === null || max === null ? null : stop[0] * max;
      heatTint(sw, value, max);
      var wrap = document.createElement('span');
      wrap.className = 'chk';
      wrap.appendChild(sw);
      wrap.appendChild(document.createTextNode(
        stop[0] === null ? 'not measured' : heatFmt(value, state.heatMetric)));
      ramp.appendChild(wrap);
    });
    els.legend.appendChild(ramp);
  }

  // Every module name the graph carries: the domain of the ramp scale
  // (`heatMaxOf`).
  function moduleNamesInGraph() {
    var names = [];
    state.nodes.forEach(function (n) {
      if (n.type !== 'module' || n.dangling) { return; }
      var name = heatModuleName(n, state.out[n.id]);
      if (name) { names.push(name); }
    });
    return names;
  }

  // ---------------------------------------------------------------
  // layout: columns + a small force relaxation
  // ---------------------------------------------------------------

  var colX = [];

  function layoutInit() {
    var used = {};
    state.nodes.forEach(function (n) { used[colOf(n)] = true; });
    var ncol = COLUMNS.length;
    colX = [];
    for (var i = 0; i < ncol; i++) { colX.push(((i + 0.5) / ncol) * W); }

    var perCol = {};
    state.nodes.forEach(function (n) {
      var c = colOf(n);
      perCol[c] = (perCol[c] || 0) + 1;
    });
    var seen = {};
    state.nodes.forEach(function (n) {
      var c = colOf(n);
      var i = seen[c] = (seen[c] || 0);
      seen[c] = i + 1;
      var total = perCol[c] || 1;
      // Deterministic seeding: a reload gives the same picture.
      n.x = colX[c] + ((i % 7) - 3) * 14;
      n.y = ((i + 0.5) / total) * H;
      n.vx = 0; n.vy = 0;
      n.fixed = false;
    });
    state.ticks = 0;
    void used;
  }

  var CELL = 70;

  function tick() {
    var i, n, m;
    // Repulsion over a uniform grid neighbourhood; the all-pairs form is
    // quadratic and freezes the page on thousands of nodes.
    var grid = Object.create(null);
    for (i = 0; i < state.nodes.length; i++) {
      n = state.nodes[i];
      var key = Math.floor(n.x / CELL) + ':' + Math.floor(n.y / CELL);
      (grid[key] = grid[key] || []).push(n);
    }
    for (i = 0; i < state.nodes.length; i++) {
      n = state.nodes[i];
      var cx = Math.floor(n.x / CELL), cy = Math.floor(n.y / CELL);
      for (var dx = -1; dx <= 1; dx++) {
        for (var dy = -1; dy <= 1; dy++) {
          var bucket = grid[(cx + dx) + ':' + (cy + dy)];
          if (!bucket) { continue; }
          for (var b = 0; b < bucket.length; b++) {
            m = bucket[b];
            if (m === n) { continue; }
            var rx = n.x - m.x, ry = n.y - m.y;
            var d2 = rx * rx + ry * ry;
            if (d2 > CELL * CELL || d2 === 0) {
              if (d2 === 0) { n.vx += (Math.random() - 0.5); n.vy += (Math.random() - 0.5); }
              continue;
            }
            var d = Math.sqrt(d2);
            var f = 900 / d2;
            n.vx += (rx / d) * f; n.vy += (ry / d) * f;
          }
        }
      }
    }
    for (i = 0; i < state.links.length; i++) {
      var a = state.byId[state.links[i].source], z = state.byId[state.links[i].target];
      if (!a || !z) { continue; }
      var lx = z.x - a.x, ly = z.y - a.y;
      var ld = Math.sqrt(lx * lx + ly * ly) || 0.001;
      var force = (ld - 110) * 0.012;
      var ux = (lx / ld) * force, uy = (ly / ld) * force;
      a.vx += ux; a.vy += uy; z.vx -= ux; z.vy -= uy;
    }
    // Column anchor (stiff, so nodes stay in their band) plus weak vertical
    // centring, then damping.
    var halfBand = (W / COLUMNS.length) * 0.42;
    for (i = 0; i < state.nodes.length; i++) {
      n = state.nodes[i];
      if (n.fixed) { n.vx = 0; n.vy = 0; continue; }
      n.vx += (colX[colOf(n)] - n.x) * 0.06;
      n.vy += (H / 2 - n.y) * 0.0015;
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += Math.max(-24, Math.min(24, n.vx));
      n.y += Math.max(-24, Math.min(24, n.vy));
      // Hard clamp: the anchor spring alone loses to a well-connected node's
      // link springs.
      var bandC = colX[colOf(n)];
      if (n.x < bandC - halfBand) { n.x = bandC - halfBand; n.vx = 0; }
      else if (n.x > bandC + halfBand) { n.x = bandC + halfBand; n.vx = 0; }
    }
    state.ticks++;
  }

  function startTicking() {
    if (state.raf) { cancelAnimationFrame(state.raf); }
    var step = function () {
      var budget = state.ticks < 60 ? 3 : 1;
      for (var i = 0; i < budget; i++) { tick(); }
      position();
      if (state.ticks < 260) { state.raf = requestAnimationFrame(step); }
      else { state.raf = 0; }
    };
    state.raf = requestAnimationFrame(step);
  }

  // ---------------------------------------------------------------
  // rendering
  // ---------------------------------------------------------------

  var gfx = { nodes: Object.create(null), links: [] };

  function render() {
    els.bands.textContent = '';
    els.links.textContent = '';
    els.nodes.textContent = '';
    gfx = { nodes: Object.create(null), links: [] };

    var ncol = COLUMNS.length;
    for (var c = 0; c < ncol; c++) {
      if (c % 2 === 0) {
        els.bands.appendChild(el('rect', {
          x: (c / ncol) * W, y: -H, width: W / ncol, height: 3 * H, class: 'col-band'
        }));
      }
      var t = el('text', { x: colX[c], y: -30, class: 'col-label' });
      t.textContent = COLUMNS[c];
      els.bands.appendChild(t);
    }

    state.links.forEach(function (l) {
      var a = state.byId[l.source], z = state.byId[l.target];
      if (!a || !z) { return; }
      var line = el('line', { class: 'link' });
      line.__link = l; line.__a = a; line.__z = z;
      els.links.appendChild(line);
      gfx.links.push(line);
    });

    var cov = coverageOn();
    // The heat scale is graph-wide: compute it once per render, not per node.
    var heat = heatOn();
    var heatMax = heat
      ? heatMaxOf(moduleNamesInGraph(), state.heat, state.heatMetric) : null;
    state.nodes.forEach(function (n) {
      var g = el('g', { class: 'node' });
      var r = radiusOf(n);
      var status = statusOf(n);
      // A test's ring is its last verdict; a coverage item's is whether the run
      // exercised it. Both share the ring.
      var item = cov ? itemStatus(n) : null;
      var ringColor = item
        ? ITEM_COLOR[item]
        : (status ? (STATUS_COLOR[status] || 'var(--warn)') : null);
      if (ringColor) {
        g.appendChild(el('circle', { class: 'ring', r: r + 3.5, stroke: ringColor }));
      }
      // Coverage mode repaints the design column with the ramp; the column
      // bands still carry identity.
      var tinted = cov && categoryOf(n) === 'design' && !n.dangling;
      // The heat overlay borrows the fill, on `module:` nodes only: a module is
      // where both halves of the model can be read (synthesis row by name, leaf
      // power by path). The overlays are mutually exclusive at the checkbox.
      var heatName = heat && n.type === 'module' && !n.dangling
        ? heatModuleName(n, state.out[n.id]) : null;
      var heatValue = heatName
        ? heatValueOf(state.heat.modules[heatName], state.heatMetric) : null;
      var body = el('circle', {
        class: (n.dangling ? 'body dangling' : 'body') +
          (tinted ? ' cov' : '') + (heatName ? ' heat' : ''), r: r,
        fill: (n.dangling || tinted || heatName)
          ? null
          : (COLUMN_COLOR[categoryOf(n)] || 'var(--col-other)')
      });
      if (tinted) { tintHue(body, designRatio(n)); }
      if (heatName) { heatTint(body, heatValue, heatMax); }
      g.appendChild(body);
      // Numbers on the hover: a tint ranks, it does not quantify.
      if (heatName) {
        var tip = el('title');
        tip.textContent = heatTooltip(heatName, state.heat.modules[heatName]);
        g.appendChild(tip);
      }
      var label = el('text', { x: r + 5, y: 4 });
      label.textContent = labelOf(n);
      g.appendChild(label);
      // Only where there is a number.
      var ratio = n.type === 'test' ? testRatio(n) : (tinted ? designRatio(n) : null);
      if (cov && ratio != null) {
        var bt = el('text', { class: 'badge', x: r + 5, y: 15 });
        bt.textContent = pct(ratio);
        g.appendChild(bt);
      }
      if (typeof heatValue === 'number') {
        var hb = el('text', { class: 'badge', x: r + 5, y: 15 });
        hb.textContent = heatFmt(heatValue, state.heatMetric);
        g.appendChild(hb);
      }
      g.addEventListener('click', function (ev) {
        ev.stopPropagation();
        activate(n, { emit: true });
      });
      g.addEventListener('mouseenter', function () { state.hovered = n.id; applyClasses(); });
      g.addEventListener('mouseleave', function () { state.hovered = null; applyClasses(); });
      attachDrag(g, n);
      els.nodes.appendChild(g);
      gfx.nodes[n.id] = { g: g, label: label };
    });

    position();
    applyClasses();
  }

  function position() {
    for (var i = 0; i < gfx.links.length; i++) {
      var line = gfx.links[i];
      line.setAttribute('x1', line.__a.x); line.setAttribute('y1', line.__a.y);
      line.setAttribute('x2', line.__z.x); line.setAttribute('y2', line.__z.y);
    }
    for (var id in gfx.nodes) {
      var n = state.byId[id];
      gfx.nodes[id].g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
    }
  }

  function matches(n) {
    if (!state.filter) { return true; }
    var f = state.filter;
    return String(n.id).toLowerCase().indexOf(f) >= 0 ||
           String(n.label || '').toLowerCase().indexOf(f) >= 0 ||
           String(n.file || '').toLowerCase().indexOf(f) >= 0 ||
           String(n.type || '').toLowerCase().indexOf(f) >= 0;
  }

  function neighbours(id) {
    // BFS to `depth` hops over both edge directions (direction encodes role,
    // not reachability, as in `rb graph path`). Nodes in hidden columns are not
    // entered, or two islands would light with no visible edge.
    var set = Object.create(null); set[id] = true;
    var depth = parseInt(els.optHops.value, 10) || 1;
    var frontier = [id];
    function visit(cand, next) {
      if (set[cand]) { return; }
      var n = state.byId[cand];
      if (n && state.hiddenCols[categoryOf(n)]) { return; }
      set[cand] = true; next.push(cand);
    }
    for (var d = 0; d < depth && frontier.length; d++) {
      var next = [];
      frontier.forEach(function (nid) {
        (state.out[nid] || []).forEach(function (l) { visit(l.target, next); });
        (state.inc[nid] || []).forEach(function (l) { visit(l.source, next); });
      });
      frontier = next;
    }
    return set;
  }

  function applyClasses() {
    var focus = state.hovered || state.selected;
    var near = focus ? neighbours(focus) : null;
    for (var id in gfx.nodes) {
      var n = state.byId[id];
      var g = gfx.nodes[id].g;
      var hidden = state.hiddenCols[categoryOf(n)];
      // A node named by an inbound `phys_focus`: looks selected and is not
      // dimmed for being outside the hop ball.
      var also = !!(state.focusIds && state.focusIds.indexOf(id) >= 0);
      var dim = hidden || !matches(n) || (near && !near[id] && !also);
      g.setAttribute('class', 'node' + (dim ? ' dim' : '') +
        (id === state.selected || also ? ' sel' : ''));
      g.style.display = hidden && !state.filter ? 'none' : '';
      // Labels only for nodes that matter now plus the big structural ones.
      var showLabel = !dim && (state.view.k > 0.55 || radiusOf(n) >= 8 || id === focus);
      gfx.nodes[id].label.style.display = showLabel ? '' : 'none';
    }
    for (var i = 0; i < gfx.links.length; i++) {
      var line = gfx.links[i];
      // An edge is hot when both endpoints are inside the highlighted ball.
      var hot = near && near[line.__link.source] && near[line.__link.target];
      var off = state.hiddenCols[categoryOf(line.__a)] || state.hiddenCols[categoryOf(line.__z)];
      line.setAttribute('class', 'link' + (hot ? ' hot' : (focus ? ' dim' : '')));
      line.style.display = off ? 'none' : '';
    }
  }

  // ---------------------------------------------------------------
  // pan / zoom / drag
  // ---------------------------------------------------------------

  function applyView() {
    els.scene.setAttribute('transform',
      'translate(' + state.view.x + ',' + state.view.y + ') scale(' + state.view.k + ')');
  }

  function fit() {
    var rect = els.svg.getBoundingClientRect();
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    state.nodes.forEach(function (n) {
      minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
      minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
    });
    if (!isFinite(minX)) { return; }
    var pad = 60;
    var k = Math.min(
      rect.width / Math.max(1, (maxX - minX) + pad * 2),
      rect.height / Math.max(1, (maxY - minY) + pad * 2)
    );
    state.view.k = Math.max(0.08, Math.min(2.5, k));
    state.view.x = rect.width / 2 - ((minX + maxX) / 2) * state.view.k;
    state.view.y = rect.height / 2 - ((minY + maxY) / 2) * state.view.k;
    applyView();
  }

  function centerOn(n) {
    var rect = els.svg.getBoundingClientRect();
    state.view.k = Math.max(state.view.k, 0.8);
    state.view.x = rect.width / 2 - n.x * state.view.k;
    state.view.y = rect.height / 2 - n.y * state.view.k;
    applyView();
    applyClasses();
  }

  els.svg.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var rect = els.svg.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    var factor = Math.exp(-ev.deltaY * 0.0015);
    var k = Math.max(0.05, Math.min(6, state.view.k * factor));
    state.view.x = mx - (mx - state.view.x) * (k / state.view.k);
    state.view.y = my - (my - state.view.y) * (k / state.view.k);
    state.view.k = k;
    applyView(); applyClasses();
  }, { passive: false });

  (function panning() {
    var active = false, sx = 0, sy = 0, ox = 0, oy = 0;
    els.svg.addEventListener('pointerdown', function (ev) {
      if (ev.target.closest && ev.target.closest('.node')) { return; }
      active = true; sx = ev.clientX; sy = ev.clientY;
      ox = state.view.x; oy = state.view.y;
      els.svg.classList.add('panning');
      els.svg.setPointerCapture(ev.pointerId);
    });
    els.svg.addEventListener('pointermove', function (ev) {
      if (!active) { return; }
      state.view.x = ox + (ev.clientX - sx);
      state.view.y = oy + (ev.clientY - sy);
      applyView();
    });
    var stop = function (ev) {
      if (!active) { return; }
      active = false; els.svg.classList.remove('panning');
      try { els.svg.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    };
    els.svg.addEventListener('pointerup', stop);
    els.svg.addEventListener('pointercancel', stop);
  })();

  function attachDrag(g, n) {
    var dragging = false, moved = false;
    g.addEventListener('pointerdown', function (ev) {
      ev.stopPropagation();
      dragging = true; moved = false;
      n.fixed = true;
      g.setPointerCapture(ev.pointerId);
    });
    g.addEventListener('pointermove', function (ev) {
      if (!dragging) { return; }
      moved = true;
      n.x += ev.movementX / state.view.k;
      n.y += ev.movementY / state.view.k;
      position();
    });
    var release = function (ev) {
      if (!dragging) { return; }
      dragging = false;
      try { g.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
      if (moved) { n.fixed = false; state.ticks = 200; startTicking(); }
    };
    g.addEventListener('pointerup', release);
    g.addEventListener('pointercancel', release);
  }

  els.svg.addEventListener('click', function () {
    state.selected = null; renderInspector(null); applyClasses();
  });

  // ---------------------------------------------------------------
  // selection → hub envelopes
  // ---------------------------------------------------------------

  // >>> active-model
  // Elaboration roots of the schematic's ACTIVE model.
  //
  // Design-tier ids are `inst:<root>/<dot.path>` and the path starts at the
  // root, so the first component of an instance path names its elaboration;
  // `maybeWarnCrossModel` compares it with the active model.
  //
  // Roots are read from the payload: the targets of the active model's
  // `maps_to` links (`config_tier.MAPS_TO`). The model NAME is a fallback for
  // one shape only, a design-tier-only graph with no `model:` node. Do not seed
  // the name unconditionally (with `top:`, model `foo` topped at `bar` would
  // own both names), and do not fall back whenever the stitch is missing (a
  // `graph: false` model has a `model:` node and no stitch, and its name can be
  // another model's `top:`). Either mistake makes `shallowestInstancePath`
  // prefer another model's instance, landing the selection in a model that is
  // not on screen.
  //
  // A `model:` node with no stitch is an answer (no roots). A suite qualifier
  // (`@<suite>`, graph.build.QUALIFIER_SEP) is not part of the module name and
  // comes off.
  //
  // An unknown model (no `state_snapshot` yet, or no active model) returns an
  // EMPTY set, which leaves `shallowestInstancePath` with no preference. A
  // model the graph does not cover (a build narrowed with `--model`) looks like
  // the design-tier-only shape and takes the same fallback; a root nothing
  // matches is harmless.
  function activeModelRoots(links, model, nodes) {
    var roots = Object.create(null);
    if (typeof model !== 'string' || !model) { return roots; }
    var known = false;
    (nodes || []).forEach(function (n) {
      if (known || !n || n.type !== 'model') { return; }
      var id = String(n.id == null ? '' : n.id);
      var hash = id.indexOf('#');
      if (hash >= 0 && id.slice(hash + 1) === model) { known = true; }
    });
    (links || []).forEach(function (l) {
      if (!l || l.type !== 'maps_to') { return; }
      var source = String(l.source == null ? '' : l.source);
      var target = String(l.target == null ? '' : l.target);
      if (source.indexOf('model:') !== 0 || target.indexOf('module:') !== 0) { return; }
      var hash = source.indexOf('#');
      if (hash < 0 || source.slice(hash + 1) !== model) { return; }
      var name = target.slice('module:'.length).split('@')[0];
      if (name) { roots[name] = true; }
    });
    if (!known) { roots[model] = true; }
    return roots;
  }

  // Inverse stitch, for naming the model the schematic should switch to.
  //
  // A root is a MODULE name but `GET /view.json?model=` takes a MODEL name. A
  // models.yaml `top:` decouples them, so a root can be a name no models.yaml
  // declares. The `maps_to` stitch read backwards answers it: the model that
  // maps to this module.
  //
  // The fallback is the module name (design-tier-only graph). Offering a name
  // the hub may reject beats a disabled button, since the failure is reported.
  // If two models share a top, the first stitch wins (link order).
  function modelForRoot(links, root) {
    if (typeof root !== 'string' || !root) { return null; }
    var found = null;
    (links || []).forEach(function (l) {
      if (found || !l || l.type !== 'maps_to') { return; }
      var source = String(l.source == null ? '' : l.source);
      var target = String(l.target == null ? '' : l.target);
      if (source.indexOf('model:') !== 0 || target.indexOf('module:') !== 0) { return; }
      if (target.slice('module:'.length).split('@')[0] !== root) { return; }
      var hash = source.indexOf('#');
      if (hash < 0) { return; }
      var name = source.slice(hash + 1);
      if (name) { found = name; }
    });
    return found || root;
  }

  // The instance meant by "show me this module": the shallowest one, PREFERRING
  // the active model's elaboration.
  //
  // Ranking all loaded models together can land the selection in a model that
  // is not on screen, where the schematic highlights nothing. Only when the
  // active model instantiates the module nowhere does the all-models shallowest
  // answer stand. Depth ties keep the first candidate (link order).
  //
  // The root component is de-qualified before lookup: `_qualify_graph` appends
  // `@<suite>` to the whole `inst:` id, so a root-scope instance
  // (`inst:X/X@verif/x`) has it on its only component. `activeModelRoots`
  // strips it on its side; both must agree.
  function rootComponent(p) {
    return p.split('.')[0].split('@')[0];
  }

  function shallowestInstancePath(paths, roots) {
    var best = null, bestOwned = false;
    (paths || []).forEach(function (p) {
      if (typeof p !== 'string' || !p) { return; }
      var owned = !!(roots && roots[rootComponent(p)]);
      if (best === null || (owned && !bestOwned)) {
        best = p; bestOwned = owned; return;
      }
      if (owned === bestOwned && p.split('.').length < best.split('.').length) {
        best = p;
      }
    });
    return best;
  }
  // <<< active-model

  // `activeModelRoots` over the payload on screen, memoised on the hub's active
  // model and the ingested nodes and links (`ingest` replaces both wholesale,
  // so their identities are sound keys).
  var modelRootsCache = null;
  function currentModelRoots() {
    if (!modelRootsCache || modelRootsCache.model !== activeModel ||
        modelRootsCache.links !== state.links ||
        modelRootsCache.nodes !== state.nodes) {
      modelRootsCache = {
        model: activeModel, links: state.links, nodes: state.nodes,
        roots: activeModelRoots(state.links, activeModel, state.nodes)
      };
    }
    return modelRootsCache.roots;
  }

  // Design-tier instance ids carry the hub resolver's identity,
  // `inst:<top>/<dot.path>`. An explicit `instance_path` attribute wins.
  function instancePathFor(n) {
    if (!n) { return null; }
    if (typeof n.instance_path === 'string' && n.instance_path) { return n.instance_path; }
    if (n.type === 'instance' && String(n.id).indexOf('inst:') === 0) {
      var rest = String(n.id).slice(5);
      var slash = rest.indexOf('/');
      if (slash >= 0) { return rest.slice(slash + 1); }
    }
    if (n.type === 'module') {
      // A module is not a schematic coordinate; its instances are. Collect them
      // and let `shallowestInstancePath` pick.
      var paths = [];
      (state.inc[n.id] || []).forEach(function (l) {
        if (l.type !== 'instance_of') { return; }
        var p = instancePathFor(state.byId[l.source]);
        if (p) { paths.push(p); }
      });
      return shallowestInstancePath(paths, currentModelRoots());
    }
    return null;
  }

  // >>> module-name
  // Coarser identity for a node `instancePathFor` cannot place, such as
  // `model:` nodes in a project-tier graph (before a design tier is built). The
  // schematic highlights every instance of the module.
  //
  // A `module:` node reaches here only with no `instance_of` link; its id minus
  // the prefix is the name. Tests, suites, covitems and testbenches are not
  // design coordinates and return null; naming one would move the schematic on
  // unrelated clicks.
  //
  // The name goes out verbatim. Unlike cov_page.html, which strips the
  // simulator's elaborated suffix (`ip_async_fifo__DB13`), both ends here speak
  // source names, and stripping would corrupt a module whose name ends in
  // `__<alnum>`.
  //
  // A `model:` node resolves through its outgoing `maps_to` stitch
  // (`state.out[id]`), not the `#<name>` fragment of its id: with a models.yaml
  // `top:` the model name need not be a module in the graph, and a graph_focus
  // miss is silent.
  //
  // No stitch means no coordinate: a `graph: false` model is absent from the
  // design tier, and inventing `module:<name>` would send the schematic and the
  // cov pane to a node the graph lacks. `sendTo` reports it.
  //
  // The suite qualifier (`@<suite>`) comes off, as in `activeModelRoots`.
  function moduleNameFor(n, out) {
    if (!n) { return null; }
    var id = String(n.id == null ? '' : n.id);
    if (n.type === 'model') {
      var name = null;
      (Array.isArray(out) ? out : []).forEach(function (l) {
        if (name || !l || l.type !== 'maps_to') { return; }
        if (String(l.source == null ? '' : l.source) !== id) { return; }
        var target = String(l.target == null ? '' : l.target);
        if (target.indexOf('module:') !== 0) { return; }
        name = target.slice('module:'.length).split('@')[0] || null;
      });
      return name;
    }
    if (n.type === 'module') {
      return id.indexOf('module:') === 0 ? (id.slice(7) || null) : null;
    }
    return null;
  }
  // <<< module-name

  // >>> cov-target
  // A node's coordinate in the COVERAGE model, or null. The vocabulary is
  // `cov_focus.target` (`test:`, `module:` or `file:`); send what the cov
  // pane's `applyFocus` can resolve:
  //
  // * `test:` node -> per-test attribution. The graph id is
  //   `test:<suite>#<name>` and the coverage model keys tests by the bare name,
  //   so the fragment after the last `#` is what lands (`focusTest` falls back
  //   to it; the id goes out whole).
  // * `model:` / `module:` node -> the module via `moduleNameFor`; the cov pane
  //   maps the source name onto its elaborated keys.
  // * `coverage_item` node -> its spec block as a module, metric pinned to
  //   `cover`, item id as point name. Both narrowings are soft misses at the
  //   far end.
  // * anything else with a `file` -> that file at its line; the graph and
  //   `/cov.json` both key files project-root-relative.
  //
  // Order matters: a `module:` node also has a `file`, and the module is the
  // better answer.
  function covTargetFor(n, out) {
    if (!n) { return null; }
    var id = String(n.id == null ? '' : n.id);
    if (n.type === 'test') {
      return id.indexOf('test:') === 0 && id.length > 5 ? { target: id } : null;
    }
    var mod = moduleNameFor(n, out);
    if (mod) { return { target: 'module:' + mod }; }
    // A `model:` node with no module (opted out of the design tier) stops here
    // instead of falling to the file branch: its `file` is a models.yaml, which
    // is not a coverage coordinate. `sendTo` reports it.
    if (n.type === 'model') { return null; }
    if (n.type === 'coverage_item') {
      var block = n.block == null ? '' : String(n.block);
      var item = n.label == null ? '' : String(n.label);
      if (!block || !item) { return null; }
      return { target: 'module:' + block, metric: 'cover', item: item };
    }
    var file = n.file == null ? '' : String(n.file);
    if (!file) { return null; }
    // Not named `out`: a same-named `var` would share the parameter's binding.
    var focus = { target: 'file:' + file };
    var line = Number(n.line);
    if (line >= 1) { focus.line = Math.floor(line); }
    return focus;
  }
  // <<< cov-target

  // A selection whose root is not the schematic's active model highlights
  // nothing there, which reads as "the schematic is stuck". The cached model
  // can be stale (the SPA picker switches without telling us), so reconfirm
  // before warning.
  //
  // `GET /view.json?model=` builds and activates the model, so the warning arms
  // the `switch model` button.
  var crossModel = null;
  function setCrossModel(target) {
    crossModel = target;
    if (target) {
      els.fixView.disabled = false;
      els.fixView.textContent = originLabel('view') + ' → ' + target.model;
      els.fixView.title = 'Switch the schematic to model ' + target.model +
        ' (builds its view.json if needed), then re-highlight ' + target.ip + '.';
    } else {
      els.fixView.disabled = true;
      els.fixView.textContent = 'switch model';
      els.fixView.title = "Enabled when the selected node is not in the schematic's " +
        'active model — click to switch the schematic to the model that contains it.';
    }
  }

  // Compare the root against the active model's ROOTS (`activeModelRoots`), not
  // its name, and translate the switch target back through `modelForRoot`. With
  // a models.yaml `top:`, comparing against the name reports selections in the
  // preferred root as cross-model and offers `?model=<module>`, which the hub
  // cannot activate. `rootComponent` de-qualifies, as the ranking does.
  //
  // The CACHED model never decides on its own. Only a hub with no active model
  // short-circuits; every real selection asks for a `state_snapshot` and judges
  // against the answer. The cache serves the synchronous ranking and can be
  // behind (the schematic may have switched while this socket was
  // disconnected). Suppressing the warning on a stale match would fail
  // silently, so suppression must be earned from fresh state.
  function maybeWarnCrossModel(ip) {
    var root = rootComponent(ip);
    if (!activeModel) { setCrossModel(null); return; }
    request('state_snapshot', {}, function (reply) {
      // Unconfirmable: neither warn nor leave the previous selection's switch
      // target armed.
      if (reply.kind !== 'response') { setCrossModel(null); return; }
      activeModel = reply.payload.active_model;
      // Re-read after the refresh: `currentModelRoots` is memoised on the
      // active model.
      if (activeModel && !currentModelRoots()[root]) {
        var target = modelForRoot(state.links, root);
        setCrossModel({ model: target, ip: ip });
        note('selected ' + ip + " — not in the schematic's active model (" + activeModel +
             '); click “' + originLabel('view') + ' → ' + target +
             '” above to switch', 'warn');
      } else {
        setCrossModel(null);
      }
    });
  }

  els.fixView.addEventListener('click', function () {
    if (!crossModel) { return; }
    var target = crossModel;
    els.fixView.disabled = true;
    els.fixView.textContent = 'switching…';
    fetch('/view.json?model=' + encodeURIComponent(target.model))
      .then(function (resp) {
        if (!resp.ok) {
          // The hub answers failures with a structured envelope
          // (view_generation_failed and others); show its detail.
          return resp.json().then(
            function (body) {
              throw new Error((body && body.error && body.error.detail) ||
                              'HTTP ' + resp.status);
            },
            function () { throw new Error('HTTP ' + resp.status); }
          );
        }
      })
      .then(function () {
        activeModel = target.model;
        // Re-send the selection so the switched view lands on the clicked node.
        emit('selection_changed', { instance_path: target.ip });
        note('schematic switched to ' + target.model);
        setCrossModel(null);
      })
      .catch(function (err) {
        note('schematic switch failed: ' + err.message, 'error');
        setCrossModel(target); // re-arm for a retry
      });
  });

  // The envelope that puts the schematic on a node, or null when the node is
  // not a design coordinate. It prefers the instance path, else the module name
  // (`moduleNameFor`). The hub's echo is ignored: inbound graph_focus breaks on
  // `origin === 'graph'`.
  //
  // A value rather than inline because two callers share the decision: the
  // click path (gated on `sync schematic`) and the inspector's `send → sch`
  // button (not gated).
  function viewTargetFor(n, out) {
    var ip = instancePathFor(n);
    if (ip) {
      return {
        type: 'selection_changed', payload: { instance_path: ip },
        ip: ip, coord: ip, note: 'select ' + ip
      };
    }
    var mod = moduleNameFor(n, out);
    if (mod) {
      return {
        type: 'graph_focus', payload: { node: 'module:' + mod },
        ip: null, coord: 'module:' + mod,
        note: 'focus module:' + mod + ' in the schematic'
      };
    }
    return null;
  }

  function activate(n, opts) {
    opts = opts || {};
    // Any activation is a single selection; a multi-node highlight belongs to
    // the `phys_focus` that set it.
    state.focusIds = null;
    state.selected = n.id;
    renderInspector(n);
    applyClasses();
    if (!opts.emit) { return; }
    var did = [];
    if (els.optSelect.checked) {
      var view = viewTargetFor(n, state.out[n.id]);
      var sent = !!view && emit(view.type, view.payload);
      if (sent) { did.push(view.note); }
      // The cross-model warning is about a selected INSTANCE; any other outcome
      // (module fallback, undeliverable send, unplaceable node) must clear it.
      if (sent && view.ip) { maybeWarnCrossModel(view.ip); }
      else { setCrossModel(null); }
    }
    if (els.optOpen.checked && n.file) {
      var payload = { file: String(n.file), line: n.line ? Number(n.line) : 1, col: 1 };
      if (request('open_source', payload, function (reply) {
        if (reply.kind === 'error') {
          note(reply.payload.code === 'not_connected'
            ? 'no editor connected — start nvim with the rtl-buddy plugin (rb nvim-install), or untick "open in editor"'
            : 'open_source: ' + reply.payload.code + ': ' + reply.payload.message, 'error');
        }
      })) {
        did.push('open ' + payload.file + ':' + payload.line);
      }
    }
    if (did.length) { note(did.join('  ·  ')); }
    else if (wsReady) { note('nothing to send for this node'); }
    else { note('hub not connected', 'error'); }
  }

  function focusById(id, opts) {
    opts = opts || {};
    var n = id && state.byId[id];
    if (!n) {
      if (opts.announce) { note('graph-focus: no node ' + id + ' in this graph'); }
      return false;
    }
    activate(n, { emit: !!opts.emit });
    centerOn(n);
    if (opts.announce) { note('focused ' + id); }
    return true;
  }

  function focusByInstancePath(ip) {
    if (typeof ip !== 'string' || !ip) { return; }
    for (var i = 0; i < state.nodes.length; i++) {
      var n = state.nodes[i];
      if (n.type !== 'instance') { continue; }
      if (instancePathFor(n) === ip) {
        state.selected = n.id; renderInspector(n); applyClasses(); centerOn(n);
        return;
      }
    }
  }

  // ---------------------------------------------------------------
  // cross-app actions
  // ---------------------------------------------------------------

  // One control per sibling app: `send → X` puts the selection on the
  // already-open X tab without navigating. Opening an app is the header
  // switcher's job. A tab opened after a send still lands on the selection,
  // because the hub replays the cached selection_changed / graph_focus /
  // cov_focus to new peers (`_replay_cached_state` in hub/server.py).
  var APPS = [
    {
      origin: 'view', prose: 'the schematic',
      targetFor: viewTargetFor,
      send: function (t) { return emit(t.type, t.payload); },
      label: function (t) { return t.coord; },
      after: function (t) { if (t.ip) { maybeWarnCrossModel(t.ip); } },
      // Broadcast: the coverage pane also reads selection_changed (it guesses a
      // module off the leaf name).
      overlap: 'This is a hub broadcast — an instance-path send also ' +
        'nudges the coverage pane, which resolves instance paths onto ' +
        'modules of its own accord.',
      why: 'this node is not a design coordinate — no instance path and no module name'
    },
    {
      origin: 'cov', prose: 'the coverage pane',
      targetFor: covTargetFor,
      send: function (t) { return emit('cov_focus', t); },
      label: function (t) {
        return t.target + (t.line ? ':' + t.line : '') + (t.item ? ' ' + t.item : '');
      },
      after: function () {},
      overlap: 'cov_focus is read by the coverage pane only.',
      why: 'nothing the coverage pane can focus on this node — no test, module or file'
    }
  ];

  function sendTo(app, n) {
    // Both `targetFor`s resolve `model:` nodes through `maps_to`, so both need
    // the node's outgoing links.
    var t = app.targetFor(n, state.out[n.id]);
    if (!t) { note(app.why, 'warn'); return false; }
    if (!app.send(t)) { note('hub not connected', 'error'); return false; }
    note('sent to ' + originLabel(app.origin) + ': ' + app.label(t));
    app.after(t);
    return true;
  }

  function actionButton(label, title, disabled, onClick) {
    var b = document.createElement('button');
    b.textContent = label;
    b.title = title;
    if (disabled) { b.disabled = true; } else { b.addEventListener('click', onClick); }
    return b;
  }

  // Sends only; there is no open variant, since the header switcher opens apps
  // and the hub replays cached focus to late joiners.
  function renderActions(n) {
    var box = document.createElement('div');
    box.className = 'actions';
    APPS.forEach(function (app) {
      var t = app.targetFor(n, state.out[n.id]);
      var live = hasPeer(app.origin);
      box.appendChild(actionButton(
        'send → ' + originLabel(app.origin),
        !t ? app.why
           : !live ? app.prose + ' is not connected — open it from the header links'
           : 'Send ' + app.label(t) + ' to ' + app.prose +
             ', without leaving this tab. ' + app.overlap,
        !t || !live,
        function () { sendTo(app, n); }));
    });
    return box;
  }

  // Rebuilt in place when the peer list moves (`setPeers`).
  var actionsEl = null, actionsNode = null;

  function refreshActions() {
    if (!actionsEl || !actionsEl.parentNode || !actionsNode) { return; }
    var next = renderActions(actionsNode);
    actionsEl.parentNode.replaceChild(next, actionsEl);
    actionsEl = next;
  }

  // ---------------------------------------------------------------
  // inspector
  // ---------------------------------------------------------------

  function row(dl, key, value) {
    var dt = document.createElement('dt'); dt.textContent = key;
    var dd = document.createElement('dd');
    // Duck-typed rather than `instanceof Node`: values are scalars or elements
    // just built.
    if (value && typeof value === 'object' && value.nodeType === 1) {
      dd.appendChild(value);
    } else {
      dd.textContent = String(value);
    }
    dl.appendChild(dt); dl.appendChild(dd);
  }

  function renderInspector(n) {
    els.inspector.textContent = '';
    actionsEl = null; actionsNode = n || null;
    if (!n) {
      var hint = document.createElement('p');
      hint.className = 'muted';
      hint.textContent = 'Click a node.';
      els.inspector.appendChild(hint);
      return;
    }
    // First, above the identity, so it needs no scroll on a node with many
    // edges.
    actionsEl = renderActions(n);
    els.inspector.appendChild(actionsEl);
    var dl = document.createElement('dl');
    dl.className = 'kv';
    row(dl, 'id', n.id);
    if (n.type) { row(dl, 'type', n.type); }
    row(dl, 'column', categoryOf(n));
    if (n.tier) { row(dl, 'tier', n.tier); }
    if (n.label && n.label !== n.id) { row(dl, 'label', n.label); }
    if (n.file) { row(dl, 'file', n.file + (n.line ? ':' + n.line : '')); }
    ['base_label', 'dir', 'width', 'toplevel', 'flow', 'reglvl', 'cocotb',
     'kind', 'tool', 'module', 'suite', 'test', 'qualified_by']
      .forEach(function (k) { if (n[k] != null) { row(dl, k, n[k]); } });
    els.inspector.appendChild(dl);

    if (n.results) {
      els.inspector.appendChild(document.createElement('hr'));
      var h = document.createElement('h2'); h.textContent = 'last run';
      els.inspector.appendChild(h);
      var rl = document.createElement('dl'); rl.className = 'kv';
      var pill = document.createElement('span');
      pill.className = 'pill';
      pill.style.color = STATUS_COLOR[n.results.status] || 'var(--warn)';
      pill.textContent = n.results.status || 'UNKNOWN';
      row(rl, 'status', pill);
      ['desc', 'timestamp', 'randseed', 'run_id', 'source'].forEach(function (k) {
        if (n.results[k] != null) { row(rl, k, n.results[k]); }
      });
      var art = n.results.artefacts || {};
      Object.keys(art).sort().forEach(function (k) { row(rl, k, art[k]); });
      if (n.results.coverage && n.results.coverage.totals) {
        row(rl, 'coverage', metricLine(n.results.coverage.totals));
      }
      els.inspector.appendChild(rl);
    }

    renderCoverage(n);
    renderPhysical(n);

    var edges = (state.out[n.id] || []).map(function (l) { return { dir: '→', l: l, peer: l.target }; })
      .concat((state.inc[n.id] || []).map(function (l) { return { dir: '←', l: l, peer: l.source }; }));
    els.inspector.appendChild(document.createElement('hr'));
    var eh = document.createElement('h2');
    eh.textContent = 'edges (' + edges.length + ')';
    els.inspector.appendChild(eh);
    var ul = document.createElement('ul'); ul.className = 'edges';
    edges.forEach(function (e) {
      var li = document.createElement('li');
      var kind = document.createElement('span');
      kind.className = 'muted';
      kind.textContent = e.dir + ' ' + (e.l.type || 'edge') +
        (e.l.confidence && e.l.confidence !== 'EXTRACTED' ? ' [' + e.l.confidence + '] ' : ' ');
      var a = document.createElement('a');
      a.textContent = e.peer;
      a.addEventListener('click', function () { focusById(e.peer, { emit: false }); });
      li.appendChild(kind); li.appendChild(a);
      ul.appendChild(li);
    });
    els.inspector.appendChild(ul);
  }

  var METRIC_INITIAL = {
    line: 'L', branch: 'B', toggle: 'T', expression: 'E', cover: 'C'
  };

  function metricLine(totals) {
    return Object.keys(METRIC_INITIAL).filter(function (m) {
      return totals[m] && totals[m].found;
    }).map(function (m) {
      return METRIC_INITIAL[m] + ' ' + pct(totals[m].ratio);
    }).join('  ') || '\u2014';
  }

  // Declared vs observed: the cover points a spec item correlated with (and the
  // match rung), the tests that declared they cover it, and how they did.
  function renderCoverage(n) {
    var c = covOf(n);
    if (!c) { return; }
    els.inspector.appendChild(document.createElement('hr'));
    var h = document.createElement('h2');
    h.textContent = c.kind === 'item' ? 'coverage item' : 'coverage';
    els.inspector.appendChild(h);
    var dl = document.createElement('dl'); dl.className = 'kv';
    if (c.kind === 'design') {
      row(dl, 'module', c.module);
      row(dl, 'line', pct(c.ratio));
      row(dl, 'metrics', metricLine(c.totals || {}));
      if ((c.tests || []).length) { row(dl, 'tests', c.tests.join(', ')); }
      (c.files || []).forEach(function (f, i) { row(dl, i ? '' : 'files', f); });
      // Cover points no `covers:` entry claims have no node of their own; the
      // module is where they can be seen.
      ((state.coverage && state.coverage.undeclared) || [])
        .filter(function (u) { return u.module === c.module; })
        .forEach(function (u, i) {
          row(dl, i ? '' : 'undeclared',
            u.name + ':' + (u.line == null ? '?' : u.line) + ' \u00d7' + u.hits);
        });
    } else {
      var pill = document.createElement('span');
      pill.className = 'pill';
      pill.style.color = ITEM_COLOR[c.status] || 'var(--warn)';
      pill.textContent = c.status;
      row(dl, 'status', pill);
      row(dl, 'hits', c.hits);
      if ((c.hit_by || []).length) { row(dl, 'hit by', c.hit_by.join(', ')); }
      (c.declared_by || []).forEach(function (t, i) {
        row(dl, i ? '' : 'declared by', t);
      });
      var st = c.declared_by_status || {};
      var keys = Object.keys(st).sort();
      if (keys.length) {
        row(dl, 'their status', keys.map(function (k) {
          return st[k] + ' ' + k;
        }).join(', '));
      }
      (c.observed || []).forEach(function (o, i) {
        row(dl, i ? '' : 'observed',
          o.name + ' @ ' + (o.file || '?') + ':' + (o.line == null ? '?' : o.line) +
          ' \u00d7' + o.hits + ' [' + o.match + ']');
      });
      if (!(c.observed || []).length) {
        row(dl, 'observed', 'no cover point in the run\u2019s model');
      }
    }
    els.inspector.appendChild(dl);
  }

  // Physical half of a selected module: the synthesis row's numbers and the
  // power of every leaf the roll-up put inside it. Only for a `module:` node,
  // and only while the overlay is on.
  //
  // The halves are labelled apart: `cells` is the module's OWN cells and `area`
  // includes its submodules (Yosys `stat` rolls area up, cell counts not at
  // all), while the power lines cover the leaves in this module and no deeper.
  // The note says which is which; adding them is wrong.
  function renderPhysical(n) {
    if (!heatOn() || !n || n.type !== 'module' || n.dangling) { return; }
    var name = heatModuleName(n, state.out[n.id]);
    if (!name) { return; }
    var found = state.heat.modules[name];
    els.inspector.appendChild(document.createElement('hr'));
    var h = document.createElement('h2');
    h.textContent = 'physical';
    els.inspector.appendChild(h);
    var dl = document.createElement('dl'); dl.className = 'kv';
    row(dl, 'module', name);
    if (!found) {
      row(dl, 'model', 'no synthesis row, and no leaf instance inside any ' +
        'instantiation of this module');
      els.inspector.appendChild(dl);
      return;
    }
    row(dl, 'cells', heatFmt(found.cells, 'cells'));
    row(dl, 'area', heatFmt(found.area, 'area'));
    row(dl, 'total', heatFmt(heatValueOf(found, 'total'), 'total'));
    row(dl, 'dynamic', heatFmt(heatValueOf(found, 'dynamic'), 'dynamic'));
    row(dl, 'internal', heatFmt(found.internal, 'dynamic'));
    row(dl, 'switching', heatFmt(found.switching, 'dynamic'));
    row(dl, 'leakage', heatFmt(found.leakage, 'leakage'));
    // What the power sum ran over, beside the power: a reader comparing power
    // with area must know the halves count different things.
    row(dl, 'instances', found.instances);
    row(dl, 'leaf rows', found.leaves);
    var hint = document.createElement('span');
    hint.className = 'muted';
    hint.textContent = 'power is summed over ' + found.instances +
      ' instantiation' + (found.instances === 1 ? '' : 's') +
      ' of this module (' + found.leaves + ' leaf row' +
      (found.leaves === 1 ? '' : 's') + '); cells and area are the ' +
      'module definition’s, counted once (area includes submodules’)';
    row(dl, 'read as', hint);
    els.inspector.appendChild(dl);
  }

  // >>> phys-focus
  // An inbound `phys_focus` as a graph coordinate. Targets are the physical
  // model's: `module:<name>` or `instance:<rootless path>`, a bare string being
  // an instance path (schemas/hub-protocol-v1.json). A module is a node here
  // and lands directly. An instance is a netlist LEAF (a Liberty cell), which
  // no RTL graph contains: try the instance node of that path first (a sender
  // copying from `rb phys instance`), then fall back to the module whose body
  // contains the leaf, via the heat join's roll-up index.
  //
  // `rooted` paths: /phy sends paths rooted at the design top (the schematic's
  // coordinate) and `rb hub send phys-focus` sends the model's rootless
  // spelling. Both readings are tried and the graph decides, as in /phy's
  // `inboundCandidates`.
  //
  // Pure: state is passed in and an id or null comes back. Nothing is emitted
  // for a focus; answering a broadcast with a broadcast loops.
  //
  // Instance NODE for a rootless path, or null. The id is composed
  // (`inst:<root>/<root>.<path>`) when the elaboration is known; otherwise ids
  // are asked directly, since before the model is read there is no top and a
  // suite-qualified id defeats an exact lookup.
  function instanceNodeId(byId, path, root) {
    var direct = root
      ? 'inst:' + root + '/' + (path ? root + '.' + path : root) : null;
    if (direct && byId[direct]) { return direct; }
    var keys = Object.keys(byId || {});
    for (var i = 0; i < keys.length; i++) {
      var coord = instanceCoord(keys[i]);
      if (!coord || coord.path !== path) { continue; }
      if (!root || coord.root === root) { return keys[i]; }
    }
    return null;
  }

  // Every node whose de-qualified module name is this one.
  // `module:sub@verif/fifo` and `module:sub@verif/dma` are two exports of one
  // module with one synthesis row (`heatModuleName`); a `module:sub` target
  // belongs to all of them, and picking one by key order would highlight an
  // arbitrary export.
  function moduleNodesNamed(byId, name) {
    var wanted = String(name == null ? '' : name);
    var found = [];
    if (!wanted) { return found; }
    var keys = Object.keys(byId || {});
    for (var i = 0; i < keys.length; i++) {
      var id = keys[i];
      if (id.indexOf('module:') !== 0) { continue; }
      if (stripQualifier(id).slice('module:'.length) === wanted) { found.push(id); }
    }
    return found;
  }

  function physFocusNodes(target, byId, index, top) {
    var text = String(target == null ? '' : target);
    if (!text) { return []; }
    if (text.indexOf('module:') === 0) {
      return moduleNodesNamed(byId, text.slice('module:'.length));
    }
    var path = levelPath(text.indexOf('instance:') === 0
      ? text.slice('instance:'.length) : text);
    if (!path) { return []; }
    var root = levelPath(top == null ? '' : top);
    // The model's rootless spelling first, then the path with one leading top
    // level removed; the nodes decide. (Under a top named `blk`, rootless
    // `blk.u_x` is an instance inside the top, and a prefix test would read it
    // as already rooted.)
    var readings = [path];
    if (root && path.indexOf(root + '.') === 0) {
      readings.push(path.slice(root.length + 1));
    }
    for (var i = 0; i < readings.length; i++) {
      var id = instanceNodeId(byId, readings[i], root);
      if (id) { return [id]; }
    }
    // No instance node for either reading, the ordinary case (a model row is a
    // Liberty cell). Use the module whose body contains the leaf. A real
    // enclosing instance is tried first for EVERY reading, before the root
    // scope, which contains every path and would otherwise settle the ambiguity
    // by provenance.
    var table = index || Object.create(null);
    // The owning module comes out de-qualified; resolve it back to nodes like a
    // `module:` target (every export).
    var answer = function (owner) {
      var nodes = owner ? moduleNodesNamed(byId, owner) : [];
      return nodes.length ? nodes : null;
    };
    for (var j = 0; j < readings.length; j++) {
      var below = answer(ownerOfPathBelowRoot(table, readings[j]));
      if (below) { return below; }
    }
    for (var k = 0; k < readings.length; k++) {
      var any = answer(ownerOfPath(table, readings[k]));
      if (any) { return any; }
    }
    return [];
  }
  // <<< phys-focus

  // A `phys_focus` held for a model that had not arrived yet.
  var physPendingFocus = null;

  // Drained by the ingest that answers it, and also when the load fails: a
  // `module:` target names a node the graph carries either way. (phys_page.html
  // drains in `loadFailed` for the same reason.)
  function drainPhysFocus() {
    var held = physPendingFocus;
    if (!held) { return; }
    physPendingFocus = null;
    applyPhysFocus(held, true);
  }

  function applyPhysFocus(payload, deferred) {
    // A `phys_focus` is a HEAT request: it names a physical-model coordinate
    // and the metric to foreground. An instance target needs the model (only
    // the roll-up index knows which module holds a leaf), so when a model
    // exists but is unread, turn the overlay on, fetch it, and apply the focus
    // when the body lands (as /phy's `state.pending`).
    //
    // `deferred` is the second pass after that load settles; it never defers
    // again, so a failed load cannot loop.
    if (!deferred && PHY_URL && !state.phys) {
      physPendingFocus = payload;
      if (!els.optHeat.checked) {
        els.optHeat.checked = true;
        // Same exclusion as the checkbox handler.
        els.optCov.checked = false;
        els.optCov.dataset.touched = '1';
      }
      loadPhys();
      return;
    }
    var metric = payload && payload.metric;
    // The metric hint applies even when the target misses: it describes the
    // view, not the row.
    if (metric) { setHeatMetric(String(metric)); }
    var target = payload && payload.target;
    var ids = physFocusNodes(
      target, state.byId, (state.heat || {}).index, (state.heat || {}).top);
    if (!ids.length) {
      note('phys-focus: nothing in this graph answers ' + target +
        (state.heat ? '' : ' (no physical model read)'), 'warn');
      return;
    }
    // The first node is the selection (inspector and centring); the rest are
    // highlighted beside it, since a suite-qualified module is several nodes of
    // one module.
    focusById(ids[0], { emit: false, announce: false });
    if (ids.length > 1) {
      // Set AFTER the focus lands: `activate` clears the set.
      state.focusIds = ids;
      applyClasses();
    }
    note('phys-focus ' + target + ' → ' + ids.join(', '));
  }

  // ---------------------------------------------------------------
  // wiring
  // ---------------------------------------------------------------

  els.search.addEventListener('input', function () {
    state.filter = els.search.value.trim().toLowerCase();
    applyClasses();
  });
  els.optHops.addEventListener('change', applyClasses);
  els.optCov.addEventListener('change', function () {
    // Remembered so a payload refresh does not re-tick a box the person
    // unticked. Not persisted.
    els.optCov.dataset.touched = '1';
    // Coverage and heat both repaint the node body; ticking one unticks the
    // other.
    if (els.optCov.checked) { els.optHeat.checked = false; }
    renderHeatControls();
    renderLegend(state.categories);
    render();
    renderInspector(state.selected ? state.byId[state.selected] : null);
  });
  els.optHeat.addEventListener('change', function () {
    if (els.optHeat.checked) {
      els.optCov.checked = false;
      // Remembered like the cov box, so a graph reload does not re-tick
      // coverage over heat.
      els.optCov.dataset.touched = '1';
    }
    renderHeatControls();
    // Fetched on the first tick, not on load: the power half can be megabytes
    // of leaf rows.
    if (els.optHeat.checked && !state.phys) { loadPhys(); return; }
    renderLegend(state.categories);
    render();
    renderInspector(state.selected ? state.byId[state.selected] : null);
    noteHeat();
  });
  els.heatMetric.addEventListener('change', function () {
    setHeatMetric(els.heatMetric.value);
  });
  els.heatRun.addEventListener('change', function () {
    // The value is the run's project-relative artefact directory; empty means
    // follow discovery (`heatPhyUrl`).
    //
    // Passed to the fetch rather than written to `state.physDir`: a refused
    // switch must leave the shown run and this control's value where they were
    // (`physLoadStep`).
    loadPhys(els.heatRun.value || null);
  });
  els.search.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') { return; }
    for (var i = 0; i < state.nodes.length; i++) {
      if (matches(state.nodes[i])) { focusById(state.nodes[i].id, { emit: true }); return; }
    }
  });
  document.getElementById('reload').addEventListener('click', function () {
    load();
    // The physical model is a second document, re-read only while its overlay
    // is on. `reload` answers "another rb synth / rb power has finished".
    if (els.optHeat.checked) { loadPhys(); }
  });
  window.addEventListener('resize', applyClasses);
  // The strip's status word is the take-back control while superseded;
  // `takeBack` no-ops otherwise, so the listener is bound once.
  els.wsStatus.addEventListener('click', takeBack);
  els.wsStatus.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); takeBack(); }
  });

  relabelSwitcher();
  connect();
  load();
  // Physical overlay start-up: the run this tab opened on and, with no
  // manifest, the muted control naming the commands that make one.
  state.physDir = openedDir(location.search);
  if (!PHY_URL) { mutePhysControl(HEAT_ABSENT); }
})();
</script>
</body>
</html>
