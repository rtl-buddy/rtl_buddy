<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rtl-buddy-gph</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/hub/assets/rtl-buddy-favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/hub/assets/rtl-buddy-favicon-16.png">
  <!-- Served by rtl_buddy.hub.graph_page at GET /gph. -->
  <!-- Offline: no CDN, no web font, no build step. The only stylesheet link is the hub's same-origin /hub/theme.css. -->
  <!-- The inline :root block below holds the tokens the page cannot render without, as a fallback if that sheet 404s. -->
  <!-- Keep the fallback BEFORE the sheet link: both select :root, so a later fallback would shadow the sheet, including its dark-mode block. -->
  <style>
    :root {
      color-scheme: light dark;
      --bg:          #f8fafc;
      --panel:       #ffffff;
      --panel-2:     #f1f5f9;
      --line:        #e2e8f0;
      --line-strong: #cbd5e1;
      --fg:          #1e293b;
      --fg-muted:    #64748b;
      --accent:      #2563eb;
      --ok:          #16a34a;
      --warn:        #b45309;
      --err:         #dc2626;
      /* One colour per column (see COLUMNS below); each legible on both surfaces. */
      --col-spec:          #be185d;
      --col-design:        #1f6fd0;
      --col-test-config:   #0f7a52;
      --col-syn-config:    #b97407;
      --col-formal-config: #7c53d6;
      --col-cdc-config:    #0e7490;
      --col-test-cocotb:   #557c0b;
      --col-other:         #6b7688;
      /* Coverage ramp shared with /cov and the schematic overlay: hsl(pct * 1.2, --tint-s, --cov-l). */
      --tint-s:   70%;
      --cov-l:    82%;
      --cov-none: #e5e7eb;
      /* Fallback copy of the heat ramp shared with /phy: hsl(var(--heat-h), var(--heat-s), calc(--heat-l0 + (--heat-l1 - --heat-l0) * --f)). */
      /* The sheet is the source of truth; without these, module nodes paint black if it is missing. */
      --heat-h:      18;
      --heat-s:      85%;
      --heat-l0:     96%;
      --heat-l1:     66%;
      --heat-none:   #e5e7eb;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --fs-base:  13px;
      --fs-small: 11px;
      --radius-1: 3px;
      --radius-2: 4px;
    }
  </style>
  <link rel="stylesheet" href="/hub/theme.css">
  <style>
    /* Edge colours are page-local, derived from the sheet's tokens. */
    :root {
      --edge:     var(--line-strong);
      --edge-hot: var(--accent);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font: var(--fs-base)/1.45 var(--font-mono);
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
      padding: .5rem .75rem; border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 {
      font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .02em;
      white-space: nowrap;
    }
    header h1 small { color: var(--fg-muted); font-weight: 400; }
    .grow { flex: 1 1 auto; }
    input[type="search"] {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line); border-radius: 4px;
      padding: .25rem .5rem; min-width: 14rem;
    }
    input[type="search"]:focus { outline: 1px solid var(--accent); }
    button {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line); border-radius: 4px;
      padding: .25rem .55rem; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    button:disabled:hover { border-color: var(--line); }
    a.btn {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line); border-radius: 4px;
      padding: .25rem .55rem; text-decoration: none; white-space: nowrap;
    }
    a.btn:hover { border-color: var(--accent); }
    label.chk { display: inline-flex; align-items: center; gap: .3rem; cursor: pointer; }
    .legend { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .swatch {
      width: .7rem; height: .7rem; border-radius: 50%;
      display: inline-block; flex: none;
    }
    main { flex: 1 1 auto; display: flex; min-height: 0; }
    #canvas-wrap { flex: 1 1 auto; position: relative; min-width: 0; }
    svg { width: 100%; height: 100%; display: block; cursor: grab; }
    svg.panning { cursor: grabbing; }
    .col-band { fill: var(--panel); opacity: .35; }
    .col-label {
      fill: var(--fg-muted); font-size: 13px; letter-spacing: .18em;
      text-transform: uppercase; text-anchor: middle;
    }
    .link { stroke: var(--edge); stroke-width: 1; fill: none; }
    .link.hot { stroke: var(--edge-hot); stroke-width: 1.8; }
    .link.dim { opacity: .12; }
    .node circle.body { stroke: var(--bg); stroke-width: 1.2; cursor: pointer; }
    /* Ghost of a dangling target: hollow and dashed. A CSS class, because presentation attributes lose to the .body stroke above. */
    .node circle.body.dangling { stroke: var(--col-other); stroke-width: 1.4; stroke-dasharray: 3 2; }
    .node circle.ring { fill: none; stroke-width: 2.4; }
    /* Coverage tint: the ramp is in the token sheet; only the hue is set inline, from the ratio. */
    .node circle.body.cov { fill: hsl(var(--h), var(--tint-s), var(--cov-l)); }
    .node circle.body.cov.none { fill: var(--cov-none); }
    .node text.badge {
      fill: var(--fg-muted); font-size: 10px;
      stroke: var(--bg); stroke-width: 3px; paint-order: stroke;
      pointer-events: none; user-select: none;
    }
    .cov-swatch {
      width: .7rem; height: .7rem; border-radius: 2px; flex: none;
      display: inline-block; border: 1px solid var(--line-strong);
      background: hsl(var(--h), var(--tint-s), var(--cov-l));
    }
    .cov-swatch.none { background: var(--cov-none); }
    /* Physical heat: --f (0..1, set by the script) drives the sheet's ramp, as in the /phy table cells. */
    /* Uses `fill` because a node is an SVG circle. */
    .node circle.body.heat {
      --f: 0;
      fill: hsl(var(--heat-h), var(--heat-s),
        calc(var(--heat-l0) + (var(--heat-l1) - var(--heat-l0)) * var(--f)));
    }
    .node circle.body.heat.none { fill: var(--heat-none); }
    .heat-swatch {
      --f: 0;
      width: .7rem; height: .7rem; border-radius: 2px; flex: none;
      display: inline-block; border: 1px solid var(--line-strong);
      background: hsl(var(--heat-h), var(--heat-s),
        calc(var(--heat-l0) + (var(--heat-l1) - var(--heat-l0)) * var(--f)));
    }
    .heat-swatch.none { background: var(--heat-none); }
    .node text {
      fill: var(--fg); font-size: 11px; paint-order: stroke;
      stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
      pointer-events: none; user-select: none;
    }
    .node.dim { opacity: .16; }
    .node.sel circle.body { stroke: var(--accent); stroke-width: 2.5; }
    aside {
      width: 22rem; flex: none; border-left: 1px solid var(--line);
      background: var(--panel); overflow: auto; padding: .75rem;
    }
    aside h2 {
      font-size: 12px; margin: 0 0 .5rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--fg-muted);
    }
    .kv { display: grid; grid-template-columns: 6.5rem 1fr; gap: .15rem .5rem; }
    .kv dt { color: var(--fg-muted); }
    .kv dd { margin: 0; overflow-wrap: anywhere; }
    .pill {
      display: inline-block; padding: 0 .4rem; border-radius: 999px;
      border: 1px solid currentColor; font-size: 11px;
    }
    /* Cross-app row at the top of the inspector: the header buttons one size down. */
    .actions {
      display: flex; gap: .25rem; flex-wrap: wrap; margin: 0 0 .6rem;
    }
    .actions button { font-size: var(--fs-small); padding: .15rem .4rem; }
    .edges { list-style: none; margin: .35rem 0 0; padding: 0; }
    .edges li { padding: .1rem 0; overflow-wrap: anywhere; }
    .edges a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .edges a:hover { text-decoration: underline; }
    .muted { color: var(--fg-muted); }
    .msg-error { color: var(--err); font-weight: 600; }
    .msg-warn { color: var(--warn); font-weight: 600; }
    hr { border: 0; border-top: 1px solid var(--line); margin: .75rem 0; }
    footer {
      border-top: 1px solid var(--line); background: var(--panel);
      padding: .3rem .75rem; color: var(--fg-muted);
      display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
    }
    /* Shared hub chrome: connection dot and status words (connected / connecting… / offline), see docs/concepts/hub.md. */
    .dot { width: .55rem; height: .55rem; border-radius: 50%; display: inline-block; }
    .dot.connected { background: var(--ok); }
    .dot.connecting { background: var(--warn); }
    .dot.offline { background: var(--err); }
    /* Superseded: another tab of this pane took the hub slot. The word is also the control that takes it back (`showSuperseded`). */
    .take-back {
      color: var(--err); font-weight: 600;
      cursor: pointer; text-decoration: underline;
    }
    nav.switcher { display: flex; gap: .35rem; align-items: center; }
    nav.switcher a {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line-strong); border-radius: var(--radius-2);
      padding: .25rem .55rem; text-decoration: none; white-space: nowrap;
    }
    nav.switcher a:hover { border-color: var(--accent); color: var(--accent); }
    #empty {
      position: absolute; inset: 0; display: none; place-items: center;
      text-align: center; padding: 2rem;
    }
    #empty.show { display: grid; }
    #empty code {
      background: var(--panel-2); padding: .1rem .35rem; border-radius: 3px;
    }
  </style>
  <script>
    %HUB_INJECTION%
  </script>
</head>
<body>
  <header>
    <h1>rtl-buddy-gph <small id="counts"></small></h1>
    <div class="legend" id="legend"></div>
    <span class="grow"></span>
    <input type="search" id="search" placeholder="filter by id, label or file…" spellcheck="false">
    <label class="chk" title="Clicking a node also highlights it in the schematic — open it from the header links to see it. Nodes without a concrete instance (project-tier models, un-instantiated modules) highlight all instances of their module instead. Does nothing when no schematic tab is connected.">
      <input type="checkbox" id="opt-select" checked> sync schematic
    </label>
    <label class="chk" title="Clicking a node also jumps your editor to its source file and line — needs nvim with the rtl-buddy plugin (rb nvim-install) running in this project. Untick if no editor is connected.">
      <input type="checkbox" id="opt-open" checked> open in editor
    </label>
    <label class="chk" id="opt-cov-wrap" hidden
      title="Fill design nodes with their line-coverage ratio instead of their column colour, badge each test with the coverage it produced, and ring each spec coverage item by whether the run exercised it. Needs `rb graph results` after a coverage run.">
      <input type="checkbox" id="opt-cov"> coverage
    </label>
    <label class="chk" id="opt-heat-wrap"
      title="Fill module nodes with the physical model's heat ramp. Cells and area are the module definition's, from the synthesis half; power is summed over every instantiation of the module, from the leaf rows inside each one. Needs `rb synth` / `rb power`; the numbers are the ones the /phy pane shows.">
      <input type="checkbox" id="opt-heat"> heat
    </label>
    <label class="chk" id="heat-metric-wrap" hidden
      title="Which physical metric the module tints rank on. `cells` and `area` are the module definition's, from the synthesis half; `leakage`, `dynamic` and `total` are summed here over every instantiation of the module. Same five metrics, same order, as the /phy pane.">
      metric <select id="heat-metric"></select>
    </label>
    <label class="chk" id="heat-run-wrap" hidden
      title="Which physical run the tints come from — a project holds one artefact directory per partition, per corner and per power mode. The entry marked `newest — follows` keeps following whatever finished last; the /phy pane's own selector offers the same runs.">
      run <select id="heat-run"></select>
    </label>
    <label class="chk" title="How far the highlight reaches from the selected or hovered node: 1 = direct neighbours only, higher values follow the edges outward N hops.">
      hops <select id="opt-hops">
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option>
      </select>
    </label>
    <button id="reload" title="Re-fetch /graph.json (after rb graph build / rb graph results)">reload</button>
    <button id="fix-view" disabled
       title="Enabled when the selected node is not in the schematic's active model — click to switch the schematic to the model that contains it.">switch model</button>
    <nav class="switcher" aria-label="hub apps">
      <a href="/" title="Every app this hub serves, plus its live state.">⌂ hub</a>
      <a href="/sch" target="_blank" rel="noopener" data-origin="view"
         title="Open the schematic in a new tab. Once it is open, clicking a node here highlights the instance there (the sync schematic toggle).">sch ↗</a>
      <a href="/cov" target="_blank" rel="noopener" data-origin="cov"
         title="Open the coverage pane in a new tab.">cov ↗</a>
      <a href="/phy" target="_blank" rel="noopener" data-origin="phys"
         title="Open the physical pane in a new tab — area and power per module and per instance.">phy ↗</a>
    </nav>
  </header>

  <main>
    <div id="canvas-wrap">
      <svg id="canvas" aria-label="rtl-buddy-gph">
        <g id="scene">
          <g id="bands"></g>
          <g id="links"></g>
          <g id="nodes"></g>
        </g>
      </svg>
      <div id="empty"><div id="empty-msg"></div></div>
    </div>
    <aside>
      <h2>inspector</h2>
      <div id="inspector"><p class="muted">Click a node.</p></div>
    </aside>
  </main>

  <footer>
    <span><span class="dot connecting" id="ws-dot"></span> <span id="ws-status">connecting…</span></span>
    <span id="peers" class="muted"></span>
    <span id="hub-version" class="muted"></span>
    <span class="grow"></span>
    <span id="msg" class="muted"></span>
  </footer>

<script>
(function () {
  'use strict';

  var GRAPH_URL = window.__RTL_BUDDY_GRAPH_URL__ || '/graph.json';

  // Data route of the physical model, injected by graph_page.render_graph_html.
  // `null` (global omitted) means no manifest under the project; the heat
  // control is muted.
  //
  // Decided when the page renders, so after a later `rb synth` the tab needs a
  // reload.
  var PHY_URL = window.__RTL_BUDDY_PHY_URL__ || null;

  // Metric switcher order. `hub.metrics` in the payload wins; this is the
  // fallback for an older hub. Same list as the /phy pane and the
  // `phys_focus.metric` enum.
  var HEAT_METRICS = ['cells', 'area', 'leakage', 'dynamic', 'total'];

  // Command that fills each half, matching HALF_PRODUCER in
  // rtl_buddy/phys/query.py.
  var HEAT_HALF_PRODUCER = { modules: 'rb synth', instances: 'rb power' };

  // Muted-control wording, the same as the landing page's phys card note. The
  // reload hint is local: the presence probe ran when the page rendered.
  var HEAT_ABSENT =
    'no physical model — run `rb synth` or `rb power` first, then reload this tab';

  // Left-to-right column order. Columns are not tiers. The server puts each
  // node's column in `category` (graph_page.categorize_nodes);
  // `graph.hub.columns` wins when served and this list is the fallback for an
  // older payload.
  var COLUMNS = [
    'spec', 'design', 'test-config', 'syn-config',
    'formal-config', 'cdc-config', 'test-cocotb', 'other'
  ];
  var COLUMN_COLOR = {
    'spec': 'var(--col-spec)',
    'design': 'var(--col-design)',
    'test-config': 'var(--col-test-config)',
    'syn-config': 'var(--col-syn-config)',
    'formal-config': 'var(--col-formal-config)',
    'cdc-config': 'var(--col-cdc-config)',
    'test-cocotb': 'var(--col-test-cocotb)',
    'other': 'var(--col-other)'
  };
  // Column for a node the server did not categorise (older hub, or a dangling
  // target the page created).
  var TIER_FALLBACK = {
    design: 'design', config: 'test-config', binding: 'test-cocotb'
  };
  var STATUS_COLOR = {
    PASS: 'var(--ok)', FAIL: 'var(--err)', SKIP: 'var(--warn)',
    NA: 'var(--warn)', UNKNOWN: 'var(--warn)'
  };
  // Node radius by type: navigation targets are larger than what hangs off
  // them.
  var RADIUS = {
    module: 9, instance: 7, test: 8, testbench: 7, suite: 8,
    model: 8, spec_block: 8, coverage_item: 5, spec_doc: 6,
    golden_model: 7, python_module: 7, port: 4, parameter: 4
  };

  var W = 3000, H = 1300;   // virtual layout extent (eight columns wide)
  var els = {
    scene: document.getElementById('scene'),
    bands: document.getElementById('bands'),
    links: document.getElementById('links'),
    nodes: document.getElementById('nodes'),
    svg: document.getElementById('canvas'),
    counts: document.getElementById('counts'),
    legend: document.getElementById('legend'),
    search: document.getElementById('search'),
    inspector: document.getElementById('inspector'),
    peers: document.getElementById('peers'),
    hubVersion: document.getElementById('hub-version'),
    msg: document.getElementById('msg'),
    wsDot: document.getElementById('ws-dot'),
    wsStatus: document.getElementById('ws-status'),
    empty: document.getElementById('empty'),
    emptyMsg: document.getElementById('empty-msg'),
    optSelect: document.getElementById('opt-select'),
    optOpen: document.getElementById('opt-open'),
    optHops: document.getElementById('opt-hops'),
    optCov: document.getElementById('opt-cov'),
    optCovWrap: document.getElementById('opt-cov-wrap'),
    optHeat: document.getElementById('opt-heat'),
    optHeatWrap: document.getElementById('opt-heat-wrap'),
    heatMetric: document.getElementById('heat-metric'),
    heatMetricWrap: document.getElementById('heat-metric-wrap'),
    heatRun: document.getElementById('heat-run'),
    heatRunWrap: document.getElementById('heat-run-wrap'),
    fixView: document.getElementById('fix-view')
  };

  var state = {
    nodes: [], links: [], byId: Object.create(null),
    out: Object.create(null), inc: Object.create(null),
    hiddenCols: Object.create(null), filter: '',
    selected: null, hovered: null, coverage: null, categories: {},
    // Physical half: the `/phy.json` body, the join computed from it
    // (`joinPhys`), the metric the tints rank on, and the run the body came
    // from (`null` = newest).
    phys: null, heat: null, heatMetric: null, physDir: null,
    // Extra nodes highlighted beside the selection by an inbound `phys_focus`
    // (one module exported under several ids).
    focusIds: null,
    view: { x: 0, y: 0, k: 1 }, ticks: 0, raf: 0
  };

  // ---------------------------------------------------------------
  // small helpers
  // ---------------------------------------------------------------

  function el(tag, attrs) {
    var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) { if (attrs[k] != null) n.setAttribute(k, attrs[k]); }
    return n;
  }
  function categoryOf(node) {
    if (!node) { return 'other'; }
    if (COLUMNS.indexOf(node.category) >= 0) { return node.category; }
    var fallback = TIER_FALLBACK[node.tier];
    return COLUMNS.indexOf(fallback) >= 0 ? fallback : 'other';
  }
  function colOf(node) {
    var i = COLUMNS.indexOf(categoryOf(node));
    return i < 0 ? COLUMNS.length - 1 : i;
  }
  function radiusOf(node) { return RADIUS[node.type] || 6; }
  function statusOf(node) {
    return node.results && node.results.status ? String(node.results.status) : null;
  }
  // ---- coverage -------------------------------------------------
  // Overlay coverage join: a design node carries a ratio, a `covitem:` node a
  // verdict, a test the scalars of its own run.
  var ITEM_COLOR = {
    'exercised': 'var(--ok)',
    'declared-only': 'var(--warn)',
    'observed-but-undeclared': 'var(--err)'
  };
  function covOf(node) {
    return node && node.coverage ? node.coverage : null;
  }
  function lineRatio(totals) {
    var t = totals && totals.line;
    return t && t.ratio != null ? t.ratio : null;
  }
  function designRatio(node) {
    var c = covOf(node);
    return c && c.kind === 'design' ? (c.ratio == null ? null : c.ratio) : null;
  }
  function testRatio(node) {
    return node.results ? lineRatio(node.results.coverage &&
      node.results.coverage.totals) : null;
  }
  function itemStatus(node) {
    var c = covOf(node);
    return c && c.kind === 'item' ? c.status : null;
  }
  function pct(ratio) {
    return ratio == null ? '\u2014' : (ratio * 100).toFixed(1) + '%';
  }
  // Same formula as /cov and the schematic overlay: only the hue moves, so one
  // palette edit reaches all three.
  function tintHue(el, ratio) {
    if (ratio == null) { el.classList.add('none'); return el; }
    el.classList.remove('none');
    el.style.setProperty('--h', String(Math.round(ratio * 120)));
    return el;
  }
  function coverageOn() {
    return !!(state.coverage && els.optCov.checked);
  }
  // ---- physical heat -------------------------------------
  // Physical model numbers painted onto `module:` nodes. The model is the one
  // /phy reads (rtl_buddy/phys/model.py): per-module rows (`cell_count`,
  // `area_um2`) and per-leaf power rows.
  //
  // Code between the heat-join markers is pure (no DOM, no page state) so tests
  // can run it in bare node.

  // >>> heat-join
  // Which half answers each metric. `dynamic` has no column: it is internal +
  // switching power, summed here (POWER_COLUMNS in rtl_buddy/phys/query.py).
  var HEAT_METRIC_DEFS = {
    cells:   { half: 'modules',   unit: '',    kind: 'count' },
    area:    { half: 'modules',   unit: 'µm²', kind: 'real' },
    leakage: { half: 'instances', unit: 'µW', kind: 'real' },
    dynamic: { half: 'instances', unit: 'µW', kind: 'real' },
    total:   { half: 'instances', unit: 'µW', kind: 'real' }
  };


  // Instance-path separator: OpenSTA prints `/` for a netlist read from
  // Verilog, but the graph's `inst:` ids and the schematic use `.`. Model rows
  // are converted to dots on the way in.
  //
  // An escaped identifier (`\gen[0].u_x`, ended by whitespace) is one atomic
  // segment: a `/` or `.` inside it is part of the name, so it is not split.
  // Its terminator is dropped so both spellings compare equal.
  //
  // Mirrors `level_path` in rtl_buddy/phys/query.py and `toWirePath` in
  // hub/phys_page.html; change all three together.
  function levelPath(path) {
    var text = String(path == null ? '' : path), out = '', at = true, i = 0;
    while (i < text.length) {
      var ch = text.charAt(i);
      if (at && ch === '\\') {
        var end = i;
        while (end < text.length && !/\s/.test(text.charAt(end))) { end++; }
        out += text.slice(i, end);
        while (end < text.length && /\s/.test(text.charAt(end))) { end++; }
        i = end; at = false;
        continue;

      else { out += ch; at = false; }

  // (graph.build.QUALIFIER_SEP) and reads it back off the LAST `@`. Split on
  // the last `@` of the whole id, never per path level: for
  // `inst:blk/blk.u_sub@verif/fifo.v2` a per-level split keeps `v2` as a level
  // and misses the module.

  // root (`inst:X/X` is X's own scope); model rows are relative to the top and
  // carry no root. So the first level comes off, and the empty string is the
  // top's own scope, which is a valid answer.

  // same rootless path means different coordinates in different elaborations.

  // under the wrapper.

  // `rooted: false` means the graph has no elaboration under that top; nothing
  // is attributed and the pane says so.

  // `shallowestInstancePath`).
  function instanceModuleIndex(links, top) {

    if (!wanted) { return { index: index, rooted: rooted }; }

      var target = String(l.target == null ? '' : l.target);
      if (target.indexOf('module:') !== 0) { return; }
      var name = stripQualifier(target).slice('module:'.length);
      var coord = instanceCoord(l.source);
      if (!name || !coord || coord.root !== wanted) { return; }
      rooted = true;
      if (index[coord.path] == null) { index[coord.path] = name; }

  // The module that PAYS for a leaf row: the module of the deepest instance
  // node that properly contains it.
  //
  // The power half cannot be joined by name: its `module` column is the Liberty
  // cell (`DFF_X1`), not an RTL module (docs/concepts/phys.md, "What the module
  // join can answer"), and a name join double-counts on collisions. Join by
  // PATH, as `rb phys instance <path>` does.
  //
  // Use a PROPER ancestor, never the row's own path: a leaf with its own
  // instance node (macro, black box) is instantiated in its parent's body.
  //
  // The walk is longest-prefix-first and ends at the root scope, so a missing
  // intermediate level attributes to the deepest level present.
  //
  // The result carries the instance PATH as well as the module: the roll-up
  // sums over instantiations, unlike the synthesis half.
  function ownerEntryOfPath(index, path) {
    var levels = String(path == null ? '' : path).split('.');
    for (var i = levels.length - 1; i >= 0; i--) {

  // nothing about which reading the sender meant. A reading that lands on a
  // real enclosing instance is preferred; the root scope is the last resort
  // across all readings.

    var levels = String(path == null ? '' : path).split('.');

  // (`area_um2` is the exception; Yosys rolls submodule area up.)
  //

  // DEFINITION's, counted once; this sum is over every INSTANTIATION. Eight
  // FIFOs give one synthesis row and eight FIFOs' worth of leakage. That suits
  // a heat map but not dividing by area, so the entry carries `instances`
  // beside `leaves` and the inspector prints both with the caveat.
  function rollUpPower(rows, index) {
    var byModule = Object.create(null);
    var seen = Object.create(null);

    (rows || []).forEach(function (row) {

      if (owner === null) { unattributed++; return; }

      if (!acc) {

          instances: 0, leaves: 0

        (seen[owner.module] = Object.create(null));

      acc.leaves++;
      acc.leakage = heatAdd(acc.leakage, row.leakage_uw);
      acc.internal = heatAdd(acc.internal, row.internal_uw);
      acc.switching = heatAdd(acc.switching, row.switching_uw);

    };
  }

  // The whole join, module name -> entry, from a `/phy.json` body and the
  // graph's links.
  //
  // * Synthesis half: joined BY NAME. Its `module` column is an RTL module
  //   name, as is a graph `module:` node.
  // * Power half: joined BY PATH, rolled up through the instance nodes
  //   (`rollUpPower`).

  // inlined can still enclose leaves that burn power.
  function joinPhys(links, payload) {

    var index = instanceModuleIndex(links, top);

    var modules = Object.create(null);
    var entry = function (name) {
      var found = modules[name];
      if (!found) {

          // say what the power sum ran over.
          cells: null, area: null, leakage: null, internal: null,
          switching: null, total: null, instances: 0, leaves: 0

      if (!row || row.module == null) { return; }

      found.area = heatNum(row.area_um2);

      found.leakage = acc.leakage;
      found.internal = acc.internal;
      found.switching = acc.switching;
      found.total = acc.total;
      found.instances = acc.instances;
      found.leaves = acc.leaves;

      modules: modules, top: top, rooted: index.rooted, index: index.index,
      attributed: power.attributed, unattributed: power.unattributed,
      // Row counts per half, not the payload's `halves` block: a `present` half

        instances: ((payload && payload.instances) || []).length

  // One entry's value for one metric, with `dynamic` resolved. The single place

  function heatValueOf(found, metric) {
    if (!found) { return null; }
    if (metric === 'cells') { return found.cells; }
    if (metric === 'area') { return found.area; }
    if (metric === 'leakage') { return found.leakage; }
    if (metric === 'total') { return found.total; }
    if (metric === 'dynamic') {

      return (found.internal || 0) + (found.switching || 0);
    }

  // all model rows, so modules absent from the picture cannot flatten every
  // visible node.
  function heatMaxOf(names, join, metric) {
    var max = null;
    (names || []).forEach(function (name) {
      var value = heatValueOf(join && join.modules[name], metric);
      if (typeof value === 'number' && (max === null || value > max)) { max = value; }

  // unmapped run).
  function initialHeatMetric(payload) {
    return ((payload && payload.instances) || []).length ? 'total' : 'cells';

  // `fmt`.

  // <<< heat-join

  function heatOn() {
    return !!(state.heat && els.optHeat.checked);
  }

  // Linear against the MAXIMUM, not the total: a share-of-total ramp over a
  // thousand modules is all pale. Same as /phy's `heatCell`.
  function heatTint(el, value, max) {
    if (typeof value !== 'number' || max === null || max <= 0) {
      el.classList.add('none');
      return el;
    }
    el.classList.remove('none');
    el.style.setProperty('--f', String(Math.max(0, Math.min(1, value / max))));

  // qualifier, so `module:fifo@verif/fifo` asks about `fifo`.
  function heatModuleName(n, out) {

    return name ? (stripQualifier(name) || null) : null;
  }

  // One module's numbers as a line for the node's tooltip: every metric, not
  // only the selected one. Counts are spelled out because cells and area are
  // the definition's while power is summed over instantiations (`rollUpPower`).
  function heatTooltip(name, found) {
    var parts = [name];
    HEAT_METRICS.forEach(function (metric) {
      parts.push(metric + ' ' + heatFmt(heatValueOf(found, metric), metric));
    });
    if (found && found.instances) {
      parts.push('power over ' + found.instances + ' instantiation' +
        (found.instances === 1 ? '' : 's') + ' (' + found.leaves +
        ' leaf row' + (found.leaves === 1 ? '' : 's') + ')');

  }
  function labelOf(node) {
    return node.label || String(node.id).replace(/^[a-z_]+:/, '');
  }
  function note(text, level) {
    els.msg.textContent = text || '';
    els.msg.className =
      level === 'error' ? 'msg-error' : level === 'warn' ? 'msg-warn' : 'muted';
  }

  // ---------------------------------------------------------------
  // hub WebSocket — same /ws the SPA uses, same envelope shapes
  // ---------------------------------------------------------------

  var ws = null, wsReady = false, retryMs = 500, pending = Object.create(null);
  var activeModel = null;

  // hello then asks the hub to evict the incumbent. Cleared on welcome.
  var pendingTakeover = false;
  // Set when the hub evicted this tab for a newer graph tab. Auto-reconnect

  // two tabs evict each other.
  var superseded = false;

  function refreshActiveModel() {
    request('state_snapshot', {}, function (reply) {
      if (reply.kind === 'response') { activeModel = reply.payload.active_model; }
    });
  }

  // >>> hello-payload

  // cov_page.html; change all three together.

    return send({
      v: 1, id: uuid(), origin: 'graph', kind: 'request', type: 'hello',
      payload: helloPayload(pendingTakeover)

  function connect() {

    catch (e) { scheduleReconnect(); return; }

    ws.addEventListener('open', sendHello);
    ws.addEventListener('message', function (ev) {
      var env; try { env = JSON.parse(ev.data); } catch (e) { return; }
      applyEnvelope(env);

      // repaint the strip over the take-back control or restart the retry loop.
      if (superseded) { return; }
      els.wsDot.className = 'dot offline';
      els.wsStatus.textContent = 'offline';
      els.wsStatus.title = 'lost /ws — retrying';
      scheduleReconnect();
    });
    ws.addEventListener('error', function () { /* close handles it */ });

  }

        refreshActiveModel();
        clearTakeBack();
        els.wsDot.className = 'dot connected';
        els.wsStatus.textContent = 'connected';
        setHubVersion(env.payload && env.payload.server_version);
        setPeers(env.payload && env.payload.registered_clients);
        break;
      case 'peer_joined':
      case 'bye':

        break;
      case 'view_changed':

        // is what a `module:` click resolves against (`currentModelRoots`),
        // synchronously.
        //
        // It is the ACTIVE MODEL's roots, not necessarily what the schematic
        // shows: under `view_mode: 'tb'` the elaboration is rooted at the
        // testbench top, which `activeModelRoots` does not model. Harmless: the
        // DUT-rooted path is shallower and wins anyway.
        if (env.payload && typeof env.payload.model === 'string' && env.payload.model) {
          activeModel = env.payload.model;
        }
        break;
      case 'graph_focus':
        if (env.origin === 'graph') { break; }
        focusById(env.payload && env.payload.node, { emit: false, announce: true });
        break;
      case 'selection_changed':
        if (env.origin === 'graph') { break; }
        var ip = env.payload && env.payload.instance_path;
        if (Array.isArray(ip)) { ip = ip[0]; }
        focusByInstancePath(ip);
        break;

        if (env.origin === 'graph') { break; }
        applyPhysFocus(env.payload);
