<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rtl-buddy-gph</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/hub/assets/rtl-buddy-favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/hub/assets/rtl-buddy-favicon-16.png">
  <!--
    Served by rtl_buddy.hub.graph_page at GET /graph (rtl_buddy#382).

    Offline on purpose: no CDN, no web font, no build step. The hub is
    routinely run on machines with no route off localhost, and a viewer
    that needs one is a viewer that does not open. The one stylesheet
    link is same-origin — /hub/theme.css is served by this same hub
    process (rtl-buddy/rtl_buddy#398), so the page still needs no route
    off the machine; the block below repeats only the tokens the page
    cannot render without, as a fallback for a sheet that 404s (an old
    hub serving a new pane).

    ORDER MATTERS: the fallback block comes BEFORE the sheet link. Both
    select :root, so they tie on specificity and document order decides
    — a fallback placed after the link would permanently shadow the
    sheet, including its @media (prefers-color-scheme: dark) block, and
    every later palette edit would silently stop reaching this pane.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --bg:          #f8fafc;
      --panel:       #ffffff;
      --panel-2:     #f1f5f9;
      --line:        #e2e8f0;
      --line-strong: #cbd5e1;
      --fg:          #1e293b;
      --fg-muted:    #64748b;
      --accent:      #2563eb;
      --ok:          #16a34a;
      --warn:        #b45309;
      --err:         #dc2626;
      /* One colour per column (see COLUMNS below). Eight hues, each
         legible on both surfaces: pink, blue, green, amber, violet,
         cyan, lime, slate. */
      --col-spec:          #be185d;
      --col-design:        #1f6fd0;
      --col-test-config:   #0f7a52;
      --col-syn-config:    #b97407;
      --col-formal-config: #7c53d6;
      --col-cdc-config:    #0e7490;
      --col-test-cocotb:   #557c0b;
      --col-other:         #6b7688;
      /* Coverage ramp, shared with the /cov app and the schematic
         overlay: hsl(pct * 1.2, --tint-s, --cov-l). */
      --tint-s:   70%;
      --cov-l:    82%;
      --cov-none: #e5e7eb;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --fs-base:  13px;
      --fs-small: 11px;
      --radius-1: 3px;
      --radius-2: 4px;
    }
  </style>
  <link rel="stylesheet" href="/hub/theme.css">
  <style>
    /* Page-local derivations of the shared tokens. Edges are the one
       thing the graph needs that no other app does, so they are
       expressed here in terms of the sheet rather than tokenized. */
    :root {
      --edge:     var(--line-strong);
      --edge-hot: var(--accent);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font: var(--fs-base)/1.45 var(--font-mono);
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
      padding: .5rem .75rem; border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 {
      font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .02em;
      white-space: nowrap;
    }
    header h1 small { color: var(--fg-muted); font-weight: 400; }
    .grow { flex: 1 1 auto; }
    input[type="search"] {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line); border-radius: 4px;
      padding: .25rem .5rem; min-width: 14rem;
    }
    input[type="search"]:focus { outline: 1px solid var(--accent); }
    button {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line); border-radius: 4px;
      padding: .25rem .55rem; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    button:disabled:hover { border-color: var(--line); }
    a.btn {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line); border-radius: 4px;
      padding: .25rem .55rem; text-decoration: none; white-space: nowrap;
    }
    a.btn:hover { border-color: var(--accent); }
    label.chk { display: inline-flex; align-items: center; gap: .3rem; cursor: pointer; }
    .legend { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .swatch {
      width: .7rem; height: .7rem; border-radius: 50%;
      display: inline-block; flex: none;
    }
    main { flex: 1 1 auto; display: flex; min-height: 0; }
    #canvas-wrap { flex: 1 1 auto; position: relative; min-width: 0; }
    svg { width: 100%; height: 100%; display: block; cursor: grab; }
    svg.panning { cursor: grabbing; }
    .col-band { fill: var(--panel); opacity: .35; }
    .col-label {
      fill: var(--fg-muted); font-size: 13px; letter-spacing: .18em;
      text-transform: uppercase; text-anchor: middle;
    }
    .link { stroke: var(--edge); stroke-width: 1; fill: none; }
    .link.hot { stroke: var(--edge-hot); stroke-width: 1.8; }
    .link.dim { opacity: .12; }
    .node circle.body { stroke: var(--bg); stroke-width: 1.2; cursor: pointer; }
    /* A dangling target's ghost: hollow, dashed, in the column colour —
       the CSS class is load-bearing because this rule must beat the
       .body stroke above, which presentation attributes cannot. */
    .node circle.body.dangling { stroke: var(--col-other); stroke-width: 1.4; stroke-dasharray: 3 2; }
    .node circle.ring { fill: none; stroke-width: 2.4; }
    /* Coverage tint. The ramp lives in the token sheet so the graph
       pane, the /cov app and the schematic overlay cannot drift apart;
       only the hue is per node, and it is set inline from the ratio. */
    .node circle.body.cov { fill: hsl(var(--h), var(--tint-s), var(--cov-l)); }
    .node circle.body.cov.none { fill: var(--cov-none); }
    .node text.badge {
      fill: var(--fg-muted); font-size: 10px;
      stroke: var(--bg); stroke-width: 3px; paint-order: stroke;
      pointer-events: none; user-select: none;
    }
    .cov-swatch {
      width: .7rem; height: .7rem; border-radius: 2px; flex: none;
      display: inline-block; border: 1px solid var(--line-strong);
      background: hsl(var(--h), var(--tint-s), var(--cov-l));
    }
    .cov-swatch.none { background: var(--cov-none); }
    .node text {
      fill: var(--fg); font-size: 11px; paint-order: stroke;
      stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
      pointer-events: none; user-select: none;
    }
    .node.dim { opacity: .16; }
    .node.sel circle.body { stroke: var(--accent); stroke-width: 2.5; }
    aside {
      width: 22rem; flex: none; border-left: 1px solid var(--line);
      background: var(--panel); overflow: auto; padding: .75rem;
    }
    aside h2 {
      font-size: 12px; margin: 0 0 .5rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--fg-muted);
    }
    .kv { display: grid; grid-template-columns: 6.5rem 1fr; gap: .15rem .5rem; }
    .kv dt { color: var(--fg-muted); }
    .kv dd { margin: 0; overflow-wrap: anywhere; }
    .pill {
      display: inline-block; padding: 0 .4rem; border-radius: 999px;
      border: 1px solid currentColor; font-size: 11px;
    }
    /* The cross-app row at the top of the inspector. Same buttons as the
       header, one size down, because they are about the selection rather
       than about the pane. */
    .actions {
      display: flex; gap: .25rem; flex-wrap: wrap; margin: 0 0 .6rem;
    }
    .actions button { font-size: var(--fs-small); padding: .15rem .4rem; }
    .edges { list-style: none; margin: .35rem 0 0; padding: 0; }
    .edges li { padding: .1rem 0; overflow-wrap: anywhere; }
    .edges a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .edges a:hover { text-decoration: underline; }
    .muted { color: var(--fg-muted); }
    .msg-error { color: var(--err); font-weight: 600; }
    .msg-warn { color: var(--warn); font-weight: 600; }
    hr { border: 0; border-top: 1px solid var(--line); margin: .75rem 0; }
    footer {
      border-top: 1px solid var(--line); background: var(--panel);
      padding: .3rem .75rem; color: var(--fg-muted);
      display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
    }
    /* Shared hub chrome: connection dot + one vocabulary
       (connected / connecting… / offline) — docs/concepts/hub.md. */
    .dot { width: .55rem; height: .55rem; border-radius: 50%; display: inline-block; }
    .dot.connected { background: var(--ok); }
    .dot.connecting { background: var(--warn); }
    .dot.offline { background: var(--err); }
    /* A fourth strip state, and the only one that is also a control:
       another tab of THIS pane took the hub slot, and the words are the
       way back (`showSuperseded`). Not a status word — it says what
       happened and what a click will do. */
    .take-back {
      color: var(--err); font-weight: 600;
      cursor: pointer; text-decoration: underline;
    }
    nav.switcher { display: flex; gap: .35rem; align-items: center; }
    nav.switcher a {
      background: var(--panel-2); color: var(--fg); font: inherit;
      border: 1px solid var(--line-strong); border-radius: var(--radius-2);
      padding: .25rem .55rem; text-decoration: none; white-space: nowrap;
    }
    nav.switcher a:hover { border-color: var(--accent); color: var(--accent); }
    #empty {
      position: absolute; inset: 0; display: none; place-items: center;
      text-align: center; padding: 2rem;
    }
    #empty.show { display: grid; }
    #empty code {
      background: var(--panel-2); padding: .1rem .35rem; border-radius: 3px;
    }
  </style>
  <script>
    %HUB_INJECTION%
  </script>
</head>
<body>
  <header>
    <h1>rtl-buddy-gph <small id="counts"></small></h1>
    <div class="legend" id="legend"></div>
    <span class="grow"></span>
    <input type="search" id="search" placeholder="filter by id, label or file…" spellcheck="false">
    <label class="chk" title="Clicking a node also highlights it in the schematic — open it from the header links to see it. Nodes without a concrete instance (project-tier models, un-instantiated modules) highlight all instances of their module instead. Does nothing when no schematic tab is connected.">
      <input type="checkbox" id="opt-select" checked> sync schematic
    </label>
    <label class="chk" title="Clicking a node also jumps your editor to its source file and line — needs nvim with the rtl-buddy plugin (rb nvim-install) running in this project. Untick if no editor is connected.">
      <input type="checkbox" id="opt-open" checked> open in editor
    </label>
    <label class="chk" id="opt-cov-wrap" hidden
      title="Fill design nodes with their line-coverage ratio instead of their column colour, badge each test with the coverage it produced, and ring each spec coverage item by whether the run exercised it. Needs `rb graph results` after a coverage run.">
      <input type="checkbox" id="opt-cov"> coverage
    </label>
    <label class="chk" title="How far the highlight reaches from the selected or hovered node: 1 = direct neighbours only, higher values follow the edges outward N hops.">
      hops <select id="opt-hops">
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option>
      </select>
    </label>
    <button id="reload" title="Re-fetch /graph.json (after rb graph build / rb graph results)">reload</button>
    <button id="fix-view" disabled
       title="Enabled when the selected node is not in the schematic's active model — click to switch the schematic to the model that contains it.">switch model</button>
    <nav class="switcher" aria-label="hub apps">
      <a href="/" title="Every app this hub serves, plus its live state.">⌂ hub</a>
      <a href="/sch" target="_blank" rel="noopener" data-origin="view"
         title="Open the schematic in a new tab. Once it is open, clicking a node here highlights the instance there (the sync schematic toggle).">sch ↗</a>
      <a href="/cov" target="_blank" rel="noopener" data-origin="cov"
         title="Open the coverage pane in a new tab.">cov ↗</a>
    </nav>
  </header>

  <main>
    <div id="canvas-wrap">
      <svg id="canvas" aria-label="rtl-buddy-gph">
        <g id="scene">
          <g id="bands"></g>
          <g id="links"></g>
          <g id="nodes"></g>
        </g>
      </svg>
      <div id="empty"><div id="empty-msg"></div></div>
    </div>
    <aside>
      <h2>inspector</h2>
      <div id="inspector"><p class="muted">Click a node.</p></div>
    </aside>
  </main>

  <footer>
    <span><span class="dot connecting" id="ws-dot"></span> <span id="ws-status">connecting…</span></span>
    <span id="peers" class="muted"></span>
    <span id="hub-version" class="muted"></span>
    <span class="grow"></span>
    <span id="msg" class="muted"></span>
  </footer>

<script>
(function () {
  'use strict';

  var GRAPH_URL = window.__RTL_BUDDY_GRAPH_URL__ || '/graph.json';

  // Left-to-right column order. Columns are NOT tiers: the spec on the
  // left, the design in the middle, one column per verification flow on
  // the right. The server computes each node's column into `category`
  // (rtl_buddy.hub.graph_page.categorize_nodes) because two of the inputs
  // — which design-tier nodes came from a testbench elaboration, and which
  // flow the suite that owns them runs — are graph-wide joins not worth
  // redoing per render. `graph.hub.columns` is authoritative when served;
  // this list is the fallback for an older payload.
  var COLUMNS = [
    'spec', 'design', 'test-config', 'syn-config',
    'formal-config', 'cdc-config', 'test-cocotb', 'other'
  ];
  var COLUMN_COLOR = {
    'spec': 'var(--col-spec)',
    'design': 'var(--col-design)',
    'test-config': 'var(--col-test-config)',
    'syn-config': 'var(--col-syn-config)',
    'formal-config': 'var(--col-formal-config)',
    'cdc-config': 'var(--col-cdc-config)',
    'test-cocotb': 'var(--col-test-cocotb)',
    'other': 'var(--col-other)'
  };
  // Last-resort mapping for a node the server did not categorise (a
  // payload from an older hub, or a dangling target the page invented).
  var TIER_FALLBACK = {
    design: 'design', config: 'test-config', binding: 'test-cocotb'
  };
  var STATUS_COLOR = {
    PASS: 'var(--ok)', FAIL: 'var(--err)', SKIP: 'var(--warn)',
    NA: 'var(--warn)', UNKNOWN: 'var(--warn)'
  };
  // Node radius by type: the things a person navigates by are bigger
  // than the things that hang off them.
  var RADIUS = {
    module: 9, instance: 7, test: 8, testbench: 7, suite: 8,
    model: 8, spec_block: 8, coverage_item: 5, spec_doc: 6,
    golden_model: 7, python_module: 7, port: 4, parameter: 4
  };

  var W = 3000, H = 1300;   // virtual layout extent (eight columns wide)
  var els = {
    scene: document.getElementById('scene'),
    bands: document.getElementById('bands'),
    links: document.getElementById('links'),
    nodes: document.getElementById('nodes'),
    svg: document.getElementById('canvas'),
    counts: document.getElementById('counts'),
    legend: document.getElementById('legend'),
    search: document.getElementById('search'),
    inspector: document.getElementById('inspector'),
    peers: document.getElementById('peers'),
    hubVersion: document.getElementById('hub-version'),
    msg: document.getElementById('msg'),
    wsDot: document.getElementById('ws-dot'),
    wsStatus: document.getElementById('ws-status'),
    empty: document.getElementById('empty'),
    emptyMsg: document.getElementById('empty-msg'),
    optSelect: document.getElementById('opt-select'),
    optOpen: document.getElementById('opt-open'),
    optHops: document.getElementById('opt-hops'),
    optCov: document.getElementById('opt-cov'),
    optCovWrap: document.getElementById('opt-cov-wrap'),
    fixView: document.getElementById('fix-view')
  };

  var state = {
    nodes: [], links: [], byId: Object.create(null),
    out: Object.create(null), inc: Object.create(null),
    hiddenCols: Object.create(null), filter: '',
    selected: null, hovered: null, coverage: null, categories: {},
    view: { x: 0, y: 0, k: 1 }, ticks: 0, raf: 0
  };

  // ---------------------------------------------------------------
  // small helpers
  // ---------------------------------------------------------------

  function el(tag, attrs) {
    var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) { if (attrs[k] != null) n.setAttribute(k, attrs[k]); }
    return n;
  }
  function categoryOf(node) {
    if (!node) { return 'other'; }
    if (COLUMNS.indexOf(node.category) >= 0) { return node.category; }
    var fallback = TIER_FALLBACK[node.tier];
    return COLUMNS.indexOf(fallback) >= 0 ? fallback : 'other';
  }
  function colOf(node) {
    var i = COLUMNS.indexOf(categoryOf(node));
    return i < 0 ? COLUMNS.length - 1 : i;
  }
  function radiusOf(node) { return RADIUS[node.type] || 6; }
  function statusOf(node) {
    return node.results && node.results.status ? String(node.results.status) : null;
  }
  // ---- coverage -------------------------------------------------
  // The overlay's coverage join (rtl-buddy/rtl_buddy#402): a design
  // node carries a ratio, a `covitem:` node carries a verdict, and a
  // test carries the scalars its own run produced.
  var ITEM_COLOR = {
    'exercised': 'var(--ok)',
    'declared-only': 'var(--warn)',
    'observed-but-undeclared': 'var(--err)'
  };
  function covOf(node) {
    return node && node.coverage ? node.coverage : null;
  }
  function lineRatio(totals) {
    var t = totals && totals.line;
    return t && t.ratio != null ? t.ratio : null;
  }
  function designRatio(node) {
    var c = covOf(node);
    return c && c.kind === 'design' ? (c.ratio == null ? null : c.ratio) : null;
  }
  function testRatio(node) {
    return node.results ? lineRatio(node.results.coverage &&
      node.results.coverage.totals) : null;
  }
  function itemStatus(node) {
    var c = covOf(node);
    return c && c.kind === 'item' ? c.status : null;
  }
  function pct(ratio) {
    return ratio == null ? '\u2014' : (ratio * 100).toFixed(1) + '%';
  }
  // Same formula as the /cov app and the schematic overlay: only the
  // hue moves, saturation and lightness come from the token sheet, so
  // one palette edit reaches all three.
  function tintHue(el, ratio) {
    if (ratio == null) { el.classList.add('none'); return el; }
    el.classList.remove('none');
    el.style.setProperty('--h', String(Math.round(ratio * 120)));
    return el;
  }
  function coverageOn() {
    return !!(state.coverage && els.optCov.checked);
  }
  function labelOf(node) {
    return node.label || String(node.id).replace(/^[a-z_]+:/, '');
  }
  function note(text, level) {
    els.msg.textContent = text || '';
    els.msg.className =
      level === 'error' ? 'msg-error' : level === 'warn' ? 'msg-warn' : 'muted';
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) { return crypto.randomUUID(); }
    var b = new Uint8Array(16);
    (window.crypto || {}).getRandomValues
      ? crypto.getRandomValues(b)
      : (function () { for (var i = 0; i < 16; i++) { b[i] = Math.floor(Math.random() * 256); } })();
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    var h = []; for (var i = 0; i < 16; i++) { h.push((b[i] + 0x100).toString(16).slice(1)); }
    return h.slice(0, 4).join('') + '-' + h.slice(4, 6).join('') + '-' +
           h.slice(6, 8).join('') + '-' + h.slice(8, 10).join('') + '-' + h.slice(10).join('');
  }

  // ---------------------------------------------------------------
  // hub WebSocket — same /ws the SPA uses, same envelope shapes
  // ---------------------------------------------------------------

  var ws = null, wsReady = false, retryMs = 500, pending = Object.create(null);
  var activeModel = null;
  // Set when a hello was refused because the graph slot was taken, so
  // the NEXT hello asks the hub to evict the incumbent. Cleared on
  // welcome, so a later reconnect starts polite again.
  var pendingTakeover = false;
  // The hub kicked this tab out because a NEWER graph tab registered.
  // Racing back would only kick that tab out in turn — two tabs evicting
  // each other every retry is exactly the defect this state exists to
  // stop — so auto-reconnect stands down until the user asks for the
  // slot back.
  var superseded = false;

  function refreshActiveModel() {
    request('state_snapshot', {}, function (reply) {
      if (reply.kind === 'response') { activeModel = reply.payload.active_model; }
    });
  }

  // >>> hello-payload
  // The hello payload, built rather than inlined so the takeover rule is
  // one pure function.
  //
  // `takeover` is opt-in PER HELLO. The first hello of a connection is
  // polite — the field is omitted entirely, which `_run_handshake` in
  // hub/server.py reads as false — and only a retry, after the hub
  // answered `not_connected: graph client already registered`, asks it
  // to evict whoever holds the slot. Sending it unconditionally is what
  // made two tabs of this pane supersede each other in a loop.
  //
  // Same flow as the schematic SPA (rtl-buddy-view,
  // viewer/src/composables/useHub.js — its `_pendingTakeover` /
  // `superseded` handling), hand-duplicated here because a pane is a
  // self-contained single file by design; cov_page.html carries the same
  // helper with its own client and capabilities. Change the rule in one
  // and change it in all three, or the tabs start fighting again.
  function helloPayload(takeover) {
    var payload = {
      client: 'graph', version: '1.0.0', capabilities: ['graph_focus']
    };
    if (takeover) { payload.takeover = true; }
    return payload;
  }
  // <<< hello-payload

  function sendHello() {
    return send({
      v: 1, id: uuid(), origin: 'graph', kind: 'request', type: 'hello',
      payload: helloPayload(pendingTakeover)
    });
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    try { ws = new WebSocket(proto + '//' + location.host + '/ws'); }
    catch (e) { scheduleReconnect(); return; }

    ws.addEventListener('open', sendHello);
    ws.addEventListener('message', function (ev) {
      var env; try { env = JSON.parse(ev.data); } catch (e) { return; }
      applyEnvelope(env);
    });
    ws.addEventListener('close', function () {
      wsReady = false;
      // The hub closes the socket right after superseding us. That close
      // must not repaint the strip over the take-back affordance, and
      // must not restart the retry loop.
      if (superseded) { return; }
      els.wsDot.className = 'dot offline';
      els.wsStatus.textContent = 'offline';
      els.wsStatus.title = 'lost /ws — retrying';
      scheduleReconnect();
    });
    ws.addEventListener('error', function () { /* close handles it */ });
  }

  function scheduleReconnect() {
    if (superseded) { return; }
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 10000);
  }

  function send(env) {
    if (!ws || ws.readyState !== 1) { return false; }
    ws.send(JSON.stringify(env));
    return true;
  }

  function emit(type, payload) {
    return send({ v: 1, id: uuid(), origin: 'graph', kind: 'event', type: type, payload: payload });
  }

  function request(type, payload, onReply) {
    var id = uuid();
    if (onReply) { pending[id] = onReply; }
    return send({ v: 1, id: id, origin: 'graph', kind: 'request', type: type, payload: payload });
  }

  function applyEnvelope(env) {
    if (!env || typeof env !== 'object') { return; }
    // Correlation is by echoed `id`: a response carries the request's
    // own id (there is no separate in_reply_to field on the wire).
    if ((env.kind === 'response' || env.kind === 'error') && pending[env.id]) {
      var cb = pending[env.id]; delete pending[env.id];
      cb(env);
    }
    switch (env.type) {
      case 'welcome':
        wsReady = true; retryMs = 500;
        // Hello accepted — the next reconnect starts polite again.
        pendingTakeover = false;
        refreshActiveModel();
        clearTakeBack();
        els.wsDot.className = 'dot connected';
        els.wsStatus.textContent = 'connected';
        setHubVersion(env.payload && env.payload.server_version);
        setPeers(env.payload && env.payload.registered_clients);
        break;
      case 'peer_joined':
      case 'bye':
        // Cheap refresh: ask the hub who is connected rather than
        // maintaining a shadow registry that can drift.
        request('state_snapshot', {}, function (reply) {
          if (reply.kind === 'response' && reply.payload) { setPeers(reply.payload.peers); }
        });
        break;
      case 'view_changed':
        // The schematic switched models. Nothing repaints here, but the
        // cached model is now what a `module:` click resolves AGAINST
        // (`currentModelRoots`), and that decision is synchronous — it
        // cannot go ask the hub mid-click. So take the model off the
        // broadcast the hub already sends instead of resolving against
        // the model the SPA left half an hour ago.
        if (env.payload && typeof env.payload.model === 'string' && env.payload.model) {
          activeModel = env.payload.model;
        }
        break;
      case 'graph_focus':
        if (env.origin === 'graph') { break; }
        focusById(env.payload && env.payload.node, { emit: false, announce: true });
        break;
      case 'selection_changed':
        if (env.origin === 'graph') { break; }
        var ip = env.payload && env.payload.instance_path;
        if (Array.isArray(ip)) { ip = ip[0]; }
        focusByInstancePath(ip);
        break;
      default:
        break;
    }
    if (env.kind === 'error' && env.payload && !handleHubError(env.payload)) {
      note('hub error: ' + env.payload.code + ': ' + env.payload.message, 'error');
    }
  }

  // The two hub errors that are about this tab's REGISTRATION rather
  // than about a request it made. Returns true when the error has been
  // dealt with here, in which case the message area stays out of it —
  // one event, one surface.
  //
  // Mirrors the schematic SPA's `error` case (rtl-buddy-view,
  // viewer/src/composables/useHub.js); cov_page.html carries the same
  // handler. One one-client-per-origin rule, three apps that have to
  // obey it identically.
  function handleHubError(payload) {
    // Superseded: a newer graph tab owns the slot now. The strip says so
    // and offers the way back; auto-reconnect stops, because winning the
    // race back would only evict that tab.
    if (payload.code === 'superseded') {
      superseded = true;
      showSuperseded();
      if (ws) { try { ws.close(); } catch (e) { /* already gone */ } }
      return true;
    }
    // The polite hello lost to an incumbent. Ask once more, this time
    // asking the hub to evict it. Once, not in a loop: if the takeover
    // hello fails too, the next error falls through to the message area.
    // The hub drops the socket after refusing a hello, so this send
    // usually goes nowhere and the flag rides the reconnect instead —
    // both routes end in the same takeover hello.
    if (payload.code === 'not_connected' && !pendingTakeover &&
        /already registered/i.test(payload.message || '')) {
      pendingTakeover = true;
      sendHello();
      return true;
    }
    return false;
  }

  var SUPERSEDED_TEXT =
    'another graph tab took this connection — click to take back';
  var SUPERSEDED_HINT =
    'A newer graph tab registered with the hub, and the hub allows one ' +
    'client per origin. Click to take the slot back — that tab goes ' +
    'offline instead.';

  function showSuperseded() {
    els.wsDot.className = 'dot offline';
    els.wsStatus.textContent = SUPERSEDED_TEXT;
    els.wsStatus.title = SUPERSEDED_HINT;
    els.wsStatus.className = 'take-back';
    els.wsStatus.setAttribute('role', 'button');
    els.wsStatus.setAttribute('tabindex', '0');
  }

  function clearTakeBack() {
    els.wsStatus.className = '';
    els.wsStatus.removeAttribute('role');
    els.wsStatus.removeAttribute('tabindex');
  }

  // The user asking for the slot back. The other tab still holds it, so
  // the hello that reclaims it has to ask for the takeover the first
  // hello deliberately did not.
  function takeBack() {
    if (!superseded) { return; }
    superseded = false;
    pendingTakeover = true;
    retryMs = 500;
    clearTakeBack();
    els.wsDot.className = 'dot connecting';
    els.wsStatus.textContent = 'connecting…';
    els.wsStatus.title = hubTitle;
    connect();
  }

  // >>> origin-labels
  // Wire origin -> the name a user sees. The hub's `Origin` enum is the
  // WIRE vocabulary and it does not move for a rebrand: the schematic
  // app registers as `view` and the graph pane as `graph`, and both
  // keep doing so until protocol v2. Their DISPLAY names are `sch` and
  // `gph` (rtl-buddy-sch, rtl-buddy-gph), so this map is the seam, and
  // every place an origin reaches a user goes through it -- the peer
  // strip below, the header switcher's sibling labels, the `send -> X`
  // buttons and the cross-model button. An origin with no entry is
  // shown verbatim, which is what keeps a peer from a newer hub legible
  // instead of blank.
  //
  // It is also the one knob for a short name: change `gph` here and
  // every graph label in this file follows.
  //
  // A pane is a self-contained single file by design, so this helper is
  // hand-duplicated into cov_page.html and landing_page.html beside it,
  // and the SPA keeps its own copy under the same contract
  // (rtl-buddy-view, viewer/src/components/HubStatus.vue). Change the
  // map in one and change it in all four, or the tabs start calling the
  // same peer different things.
  var ORIGIN_LABELS = { view: 'sch', graph: 'gph' };

  function originLabel(origin) {
    var key = String(origin == null ? '' : origin);
    return Object.prototype.hasOwnProperty.call(ORIGIN_LABELS, key)
      ? ORIGIN_LABELS[key] : key;
  }
  // <<< origin-labels

  // The switcher's sibling links carry `data-origin`, so their labels
  // come from the map too (outside the markers: this one touches the
  // DOM). The text in the markup is what a person reading the file
  // sees; this is what the browser shows.
  function relabelSwitcher() {
    var links = document.querySelectorAll('.switcher a[data-origin]');
    for (var i = 0; i < links.length; i++) {
      links[i].textContent = originLabel(links[i].getAttribute('data-origin')) + ' \u2197';
    }
  }

  // The latest peer list, kept rather than only printed: the inspector's
  // cross-app row asks it which sibling apps are open, and "send" to an
  // app nobody is running is a click with no effect and no explanation.
  var peers = [];

  function hasPeer(origin) { return peers.indexOf(origin) >= 0; }

  function setPeers(list) {
    if (!Array.isArray(list)) { return; }
    var next = list.slice().sort();
    var changed = next.join('') !== peers.join('');
    peers = next;
    els.peers.textContent =
      'peers: ' + (list.length ? list.map(originLabel).join(', ') : 'none');
    // An app that just opened (or just closed) changes which of the
    // inspector's buttons are live, and the user is looking at that row
    // right now — repaint it rather than leaving it a click behind.
    // Only the row: re-rendering the inspector would throw its scroll
    // position away over a peer coming and going.
    if (changed) { refreshActions(); }
  }

  // >>> version-label
  // One version label, said the same way by all three hub apps: this
  // pane, cov_page.html beside it, and the schematic SPA (rtl-buddy-view,
  // viewer/src/buildInfo.js). A pane is a self-contained single file by
  // design, so this helper is hand-duplicated into cov_page.html rather
  // than shared, and the SPA keeps its own copy under the same
  // contract. Change the rule in one and change it in all three, or the
  // three tabs start disagreeing about which build is running.
  //
  // The input is rtl_buddy's own version as setuptools-scm writes it:
  // `6.26.2` from a release tag, `6.26.2.dev13+g3f5b890e3.d20260806`
  // from anything built past one. Everything before `+` is the version
  // a person quotes. The local segment after it carries the git SHA as
  // a `g`-prefixed hex run, alongside a `.dYYYYMMDD` build date that
  // says nothing the SHA does not — so the SHA is the payload, the date
  // is dropped, and nine hex digits is as much of a SHA as anyone
  // actually reads.
  //
  // A local segment with no `g<hex>` run is not an error — `1.0+local`
  // is a legal version — it simply has no build to point at, and the
  // base alone is the label.
  function versionLabel(raw) {
    var text = String(raw == null ? '' : raw);
    var plus = text.indexOf('+');
    var base = plus < 0 ? text : text.slice(0, plus);
    if (!base) { return null; }
    var local = plus < 0 ? '' : text.slice(plus + 1);
    var found = /(^|[.\-_])g([0-9a-fA-F]{4,})(?=$|[.\-_])/.exec(local);
    return found ? base + ' @ ' + found[2].slice(0, 9) : base;
  }
  // <<< version-label

  // Re-read on every welcome, not just the first: a reconnect can land
  // on a hub that was restarted on a newer build, and a label frozen at
  // the version of the first connection would then be quietly wrong.
  // Kept so the strip's tooltip can be restored after a state that
  // borrowed it (`showSuperseded` explains itself there instead).
  var hubTitle = '';

  function setHubVersion(raw) {
    var full = raw ? String(raw) : '';
    var label = versionLabel(full);
    els.hubVersion.textContent = label ? 'rtl-buddy ' + label : '';
    els.hubVersion.title = full;
    hubTitle = 'hub ' + full;
    els.wsStatus.title = hubTitle;
  }

  // ---------------------------------------------------------------
  // graph loading + indexing
  // ---------------------------------------------------------------

  function load() {
    note('loading ' + GRAPH_URL + '…');
    fetch(GRAPH_URL, { cache: 'no-store' }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (res) {
      if (!res.ok) { showEmpty(res.body && res.body.error); return; }
      ingest(res.body);
    }).catch(function (e) {
      showEmpty('could not read ' + GRAPH_URL + ': ' + e);
    });
  }

  function showEmpty(message) {
    els.empty.classList.add('show');
    els.emptyMsg.textContent = '';
    // The one piece of artwork this pane carries: a small mascot on the
    // "no data yet" panel, per the hub's identity-marks-only rule.
    var art = document.createElement('img');
    art.src = '/hub/assets/rtl-buddy-mascot-240.png';
    art.width = 120; art.height = 120; art.alt = '';
    els.emptyMsg.appendChild(art);
    var p = document.createElement('p');
    p.textContent = message || 'no graph to show.';
    var q = document.createElement('p');
    q.className = 'muted';
    q.appendChild(document.createTextNode('Build one with '));
    var c = document.createElement('code'); c.textContent = 'rb graph build';
    q.appendChild(c);
    q.appendChild(document.createTextNode(', then press reload.'));
    els.emptyMsg.appendChild(p); els.emptyMsg.appendChild(q);
    note('');
  }

  function ingest(payload) {
    els.empty.classList.remove('show');
    state.nodes = (payload.nodes || []).filter(function (n) { return n && n.id; });
    state.links = (payload.links || []).filter(function (l) {
      return l && typeof l.source === 'string' && typeof l.target === 'string';
    });
    state.byId = Object.create(null);
    state.out = Object.create(null);
    state.inc = Object.create(null);
    state.nodes.forEach(function (n) { state.byId[n.id] = n; });
    state.links.forEach(function (l) {
      // A link endpoint with no node of its own is a dangling target
      // (graph.merge.dangling_targets) — still a real answer, so it is
      // materialised as an attribute-less node instead of dropped.
      [l.source, l.target].forEach(function (id) {
        if (!state.byId[id]) {
          var ghost = { id: id, type: 'dangling', label: id, dangling: true };
          state.byId[id] = ghost; state.nodes.push(ghost);
        }
      });
      (state.out[l.source] = state.out[l.source] || []).push(l);
      (state.inc[l.target] = state.inc[l.target] || []).push(l);
    });

    var hub = (payload.graph && payload.graph.hub) || {};
    if (Array.isArray(hub.columns) && hub.columns.length) { COLUMNS = hub.columns; }
    state.coverage = hub.coverage || null;
    // The control appears only when there is coverage to show, and
    // arrives ticked: a run that produced coverage is a run whose
    // coverage is the reason the pane was opened.
    els.optCovWrap.hidden = !state.coverage;
    if (state.coverage && !els.optCov.dataset.touched) { els.optCov.checked = true; }
    renderHeader(hub);
    state.categories = hub.categories || {};
    renderLegend(state.categories);
    layoutInit();
    render();
    fit();
    startTicking();
    note(state.nodes.length + ' nodes, ' + state.links.length + ' links');
  }

  function renderHeader(hub) {
    var parts = [];
    var c = hub.counts || {};
    parts.push((c.nodes != null ? c.nodes : state.nodes.length) + ' nodes');
    parts.push((c.links != null ? c.links : state.links.length) + ' links');
    var s = hub.overlay_summary;
    if (s && s.statuses) {
      var st = Object.keys(s.statuses).sort().map(function (k) {
        return s.statuses[k] + ' ' + k;
      });
      if (st.length) { parts.push(st.join(' / ')); }
    } else if (hub.overlay_path == null) {
      parts.push('no results overlay');
    }
    var cs = hub.coverage && hub.coverage.summary;
    if (cs) {
      parts.push(pct((hub.coverage.totals && hub.coverage.totals.line || {}).ratio) +
        ' line');
      parts.push(cs.exercised + '/' + cs.items + ' items exercised');
      if (cs['observed-but-undeclared']) {
        parts.push(cs['observed-but-undeclared'] + ' undeclared');
      }
    }
    els.counts.textContent = '· ' + parts.join(' · ');
  }

  function renderLegend(counts) {
    els.legend.textContent = '';
    COLUMNS.forEach(function (col) {
      var count = counts[col] || 0;
      // An empty flow column is a fact about the project (no fpv suites
      // yet), so it keeps its band and its label; only an empty "other"
      // — which means nothing went unplaced — drops out of the legend.
      if (!count && col === 'other') { return; }
      var label = document.createElement('label');
      label.className = 'chk';
      var box = document.createElement('input');
      box.type = 'checkbox'; box.checked = !state.hiddenCols[col];
      box.addEventListener('change', function () {
        state.hiddenCols[col] = !box.checked;
        render();
      });
      var sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = COLUMN_COLOR[col] || 'var(--col-other)';
      label.appendChild(box); label.appendChild(sw);
      label.appendChild(document.createTextNode(col + ' ' + count));
      els.legend.appendChild(label);
    });
    if (!coverageOn()) { return; }
    var ramp = document.createElement('span');
    ramp.className = 'legend';
    ramp.title = 'Design nodes are filled by line coverage; a coverage item is ' +
      'ringed by whether the run exercised it.';
    [['0%', 0], ['50%', 0.5], ['100%', 1], ['no data', null]].forEach(function (stop) {
      var sw = document.createElement('span');
      sw.className = 'cov-swatch';
      tintHue(sw, stop[1]);
      var wrap = document.createElement('span');
      wrap.className = 'chk';
      wrap.appendChild(sw);
      wrap.appendChild(document.createTextNode(stop[0]));
      ramp.appendChild(wrap);
    });
    els.legend.appendChild(ramp);
  }

  // ---------------------------------------------------------------
  // layout: tier columns + a small force relaxation
  // ---------------------------------------------------------------

  var colX = [];

  function layoutInit() {
    var used = {};
    state.nodes.forEach(function (n) { used[colOf(n)] = true; });
    var ncol = COLUMNS.length;
    colX = [];
    for (var i = 0; i < ncol; i++) { colX.push(((i + 0.5) / ncol) * W); }

    var perCol = {};
    state.nodes.forEach(function (n) {
      var c = colOf(n);
      perCol[c] = (perCol[c] || 0) + 1;
    });
    var seen = {};
    state.nodes.forEach(function (n) {
      var c = colOf(n);
      var i = seen[c] = (seen[c] || 0);
      seen[c] = i + 1;
      var total = perCol[c] || 1;
      // Deterministic seeding: a reload lands on the same picture, so a
      // node the user just looked at is still where they left it.
      n.x = colX[c] + ((i % 7) - 3) * 14;
      n.y = ((i + 0.5) / total) * H;
      n.vx = 0; n.vy = 0;
      n.fixed = false;
    });
    state.ticks = 0;
    void used;
  }

  var CELL = 70;

  function tick() {
    var i, n, m;
    // Repulsion, restricted to a uniform grid neighbourhood. The
    // all-pairs form is quadratic and a merged graph on a real project
    // is thousands of nodes, so the grid is what keeps the relaxation
    // interactive rather than a page freeze.
    var grid = Object.create(null);
    for (i = 0; i < state.nodes.length; i++) {
      n = state.nodes[i];
      var key = Math.floor(n.x / CELL) + ':' + Math.floor(n.y / CELL);
      (grid[key] = grid[key] || []).push(n);
    }
    for (i = 0; i < state.nodes.length; i++) {
      n = state.nodes[i];
      var cx = Math.floor(n.x / CELL), cy = Math.floor(n.y / CELL);
      for (var dx = -1; dx <= 1; dx++) {
        for (var dy = -1; dy <= 1; dy++) {
          var bucket = grid[(cx + dx) + ':' + (cy + dy)];
          if (!bucket) { continue; }
          for (var b = 0; b < bucket.length; b++) {
            m = bucket[b];
            if (m === n) { continue; }
            var rx = n.x - m.x, ry = n.y - m.y;
            var d2 = rx * rx + ry * ry;
            if (d2 > CELL * CELL || d2 === 0) {
              if (d2 === 0) { n.vx += (Math.random() - 0.5); n.vy += (Math.random() - 0.5); }
              continue;
            }
            var d = Math.sqrt(d2);
            var f = 900 / d2;
            n.vx += (rx / d) * f; n.vy += (ry / d) * f;
          }
        }
      }
    }
    // Springs along links.
    for (i = 0; i < state.links.length; i++) {
      var a = state.byId[state.links[i].source], z = state.byId[state.links[i].target];
      if (!a || !z) { continue; }
      var lx = z.x - a.x, ly = z.y - a.y;
      var ld = Math.sqrt(lx * lx + ly * ly) || 0.001;
      var force = (ld - 110) * 0.012;
      var ux = (lx / ld) * force, uy = (ly / ld) * force;
      a.vx += ux; a.vy += uy; z.vx -= ux; z.vy -= uy;
    }
    // Column anchor (the "tiered" half) + weak vertical centring, then
    // damping. The x anchor is stiff: a node must stay in its tier's
    // band, which is what makes the picture readable at a glance.
    var halfBand = (W / COLUMNS.length) * 0.42;
    for (i = 0; i < state.nodes.length; i++) {
      n = state.nodes[i];
      if (n.fixed) { n.vx = 0; n.vy = 0; continue; }
      n.vx += (colX[colOf(n)] - n.x) * 0.06;
      n.vy += (H / 2 - n.y) * 0.0015;
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += Math.max(-24, Math.min(24, n.vx));
      n.y += Math.max(-24, Math.min(24, n.vy));
      // The anchor spring alone loses to a well-connected node's link
      // springs; the band promise above is only real with a hard clamp.
      var bandC = colX[colOf(n)];
      if (n.x < bandC - halfBand) { n.x = bandC - halfBand; n.vx = 0; }
      else if (n.x > bandC + halfBand) { n.x = bandC + halfBand; n.vx = 0; }
    }
    state.ticks++;
  }

  function startTicking() {
    if (state.raf) { cancelAnimationFrame(state.raf); }
    var step = function () {
      var budget = state.ticks < 60 ? 3 : 1;
      for (var i = 0; i < budget; i++) { tick(); }
      position();
      if (state.ticks < 260) { state.raf = requestAnimationFrame(step); }
      else { state.raf = 0; }
    };
    state.raf = requestAnimationFrame(step);
  }

  // ---------------------------------------------------------------
  // rendering
  // ---------------------------------------------------------------

  var gfx = { nodes: Object.create(null), links: [] };

  function render() {
    els.bands.textContent = '';
    els.links.textContent = '';
    els.nodes.textContent = '';
    gfx = { nodes: Object.create(null), links: [] };

    var ncol = COLUMNS.length;
    for (var c = 0; c < ncol; c++) {
      if (c % 2 === 0) {
        els.bands.appendChild(el('rect', {
          x: (c / ncol) * W, y: -H, width: W / ncol, height: 3 * H, class: 'col-band'
        }));
      }
      var t = el('text', { x: colX[c], y: -30, class: 'col-label' });
      t.textContent = COLUMNS[c];
      els.bands.appendChild(t);
    }

    state.links.forEach(function (l) {
      var a = state.byId[l.source], z = state.byId[l.target];
      if (!a || !z) { return; }
      var line = el('line', { class: 'link' });
      line.__link = l; line.__a = a; line.__z = z;
      els.links.appendChild(line);
      gfx.links.push(line);
    });

    var cov = coverageOn();
    state.nodes.forEach(function (n) {
      var g = el('g', { class: 'node' });
      var r = radiusOf(n);
      var status = statusOf(n);
      // A test's ring is its last verdict; a coverage item's ring is
      // whether the run exercised it. Both answer "how did this go",
      // so they share the ring rather than competing for the fill.
      var item = cov ? itemStatus(n) : null;
      var ringColor = item
        ? ITEM_COLOR[item]
        : (status ? (STATUS_COLOR[status] || 'var(--warn)') : null);
      if (ringColor) {
        g.appendChild(el('circle', { class: 'ring', r: r + 3.5, stroke: ringColor }));
      }
      // Coverage mode repaints the design column with the ramp; the
      // column bands behind the nodes still carry the column identity,
      // so nothing is lost by borrowing the fill.
      var tinted = cov && categoryOf(n) === 'design' && !n.dangling;
      var body = el('circle', {
        class: (n.dangling ? 'body dangling' : 'body') + (tinted ? ' cov' : ''), r: r,
        fill: (n.dangling || tinted)
          ? null
          : (COLUMN_COLOR[categoryOf(n)] || 'var(--col-other)')
      });
      if (tinted) { tintHue(body, designRatio(n)); }
      g.appendChild(body);
      var label = el('text', { x: r + 5, y: 4 });
      label.textContent = labelOf(n);
      g.appendChild(label);
      // Only where there is a number: a badge reading "—" on every test
      // that ran without coverage is nine labels saying nothing.
      var ratio = n.type === 'test' ? testRatio(n) : (tinted ? designRatio(n) : null);
      if (cov && ratio != null) {
        var bt = el('text', { class: 'badge', x: r + 5, y: 15 });
        bt.textContent = pct(ratio);
        g.appendChild(bt);
      }
      g.addEventListener('click', function (ev) {
        ev.stopPropagation();
        activate(n, { emit: true });
      });
      g.addEventListener('mouseenter', function () { state.hovered = n.id; applyClasses(); });
      g.addEventListener('mouseleave', function () { state.hovered = null; applyClasses(); });
      attachDrag(g, n);
      els.nodes.appendChild(g);
      gfx.nodes[n.id] = { g: g, label: label };
    });

    position();
    applyClasses();
  }

  function position() {
    for (var i = 0; i < gfx.links.length; i++) {
      var line = gfx.links[i];
      line.setAttribute('x1', line.__a.x); line.setAttribute('y1', line.__a.y);
      line.setAttribute('x2', line.__z.x); line.setAttribute('y2', line.__z.y);
    }
    for (var id in gfx.nodes) {
      var n = state.byId[id];
      gfx.nodes[id].g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
    }
  }

  function matches(n) {
    if (!state.filter) { return true; }
    var f = state.filter;
    return String(n.id).toLowerCase().indexOf(f) >= 0 ||
           String(n.label || '').toLowerCase().indexOf(f) >= 0 ||
           String(n.file || '').toLowerCase().indexOf(f) >= 0 ||
           String(n.type || '').toLowerCase().indexOf(f) >= 0;
  }

  function neighbours(id) {
    // BFS to `depth` hops, both edge directions — direction encodes
    // role, not reachability, same as `rb graph path`. Nodes in hidden
    // columns are not entered: expanding through an invisible node
    // would light two islands with no visible edge between them.
    var set = Object.create(null); set[id] = true;
    var depth = parseInt(els.optHops.value, 10) || 1;
    var frontier = [id];
    function visit(cand, next) {
      if (set[cand]) { return; }
      var n = state.byId[cand];
      if (n && state.hiddenCols[categoryOf(n)]) { return; }
      set[cand] = true; next.push(cand);
    }
    for (var d = 0; d < depth && frontier.length; d++) {
      var next = [];
      frontier.forEach(function (nid) {
        (state.out[nid] || []).forEach(function (l) { visit(l.target, next); });
        (state.inc[nid] || []).forEach(function (l) { visit(l.source, next); });
      });
      frontier = next;
    }
    return set;
  }

  function applyClasses() {
    var focus = state.hovered || state.selected;
    var near = focus ? neighbours(focus) : null;
    for (var id in gfx.nodes) {
      var n = state.byId[id];
      var g = gfx.nodes[id].g;
      var hidden = state.hiddenCols[categoryOf(n)];
      var dim = hidden || !matches(n) || (near && !near[id]);
      g.setAttribute('class', 'node' + (dim ? ' dim' : '') + (id === state.selected ? ' sel' : ''));
      g.style.display = hidden && !state.filter ? 'none' : '';
      // Labels are noise at a distance; show them for the nodes that
      // matter right now plus the big structural ones.
      var showLabel = !dim && (state.view.k > 0.55 || radiusOf(n) >= 8 || id === focus);
      gfx.nodes[id].label.style.display = showLabel ? '' : 'none';
    }
    for (var i = 0; i < gfx.links.length; i++) {
      var line = gfx.links[i];
      // An edge is hot when it lies inside the highlighted N-hop ball —
      // both endpoints reached — so the lit subgraph is coherent rather
      // than a star around the focus.
      var hot = near && near[line.__link.source] && near[line.__link.target];
      var off = state.hiddenCols[categoryOf(line.__a)] || state.hiddenCols[categoryOf(line.__z)];
      line.setAttribute('class', 'link' + (hot ? ' hot' : (focus ? ' dim' : '')));
      line.style.display = off ? 'none' : '';
    }
  }

  // ---------------------------------------------------------------
  // pan / zoom / drag
  // ---------------------------------------------------------------

  function applyView() {
    els.scene.setAttribute('transform',
      'translate(' + state.view.x + ',' + state.view.y + ') scale(' + state.view.k + ')');
  }

  function fit() {
    var rect = els.svg.getBoundingClientRect();
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    state.nodes.forEach(function (n) {
      minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
      minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
    });
    if (!isFinite(minX)) { return; }
    var pad = 60;
    var k = Math.min(
      rect.width / Math.max(1, (maxX - minX) + pad * 2),
      rect.height / Math.max(1, (maxY - minY) + pad * 2)
    );
    state.view.k = Math.max(0.08, Math.min(2.5, k));
    state.view.x = rect.width / 2 - ((minX + maxX) / 2) * state.view.k;
    state.view.y = rect.height / 2 - ((minY + maxY) / 2) * state.view.k;
    applyView();
  }

  function centerOn(n) {
    var rect = els.svg.getBoundingClientRect();
    state.view.k = Math.max(state.view.k, 0.8);
    state.view.x = rect.width / 2 - n.x * state.view.k;
    state.view.y = rect.height / 2 - n.y * state.view.k;
    applyView();
    applyClasses();
  }

  els.svg.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var rect = els.svg.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    var factor = Math.exp(-ev.deltaY * 0.0015);
    var k = Math.max(0.05, Math.min(6, state.view.k * factor));
    state.view.x = mx - (mx - state.view.x) * (k / state.view.k);
    state.view.y = my - (my - state.view.y) * (k / state.view.k);
    state.view.k = k;
    applyView(); applyClasses();
  }, { passive: false });

  (function panning() {
    var active = false, sx = 0, sy = 0, ox = 0, oy = 0;
    els.svg.addEventListener('pointerdown', function (ev) {
      if (ev.target.closest && ev.target.closest('.node')) { return; }
      active = true; sx = ev.clientX; sy = ev.clientY;
      ox = state.view.x; oy = state.view.y;
      els.svg.classList.add('panning');
      els.svg.setPointerCapture(ev.pointerId);
    });
    els.svg.addEventListener('pointermove', function (ev) {
      if (!active) { return; }
      state.view.x = ox + (ev.clientX - sx);
      state.view.y = oy + (ev.clientY - sy);
      applyView();
    });
    var stop = function (ev) {
      if (!active) { return; }
      active = false; els.svg.classList.remove('panning');
      try { els.svg.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    };
    els.svg.addEventListener('pointerup', stop);
    els.svg.addEventListener('pointercancel', stop);
  })();

  function attachDrag(g, n) {
    var dragging = false, moved = false;
    g.addEventListener('pointerdown', function (ev) {
      ev.stopPropagation();
      dragging = true; moved = false;
      n.fixed = true;
      g.setPointerCapture(ev.pointerId);
    });
    g.addEventListener('pointermove', function (ev) {
      if (!dragging) { return; }
      moved = true;
      n.x += ev.movementX / state.view.k;
      n.y += ev.movementY / state.view.k;
      position();
    });
    var release = function (ev) {
      if (!dragging) { return; }
      dragging = false;
      try { g.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
      if (moved) { n.fixed = false; state.ticks = 200; startTicking(); }
    };
    g.addEventListener('pointerup', release);
    g.addEventListener('pointercancel', release);
  }

  els.svg.addEventListener('click', function () {
    state.selected = null; renderInspector(null); applyClasses();
  });

  // ---------------------------------------------------------------
  // selection → hub envelopes
  // ---------------------------------------------------------------

  // >>> active-model
  // Which elaboration roots belong to the schematic's ACTIVE model.
  //
  // A design-tier instance id is `inst:<root>/<dot.path>` and the dot
  // path starts at that same root (`inst:X/X` is X's own root scope),
  // so the first component of an instance path names the elaboration it
  // was reached through — which is exactly what `maybeWarnCrossModel`
  // already compares against the active model.
  //
  // The model → root mapping is read off the served payload rather than
  // assumed: a `model:` node is stitched to the module it names by a
  // `maps_to` link (`config_tier.MAPS_TO`), so the targets of the ACTIVE
  // model's own `maps_to` links are its roots. The model name seeds the
  // set as well, because that stitch exists only once a config tier has
  // been built and a design-tier-only graph still roots its instances at
  // the model's top module. A suite qualifier (`@<suite>`,
  // `graph.build.QUALIFIER_SEP`) is appended to an id two files claimed;
  // it is not part of the module name, so it comes off.
  //
  // An unknown model — no `state_snapshot` yet, or a hub with no active
  // model at all — returns an EMPTY set, and an empty set is what makes
  // `shallowestInstancePath` behave exactly as it did before: no state
  // from the hub, no new preference.
  function activeModelRoots(links, model) {
    var roots = Object.create(null);
    if (typeof model !== 'string' || !model) { return roots; }
    roots[model] = true;
    (links || []).forEach(function (l) {
      if (!l || l.type !== 'maps_to') { return; }
      var source = String(l.source == null ? '' : l.source);
      var target = String(l.target == null ? '' : l.target);
      if (source.indexOf('model:') !== 0 || target.indexOf('module:') !== 0) { return; }
      var hash = source.indexOf('#');
      if (hash < 0 || source.slice(hash + 1) !== model) { return; }
      var name = target.slice('module:'.length).split('@')[0];
      if (name) { roots[name] = true; }
    });
    return roots;
  }

  // The instance a person means by "show me this module": the shallowest
  // one, PREFERRING the active model's own elaboration (#414).
  //
  // Ranking every loaded model's instances together silently landed the
  // selection in a model that is not on screen — where the schematic
  // highlights nothing, so the pane read as stuck, and the cross-model
  // warning that followed named a model the user never picked. A
  // candidate rooted in the active model therefore beats a shallower one
  // from anywhere else. Only when the active model instantiates the
  // module NOWHERE does the old all-models shallowest answer stand: a
  // vendor block the current model never touches is still worth landing
  // on, and refusing to resolve it would trade one silent miss for
  // another.
  //
  // Depth ties keep the first candidate — link order, the same rule and
  // the same answer as before.
  function shallowestInstancePath(paths, roots) {
    var best = null, bestOwned = false;
    (paths || []).forEach(function (p) {
      if (typeof p !== 'string' || !p) { return; }
      var owned = !!(roots && roots[p.split('.')[0]]);
      if (best === null || (owned && !bestOwned)) {
        best = p; bestOwned = owned; return;
      }
      if (owned === bestOwned && p.split('.').length < best.split('.').length) {
        best = p;
      }
    });
    return best;
  }
  // <<< active-model

  // `activeModelRoots` over the payload on screen, memoised on the two
  // things that can change it: the hub's active model and the ingested
  // graph (`ingest` replaces `state.links` wholesale, so identity is a
  // sound cache key).
  var modelRootsCache = null;
  function currentModelRoots() {
    if (!modelRootsCache || modelRootsCache.model !== activeModel ||
        modelRootsCache.links !== state.links) {
      modelRootsCache = {
        model: activeModel, links: state.links,
        roots: activeModelRoots(state.links, activeModel)
      };
    }
    return modelRootsCache.roots;
  }

  // The design tier's instance ids carry the hub resolver's identity
  // verbatim: `inst:<top>/<dot.path>`. An explicit `instance_path`
  // attribute wins when the exporter provides one.
  function instancePathFor(n) {
    if (!n) { return null; }
    if (typeof n.instance_path === 'string' && n.instance_path) { return n.instance_path; }
    if (n.type === 'instance' && String(n.id).indexOf('inst:') === 0) {
      var rest = String(n.id).slice(5);
      var slash = rest.indexOf('/');
      if (slash >= 0) { return rest.slice(slash + 1); }
    }
    if (n.type === 'module') {
      // A module is not a coordinate the schematic can select — its
      // instances are. Collect every one of them and let
      // `shallowestInstancePath` pick: the shallowest, inside the
      // active model when the active model has any.
      var paths = [];
      (state.inc[n.id] || []).forEach(function (l) {
        if (l.type !== 'instance_of') { return; }
        var p = instancePathFor(state.byId[l.source]);
        if (p) { paths.push(p); }
      });
      return shallowestInstancePath(paths, currentModelRoots());
    }
    return null;
  }

  // >>> module-name
  // The coarser identity, for a node `instancePathFor` cannot place.
  // A project-tier graph — the common case, and all you get before a
  // design tier is built — carries its design content on `model:`
  // nodes, so every click on one broadcast nothing at all and the pane
  // looked inert. A module name is the fallback the schematic can
  // still act on: it highlights every instance of that module.
  //
  // A model is named after its top module, so the fragment after `#`
  // in `model:design/common/models.yaml#ip_async_fifo` IS the module
  // name. A `module:` node only reaches here when no `instance_of`
  // link was extracted for it, and then its id minus the prefix is the
  // name. Everything else — tests, suites, covitems, testbenches — is
  // not a design coordinate at all, and returning a name for those
  // would move the schematic on every click that had nothing to do
  // with it.
  //
  // The name goes out verbatim: no `baseModuleName` strip, which is
  // the rule cov_page.html needs because COVERAGE speaks the
  // simulator's elaborated names (`ip_async_fifo__DB13`). Both ends of
  // this wire speak the SOURCE vocabulary instead — the graph is built
  // from the source, and so is the schematic's hierarchy — so there
  // is no suffix to remove here, and stripping one would corrupt a
  // real module whose name happens to end in `__<alnum>`.
  function moduleNameFor(n) {
    if (!n) { return null; }
    var id = String(n.id == null ? '' : n.id);
    if (n.type === 'model') {
      var hash = id.indexOf('#');
      return hash < 0 ? null : (id.slice(hash + 1) || null);
    }
    if (n.type === 'module') {
      return id.indexOf('module:') === 0 ? (id.slice(7) || null) : null;
    }
    return null;
  }
  // <<< module-name

  // >>> cov-target
  // A graph node's coordinate in the COVERAGE model, or null when it has
  // none. The vocabulary is `cov_focus.target` from the wire schema —
  // `test:`, `module:` or `file:` — and the rule is "send what the cov
  // pane's `applyFocus` can actually resolve", which is why each branch
  // below names the thing it resolves against:
  //
  // * a `test:` node → the run's per-test attribution. The graph's id is
  //   `test:<suite>#<name>`; the coverage model keys tests by the BARE
  //   name (`cov/model.py` writes `artefacts.name`), so the fragment
  //   after the last `#` is what lands. The id goes out whole anyway —
  //   `focusTest` falls back to the fragment — because the suite is real
  //   information the schema's own example carries.
  // * a `model:`/`module:` node → the module, via the same derivation
  //   the schematic is sent (`moduleNameFor`); the cov pane resolves
  //   the source name onto its elaborated keys itself.
  // * a `coverage_item` node → its spec block read as a module, with the
  //   metric pinned to `cover` and the item id as the point name. Both
  //   narrowings are soft misses at the far end, so the worst case is
  //   landing on the module with the cover column up.
  // * anything else that has a `file` → that file, at its line. The
  //   graph stores paths project-root-relative (`_rel(project_root, …)`
  //   in the tier builders) and `/cov.json` keys files the same way, so
  //   the path crosses verbatim.
  //
  // Order matters: a `module:` node has a `file` too, and the module is
  // the better answer.
  function covTargetFor(n) {
    if (!n) { return null; }
    var id = String(n.id == null ? '' : n.id);
    if (n.type === 'test') {
      return id.indexOf('test:') === 0 && id.length > 5 ? { target: id } : null;
    }
    var mod = moduleNameFor(n);
    if (mod) { return { target: 'module:' + mod }; }
    if (n.type === 'coverage_item') {
      var block = n.block == null ? '' : String(n.block);
      var item = n.label == null ? '' : String(n.label);
      if (!block || !item) { return null; }
      return { target: 'module:' + block, metric: 'cover', item: item };
    }
    var file = n.file == null ? '' : String(n.file);
    if (!file) { return null; }
    var out = { target: 'file:' + file };
    var line = Number(n.line);
    if (line >= 1) { out.line = Math.floor(line); }
    return out;
  }
  // <<< cov-target

  // A selection whose root is not the schematic's active model
  // highlights nothing there — which reads as "the schematic is stuck".
  // The cached model can be stale (the SPA picker switches without
  // telling us), so reconfirm before accusing the click.
  //
  // The fix is one hub request away (`GET /view.json?model=` builds and
  // activates, and the hub broadcasts `view_changed` to the SPA), so
  // the warning arms the `switch model` button instead of telling
  // the user to go find the SPA's model picker.
  var crossModel = null;
  function setCrossModel(target) {
    crossModel = target;
    if (target) {
      els.fixView.disabled = false;
      els.fixView.textContent = originLabel('view') + ' → ' + target.model;
      els.fixView.title = 'Switch the schematic to model ' + target.model +
        ' (builds its view.json if needed), then re-highlight ' + target.ip + '.';
    } else {
      els.fixView.disabled = true;
      els.fixView.textContent = 'switch model';
      els.fixView.title = "Enabled when the selected node is not in the schematic's " +
        'active model — click to switch the schematic to the model that contains it.';
    }
  }

  function maybeWarnCrossModel(ip) {
    var root = ip.split('.')[0];
    if (!activeModel || root === activeModel) { setCrossModel(null); return; }
    request('state_snapshot', {}, function (reply) {
      if (reply.kind !== 'response') { return; }
      activeModel = reply.payload.active_model;
      if (activeModel && root !== activeModel) {
        setCrossModel({ model: root, ip: ip });
        note('selected ' + ip + " — not in the schematic's active model (" + activeModel +
             '); click “' + originLabel('view') + ' → ' + root +
             '” above to switch', 'warn');
      } else {
        setCrossModel(null);
      }
    });
  }

  els.fixView.addEventListener('click', function () {
    if (!crossModel) { return; }
    var target = crossModel;
    els.fixView.disabled = true;
    els.fixView.textContent = 'switching…';
    fetch('/view.json?model=' + encodeURIComponent(target.model))
      .then(function (resp) {
        if (!resp.ok) {
          // The hub answers failures with a structured envelope
          // (view_generation_failed & co) — surface its detail.
          return resp.json().then(
            function (body) {
              throw new Error((body && body.error && body.error.detail) ||
                              'HTTP ' + resp.status);
            },
            function () { throw new Error('HTTP ' + resp.status); }
          );
        }
      })
      .then(function () {
        activeModel = target.model;
        // Re-send the selection so the freshly switched view lands on
        // the node the user actually clicked.
        emit('selection_changed', { instance_path: target.ip });
        note('schematic switched to ' + target.model);
        setCrossModel(null);
      })
      .catch(function (err) {
        note('schematic switch failed: ' + err.message, 'error');
        setCrossModel(target); // re-arm for a retry
      });
  });

  // The envelope that puts the schematic on a node, or null when the
  // node is not a design coordinate at all. The instance path is the
  // exact answer; without one the coarser module name still moves the
  // schematic (it highlights every instance of that module — see
  // `moduleNameFor`). The echo back from the hub is ignored either way:
  // inbound graph_focus breaks on `origin === 'graph'`.
  //
  // Spelled as a value rather than inline, because two callers take this
  // same decision: the click path below (gated on the `sync schematic`
  // checkbox) and the inspector's explicit `send → sch` button
  // (which is not).
  function viewTargetFor(n) {
    var ip = instancePathFor(n);
    if (ip) {
      return {
        type: 'selection_changed', payload: { instance_path: ip },
        ip: ip, coord: ip, note: 'select ' + ip
      };
    }
    var mod = moduleNameFor(n);
    if (mod) {
      return {
        type: 'graph_focus', payload: { node: 'module:' + mod },
        ip: null, coord: 'module:' + mod,
        note: 'focus module:' + mod + ' in the schematic'
      };
    }
    return null;
  }

  function activate(n, opts) {
    opts = opts || {};
    state.selected = n.id;
    renderInspector(n);
    applyClasses();
    if (!opts.emit) { return; }
    var did = [];
    if (els.optSelect.checked) {
      var view = viewTargetFor(n);
      var sent = !!view && emit(view.type, view.payload);
      if (sent) { did.push(view.note); }
      // The cross-model warning is about a selected INSTANCE. Anything
      // else — a module fallback, an undeliverable send, a node the
      // schematic cannot place — must clear it, or a stale "sch → X" fixes the
      // wrong click.
      if (sent && view.ip) { maybeWarnCrossModel(view.ip); }
      else { setCrossModel(null); }
    }
    if (els.optOpen.checked && n.file) {
      var payload = { file: String(n.file), line: n.line ? Number(n.line) : 1, col: 1 };
      if (request('open_source', payload, function (reply) {
        if (reply.kind === 'error') {
          note(reply.payload.code === 'not_connected'
            ? 'no editor connected — start nvim with the rtl-buddy plugin (rb nvim-install), or untick "open in editor"'
            : 'open_source: ' + reply.payload.code + ': ' + reply.payload.message, 'error');
        }
      })) {
        did.push('open ' + payload.file + ':' + payload.line);
      }
    }
    if (did.length) { note(did.join('  ·  ')); }
    else if (wsReady) { note('nothing to send for this node'); }
    else { note('hub not connected', 'error'); }
  }

  function focusById(id, opts) {
    opts = opts || {};
    var n = id && state.byId[id];
    if (!n) {
      if (opts.announce) { note('graph-focus: no node ' + id + ' in this graph'); }
      return false;
    }
    activate(n, { emit: !!opts.emit });
    centerOn(n);
    if (opts.announce) { note('focused ' + id); }
    return true;
  }

  function focusByInstancePath(ip) {
    if (typeof ip !== 'string' || !ip) { return; }
    for (var i = 0; i < state.nodes.length; i++) {
      var n = state.nodes[i];
      if (n.type !== 'instance') { continue; }
      if (instancePathFor(n) === ip) {
        state.selected = n.id; renderInspector(n); applyClasses(); centerOn(n);
        return;
      }
    }
  }

  // ---------------------------------------------------------------
  // cross-app actions
  // ---------------------------------------------------------------

  // One control per sibling app: `send → X` puts the current selection
  // on the X tab that is already open and does not navigate. Opening an
  // app fresh is the header switcher's job — and a tab opened AFTER a
  // send still lands on the selection, because the hub caches the
  // latest selection_changed / graph_focus / cov_focus and replays them
  // to each peer as it registers (`_replay_cached_state` in
  // hub/server.py). No deep links, no new wire types.
  var APPS = [
    {
      origin: 'view', prose: 'the schematic',
      targetFor: viewTargetFor,
      send: function (t) { return emit(t.type, t.payload); },
      label: function (t) { return t.coord; },
      after: function (t) { if (t.ip) { maybeWarnCrossModel(t.ip); } },
      // Broadcast, not point-to-point: the coverage pane reads
      // selection_changed too (it guesses a module off the leaf name).
      overlap: 'This is a hub broadcast — an instance-path send also ' +
        'nudges the coverage pane, which resolves instance paths onto ' +
        'modules of its own accord.',
      why: 'this node is not a design coordinate — no instance path and no module name'
    },
    {
      origin: 'cov', prose: 'the coverage pane',
      targetFor: covTargetFor,
      send: function (t) { return emit('cov_focus', t); },
      label: function (t) {
        return t.target + (t.line ? ':' + t.line : '') + (t.item ? ' ' + t.item : '');
      },
      after: function () {},
      overlap: 'cov_focus is read by the coverage pane only.',
      why: 'nothing the coverage pane can focus on this node — no test, module or file'
    }
  ];

  function sendTo(app, n) {
    var t = app.targetFor(n);
    if (!t) { note(app.why, 'warn'); return false; }
    if (!app.send(t)) { note('hub not connected', 'error'); return false; }
    note('sent to ' + originLabel(app.origin) + ': ' + app.label(t));
    app.after(t);
    return true;
  }

  function actionButton(label, title, disabled, onClick) {
    var b = document.createElement('button');
    b.textContent = label;
    b.title = title;
    if (disabled) { b.disabled = true; } else { b.addEventListener('click', onClick); }
    return b;
  }

  // Sends only: opening an app fresh is the header switcher's job, so
  // there is no open-↗ variant here (it was redundant with those links,
  // and the hub replays its cached focus to late joiners anyway — send
  // first, then open from the header, lands the same way).
  function renderActions(n) {
    var box = document.createElement('div');
    box.className = 'actions';
    APPS.forEach(function (app) {
      var t = app.targetFor(n);
      var live = hasPeer(app.origin);
      box.appendChild(actionButton(
        'send → ' + originLabel(app.origin),
        !t ? app.why
           : !live ? app.prose + ' is not connected — open it from the header links'
           : 'Send ' + app.label(t) + ' to ' + app.prose +
             ', without leaving this tab. ' + app.overlap,
        !t || !live,
        function () { sendTo(app, n); }));
    });
    return box;
  }

  // Rebuilt in place when the peer list moves — see `setPeers`.
  var actionsEl = null, actionsNode = null;

  function refreshActions() {
    if (!actionsEl || !actionsEl.parentNode || !actionsNode) { return; }
    var next = renderActions(actionsNode);
    actionsEl.parentNode.replaceChild(next, actionsEl);
    actionsEl = next;
  }

  // ---------------------------------------------------------------
  // inspector
  // ---------------------------------------------------------------

  function row(dl, key, value) {
    var dt = document.createElement('dt'); dt.textContent = key;
    var dd = document.createElement('dd');
    // Duck-typed rather than `instanceof Node`: values here are either a
    // scalar out of the graph or an element we just built.
    if (value && typeof value === 'object' && value.nodeType === 1) {
      dd.appendChild(value);
    } else {
      dd.textContent = String(value);
    }
    dl.appendChild(dt); dl.appendChild(dd);
  }

  function renderInspector(n) {
    els.inspector.textContent = '';
    actionsEl = null; actionsNode = n || null;
    if (!n) {
      var hint = document.createElement('p');
      hint.className = 'muted';
      hint.textContent = 'Click a node.';
      els.inspector.appendChild(hint);
      return;
    }
    // First, above the identity: the row is about what you can DO with
    // the selection, and it must not need a scroll on a node with fifty
    // edges to be found.
    actionsEl = renderActions(n);
    els.inspector.appendChild(actionsEl);
    var dl = document.createElement('dl');
    dl.className = 'kv';
    row(dl, 'id', n.id);
    if (n.type) { row(dl, 'type', n.type); }
    row(dl, 'column', categoryOf(n));
    if (n.tier) { row(dl, 'tier', n.tier); }
    if (n.label && n.label !== n.id) { row(dl, 'label', n.label); }
    if (n.file) { row(dl, 'file', n.file + (n.line ? ':' + n.line : '')); }
    ['base_label', 'dir', 'width', 'toplevel', 'flow', 'reglvl', 'cocotb',
     'kind', 'tool', 'module', 'suite', 'test', 'qualified_by']
      .forEach(function (k) { if (n[k] != null) { row(dl, k, n[k]); } });
    els.inspector.appendChild(dl);

    if (n.results) {
      els.inspector.appendChild(document.createElement('hr'));
      var h = document.createElement('h2'); h.textContent = 'last run';
      els.inspector.appendChild(h);
      var rl = document.createElement('dl'); rl.className = 'kv';
      var pill = document.createElement('span');
      pill.className = 'pill';
      pill.style.color = STATUS_COLOR[n.results.status] || 'var(--warn)';
      pill.textContent = n.results.status || 'UNKNOWN';
      row(rl, 'status', pill);
      ['desc', 'timestamp', 'randseed', 'run_id', 'source'].forEach(function (k) {
        if (n.results[k] != null) { row(rl, k, n.results[k]); }
      });
      var art = n.results.artefacts || {};
      Object.keys(art).sort().forEach(function (k) { row(rl, k, art[k]); });
      if (n.results.coverage && n.results.coverage.totals) {
        row(rl, 'coverage', metricLine(n.results.coverage.totals));
      }
      els.inspector.appendChild(rl);
    }

    renderCoverage(n);

    var edges = (state.out[n.id] || []).map(function (l) { return { dir: '→', l: l, peer: l.target }; })
      .concat((state.inc[n.id] || []).map(function (l) { return { dir: '←', l: l, peer: l.source }; }));
    els.inspector.appendChild(document.createElement('hr'));
    var eh = document.createElement('h2');
    eh.textContent = 'edges (' + edges.length + ')';
    els.inspector.appendChild(eh);
    var ul = document.createElement('ul'); ul.className = 'edges';
    edges.forEach(function (e) {
      var li = document.createElement('li');
      var kind = document.createElement('span');
      kind.className = 'muted';
      kind.textContent = e.dir + ' ' + (e.l.type || 'edge') +
        (e.l.confidence && e.l.confidence !== 'EXTRACTED' ? ' [' + e.l.confidence + '] ' : ' ');
      var a = document.createElement('a');
      a.textContent = e.peer;
      a.addEventListener('click', function () { focusById(e.peer, { emit: false }); });
      li.appendChild(kind); li.appendChild(a);
      ul.appendChild(li);
    });
    els.inspector.appendChild(ul);
  }

  var METRIC_INITIAL = {
    line: 'L', branch: 'B', toggle: 'T', expression: 'E', cover: 'C'
  };

  function metricLine(totals) {
    return Object.keys(METRIC_INITIAL).filter(function (m) {
      return totals[m] && totals[m].found;
    }).map(function (m) {
      return METRIC_INITIAL[m] + ' ' + pct(totals[m].ratio);
    }).join('  ') || '\u2014';
  }

  // The declared-vs-observed answer, spelled out: which cover points a
  // spec item correlated with (and off which rung of the match ladder),
  // which tests declared they cover it, and how those tests did.
  function renderCoverage(n) {
    var c = covOf(n);
    if (!c) { return; }
    els.inspector.appendChild(document.createElement('hr'));
    var h = document.createElement('h2');
    h.textContent = c.kind === 'item' ? 'coverage item' : 'coverage';
    els.inspector.appendChild(h);
    var dl = document.createElement('dl'); dl.className = 'kv';
    if (c.kind === 'design') {
      row(dl, 'module', c.module);
      row(dl, 'line', pct(c.ratio));
      row(dl, 'metrics', metricLine(c.totals || {}));
      if ((c.tests || []).length) { row(dl, 'tests', c.tests.join(', ')); }
      (c.files || []).forEach(function (f, i) { row(dl, i ? '' : 'files', f); });
      // Cover points in this module that no `covers:` entry claims —
      // they have no node of their own to be selected, so the module
      // they live in is where they can be seen at all.
      ((state.coverage && state.coverage.undeclared) || [])
        .filter(function (u) { return u.module === c.module; })
        .forEach(function (u, i) {
          row(dl, i ? '' : 'undeclared',
            u.name + ':' + (u.line == null ? '?' : u.line) + ' \u00d7' + u.hits);
        });
    } else {
      var pill = document.createElement('span');
      pill.className = 'pill';
      pill.style.color = ITEM_COLOR[c.status] || 'var(--warn)';
      pill.textContent = c.status;
      row(dl, 'status', pill);
      row(dl, 'hits', c.hits);
      if ((c.hit_by || []).length) { row(dl, 'hit by', c.hit_by.join(', ')); }
      (c.declared_by || []).forEach(function (t, i) {
        row(dl, i ? '' : 'declared by', t);
      });
      var st = c.declared_by_status || {};
      var keys = Object.keys(st).sort();
      if (keys.length) {
        row(dl, 'their status', keys.map(function (k) {
          return st[k] + ' ' + k;
        }).join(', '));
      }
      (c.observed || []).forEach(function (o, i) {
        row(dl, i ? '' : 'observed',
          o.name + ' @ ' + (o.file || '?') + ':' + (o.line == null ? '?' : o.line) +
          ' \u00d7' + o.hits + ' [' + o.match + ']');
      });
      if (!(c.observed || []).length) {
        row(dl, 'observed', 'no cover point in the run\u2019s model');
      }
    }
    els.inspector.appendChild(dl);
  }

  // ---------------------------------------------------------------
  // wiring
  // ---------------------------------------------------------------

  els.search.addEventListener('input', function () {
    state.filter = els.search.value.trim().toLowerCase();
    applyClasses();
  });
  els.optHops.addEventListener('change', applyClasses);
  els.optCov.addEventListener('change', function () {
    // Remembered so a payload refresh does not re-tick a box the
    // person just unticked. Not persisted: a new tab starts ticked.
    els.optCov.dataset.touched = '1';
    renderLegend(state.categories);
    render();
    renderInspector(state.selected ? state.byId[state.selected] : null);
  });
  els.search.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') { return; }
    for (var i = 0; i < state.nodes.length; i++) {
      if (matches(state.nodes[i])) { focusById(state.nodes[i].id, { emit: true }); return; }
    }
  });
  document.getElementById('reload').addEventListener('click', load);
  window.addEventListener('resize', applyClasses);
  // The strip's status word doubles as the take-back control while this
  // tab is superseded; `takeBack` no-ops in every other state, so the
  // listener is bound once here rather than added and removed.
  els.wsStatus.addEventListener('click', takeBack);
  els.wsStatus.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); takeBack(); }
  });

  relabelSwitcher();
  connect();
  load();
})();
</script>
</body>
</html>
