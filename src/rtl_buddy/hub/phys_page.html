  // payload the pane reads carries no per-module note to relay. Nothing
  // is hidden and nothing is summed across the two: the note is what
  // stops the pairing from being read as one block's totals.
  function collisionNote() {
    if (state.module === null) { return null; }
    var spaces = namespacesOf(rowsOf('modules'), rowsOf('instances'),
      state.module);
    if (spaces.length < 2) { return null; }
    return elem('p', 'muted join-collision',
      'name collision: ' + state.module + ' is an RTL module in the ' +
      'synthesis half and a Liberty cell in the power half. The rows ' +
      'below are that cell type\'s instances — the power is the cell ' +
      'type\'s, the cells and area above are the module\'s, and they ' +
      'are two measurements of two things. This module\'s own power ' +
      'needs the hierarchy join.');
  }

  // Filtering to one module is a lens, and a lens you cannot take off is
  // a mode — so it says it is on, where the rows are, and saying it is
  // the way out.
  function modulePill() {
    var pill = elem('span', 'pill hot act', 'module: ' + state.module + ' ×');
    pill.title = 'Only instances of ' + state.module +
      ' are listed. Click for every instance.';
    pill.addEventListener('click', function () { activateModule(state.module); });
    return pill;
  }

  function renderRun() {
    clear(els.run);
    var p = state.payload || {};
    var backends = p.backends || {};
    var hub = p.hub || {};
    [['manifest', p.manifest], ['generated', p.generated_at],
     ['command', p.run_command], ['run', p.run], ['top', p.top],
     ['synth backend', backends.synth], ['power backend', backends.power],
     ['model', hub.model], ['generator', hub.generator]
    ].forEach(function (pair) {
      if (pair[1] == null) { return; }
      els.run.appendChild(elem('dt', null, pair[0]));
      els.run.appendChild(elem('dd', null, pair[1]));
    });
  }

  // ---------------------------------------------------------------
  // clicks → hub envelopes
  // ---------------------------------------------------------------

  function activateModule(name) {
    // Second click clears the lens: the same gesture the cov pane's
    // test lens uses, and the pill above says so too.
    var next = state.module === name ? null : name;
    state.module = next;
    resetInstanceWindow();
    renderModules();
    renderInstances();
    if (next === null) { note('every instance'); return; }
    if (!els.optSelect.checked) { note('module ' + next); return; }
    // `graph_focus {node:'module:<name>'}` is what the coverage pane
    // emits for a module too, and for the same reason: the graph pane
    // speaks node ids and the schematic SPA resolves `module:` targets
    // as well, so ONE broadcast reaches whichever of the two is open.
    // The pane invents no message type of its own in this direction.
    if (emit('graph_focus', { node: 'module:' + next })) {
      note('graph-focus module:' + next +
           (hasPeer('graph') || hasPeer('view') ? '' : ' (nobody listening)'));
    } else {
      note('hub not connected', 'error');
    }
  }

  function activateInstance(path) {
    state.instance = path;
    renderInstances();
    if (!els.optSelect.checked) { note('instance ' + path); return; }
    // `selection_changed`, not `source_focused`: an instance path IS the
    // schematic's coordinate, so this pane can address it directly —
    // the one thing the coverage pane cannot do, since coverage knows
    // files and modules and has to go through the hub's resolver.
    // Separators are levelled onto the wire's dots and the design top is
    // put back on the front, because the schematic's coordinate is
    // rooted at the top and OpenSTA's row is not; see `withTop`.
    //
    // The top it roots at is the PHYSICAL MODEL's, and that is a known
    // limit rather than an oversight: nothing on the wire says which
    // view `/sch` is displaying, so a pane holding a model of `blk`
    // cannot address a schematic that is showing `tb_blk` (where the
    // same instance is `tb_blk.dut.u_sub`) or a different design
    // altogether. Those views soft-miss — the path names no instance
    // there, the schematic selects nothing, and this pane's status line
    // reports the send it made, since a broadcast has no way to hear
    // that. Rooting at the model's own top is the only claim the pane
    // can make truthfully from what it holds; addressing one instance
    // across two hierarchies is the hierarchy join, Phase 5 of the
    // physical-metrics epic (rtl-buddy/rtl_buddy#558).
    var wire = withTop(path, designTop());
    if (emit('selection_changed', { instance_path: wire })) {
      note('select ' + wire +
           (hasPeer('view') ? '' : ' (the schematic is not connected)'));
    } else {
      note('hub not connected', 'error');
    }
  }

  // ---------------------------------------------------------------
  // inbound focus
  // ---------------------------------------------------------------

  function moduleRow(name) {
    var found = null;
    rowsOf('modules').concat(rowsOf('instances')).forEach(function (row) {
      if (found === null && String(row.module) === String(name)) { found = row; }
    });
    return found;
  }

  // `rooted` says the path came from a producer that roots at the top
  // (the schematic, over `selection_changed`); everything else — a
  // `phys_focus` target, a selection this pane is re-checking after a
  // reload — is the model's own rootless spelling.
  function instanceRow(path, rooted) {
    return findByPath(rowsOf('instances'), path, designTop(), rooted);
  }

  // Take the search box off when it would hide what is being focused.
  //
  // A focus arriving from elsewhere reports success by selecting a row,
  // and a row the active filter excludes is not rendered at all — so the
  // pane would say "focused u_cpu/_31_" over a table that does not
  // contain it, which is the one thing a cross-pane focus may not do.
  // The filter is the reader's own state, so it is left alone whenever
  // it already shows the target: the loss is only taken when keeping it
  // would mean lying. `state.searchCleared` is picked up by the note the
  // caller prints, so the reader is told which of their controls moved.
  function revealPastFilter(texts) {
    if (!filterHides(state.filter, texts)) { return; }
    state.filter = '';
    els.search.value = '';
    state.searchCleared = true;
  }

  // The note an inbound focus prints, saying so when the search went with
  // it. Cleared as it is read: the flag belongs to one focus, not to the
  // pane.
  function focusNote(text) {
    if (!state.searchCleared) { return text; }
    state.searchCleared = false;
    return text + ' (search cleared to show it)';
  }

  function focusModule(name) {
    if (moduleRow(name) === null) { return false; }
    // The module table matches the filter against this column alone.
    revealPastFilter([name]);
    state.module = String(name);
    state.instance = null;
    resetInstanceWindow();
    renderModules();
    renderInstances();
    return true;
  }

  function focusInstance(path, rooted) {
    var row = instanceRow(path, rooted);
    if (row === null) { return false; }
    // The instance table matches on the path or the cell, so both are
    // offered before the search is given up.
    revealPastFilter([row.instance_path, row.module]);
    // The MODEL's spelling, not the sender's: the tables are keyed on
    // it, so a `/`-spelled row selected by a `.`-spelled target has to
    // come back as the row's own path or the highlight never matches.
    state.instance = row.instance_path;
    state.module = null;
    resetInstanceWindow();
    renderModules();
    renderInstances();
    return true;
  }

  // A `selection_changed` from the schematic or the editor. Silent on a
  // miss, unlike a `phys_focus`: a selection is a running commentary on
  // what the user is doing elsewhere, and most of what they select was
  // never a leaf in a power report.
  function focusInstanceFromWire(ip) {
    if (Array.isArray(ip)) { ip = ip[0]; }
    if (typeof ip !== 'string' || !ip) { return; }
    if (!state.payload) {
      // The hub replays the cached selection immediately after
      // `welcome`, which routinely beats the `/phy.json` fetch — the
      // same race `applyFocus` already holds a `phys_focus` for. Held
      // here too, or opening the pane while a selection is live shows
      // nothing selected.
      state.pendingSelection = ip;
      return;
    }
    if (focusInstance(ip, true)) { note(focusNote('selected ' + ip)); }
  }

  function setMetric(metric) {
    if (METRICS.indexOf(metric) < 0) { return false; }
    state.metric = metric;
    els.metric.value = metric;
    // The explicit per-table sort is what the METRIC picks, so choosing
    // a metric clears a hand-picked column on the half that metric owns
    // — otherwise the switcher would silently do nothing on a table the
    // user had sorted by hand.
    var def = METRIC_DEFS[metric];
    if (def) { state.sort[def.half] = null; }
    resetInstanceWindow();
    renderTotals();
    renderModules();
    renderInstances();
    return true;
  }

  function applyFocus(payload) {
    if (!state.payload) {
      // The hub replays a cached focus on connect, which routinely wins
      // the race against the model fetch; hold it rather than dropping
      // it.
      state.pending = payload;
      return;
    }
    var target = payload && payload.target;
    if (typeof target !== 'string' || !target) { return; }
    // The metric hint is applied even when the target misses: it is an
    // independent instruction ("show me leakage"), and honouring half
    // of a payload beats honouring none of it.
    if (payload.metric) { setMetric(payload.metric); }
    var ok;
    if (target.indexOf('module:') === 0) {
      ok = focusModule(target.slice(7));
    } else if (target.indexOf('instance:') === 0) {
      ok = focusInstance(target.slice(9));
    } else {
      // Unprefixed strings are instance paths — the schema says so.
      ok = focusInstance(target);
    }
    // A soft miss, like graph_focus and cov_focus: report it and keep
    // the current focus rather than blanking the pane over a stale
    // target.
    note(ok ? focusNote('focused ' + target)
            : 'phys-focus: no ' + target + ' in this run',
         ok ? null : 'warn');
  }

  // ---------------------------------------------------------------
  // wiring
  // ---------------------------------------------------------------

  els.metric.addEventListener('change', function () {
    setMetric(els.metric.value);
  });
  els.search.addEventListener('input', function () {
    state.filter = els.search.value.trim().toLowerCase();
    resetInstanceWindow();
    renderModules();
    renderInstances();
  });
  document.getElementById('reload').addEventListener('click', load);
  // The strip's status word doubles as the take-back control while this
  // tab is superseded; `takeBack` no-ops in every other state, so the
  // listener is bound once here rather than added and removed.
  els.wsStatus.addEventListener('click', takeBack);
  els.wsStatus.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); takeBack(); }
  });

  relabelSwitcher();
  connect();
  load();
})();
</script>
</body>
</html>
