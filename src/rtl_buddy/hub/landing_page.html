<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rtl-buddy hub</title>
  <!-- Served by rtl_buddy.hub.landing_page at GET /. -->
  <!-- Offline: the only external references are same-origin hub routes (/hub/theme.css, /hub/assets/*, /hub/state.json). -->
  <!-- The first inline <style> holds the few tokens the page cannot render without, so a failed sheet load leaves a plain readable page. -->
  <!-- Keep that fallback BEFORE the sheet link: both select :root, so a later fallback would shadow the sheet, including its dark-mode block. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/hub/assets/rtl-buddy-favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/hub/assets/rtl-buddy-favicon-16.png">
  <style>
    /* --- minimal fallback: only what an unstyled page cannot do without */
    :root {
      color-scheme: light dark;
      --bg: #f8fafc; --panel: #ffffff; --panel-2: #f1f5f9;
      --line: #e2e8f0; --line-strong: #cbd5e1;
      --fg: #1e293b; --fg-muted: #64748b; --fg-faint: #94a3b8;
      --accent: #2563eb; --ok: #16a34a; --warn: #b45309; --err: #dc2626;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --fs-base: 13px; --fs-small: 11px;
      --radius-2: 4px; --radius-3: 6px;
      --shadow-1: 0 4px 12px rgba(15, 23, 42, .10);
    }
  </style>
  <link rel="stylesheet" href="/hub/theme.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font: var(--fs-base)/1.5 var(--font-sans);
      display: flex; flex-direction: column;
    }

    /* --- hub chrome: top bar ------------------------------------- */
    header {
      display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
      padding: .5rem .9rem; border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .identity { display: flex; align-items: center; gap: .5rem; }
    .identity img { width: 40px; height: 40px; display: block; }
    .identity h1 {
      font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em;
    }
    .identity p {
      margin: 0; font-size: var(--fs-small); color: var(--fg-muted);
    }
    .grow { flex: 1 1 auto; }
    nav.switcher { display: flex; gap: .35rem; align-items: center; }
    nav.switcher a, nav.switcher span.here {
      font: var(--fs-small)/1.6 var(--font-sans);
      border: 1px solid var(--line-strong); border-radius: var(--radius-2);
      padding: .15rem .5rem; text-decoration: none; color: var(--fg);
      white-space: nowrap;
    }
    nav.switcher a:hover { border-color: var(--accent); color: var(--accent); }
    nav.switcher span.here {
      background: var(--panel-2); color: var(--fg-muted); cursor: default;
    }

    /* --- main ------------------------------------------------------ */
    main {
      flex: 1 1 auto; overflow: auto; padding: 1.1rem .9rem 1.6rem;
      max-width: 62rem; width: 100%; margin: 0 auto;
    }
    h2 {
      font-size: var(--fs-small); letter-spacing: .12em; text-transform: uppercase;
      color: var(--fg-muted); margin: 0 0 .6rem; font-weight: 600;
    }
    section + section { margin-top: 1.6rem; }

    .cards {
      display: grid; gap: .75rem;
      grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
    }
    .card {
      display: flex; flex-direction: column; gap: .35rem;
      border: 1px solid var(--line); border-radius: var(--radius-3);
      background: var(--panel); padding: .8rem .85rem;
      text-decoration: none; color: inherit;
    }
    a.card:hover {
      border-color: var(--accent); box-shadow: var(--shadow-1);
    }
    .card .task { font-size: 14px; font-weight: 600; }
    .card .app {
      font: var(--fs-small)/1.5 var(--font-mono); color: var(--fg-muted);
    }
    /* Short name: what every switcher, peer strip and `send →` button says. */
    .card .short {
      border: 1px solid var(--line-strong); border-radius: var(--radius-1);
      padding: 0 .3rem; margin-right: .4rem; color: var(--fg);
    }
    .card .why { color: var(--fg-muted); }
    .card .note { font: var(--fs-small)/1.5 var(--font-mono); color: var(--fg-muted); }
    .card.off { opacity: .62; }
    .card.off .task { color: var(--fg-muted); }
    .badges { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: .1rem; }
    .badge {
      font: var(--fs-small)/1.6 var(--font-sans);
      border: 1px solid currentColor; border-radius: 999px; padding: 0 .45rem;
    }
    .badge.open { color: var(--warn); }
    .badge.soon { color: var(--fg-faint); }
    .badge.nodata { color: var(--fg-faint); }

    .kv {
      display: grid; grid-template-columns: 9rem 1fr; gap: .2rem .75rem;
      border: 1px solid var(--line); border-radius: var(--radius-3);
      background: var(--panel); padding: .75rem .85rem; margin: 0;
    }
    .kv dt { color: var(--fg-muted); }
    .kv dd { margin: 0; font-family: var(--font-mono); overflow-wrap: anywhere; }
    .kv dd.prose { font-family: var(--font-sans); }
    .none { color: var(--fg-faint); }

    .empty {
      display: flex; align-items: center; gap: 1rem;
      border: 1px dashed var(--line-strong); border-radius: var(--radius-3);
      padding: .9rem; color: var(--fg-muted); background: var(--panel);
    }
    .empty img { width: 120px; height: 120px; flex: none; }
    .empty code, .card code, .kv code {
      font-family: var(--font-mono); background: var(--panel-2);
      padding: 0 .25rem; border-radius: 3px;
    }
    .empty[hidden] { display: none; }

    /* --- hub chrome: bottom status strip --------------------------- */
    footer {
      border-top: 1px solid var(--line); background: var(--panel);
      padding: .3rem .9rem; color: var(--fg-muted);
      display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
      font-size: var(--fs-small);
    }
    .dot {
      width: .55rem; height: .55rem; border-radius: 50%;
      display: inline-block; background: var(--fg-faint);
    }
    .dot.connected { background: var(--ok); }
    .dot.connecting { background: var(--warn); }
    .dot.offline { background: var(--err); }
    #peers, #hub-addr { font-family: var(--font-mono); }
    .msg-error { color: var(--err); font-weight: 600; }
    .msg-warn { color: var(--warn); font-weight: 600; }
  </style>
  <script>
    %HUB_INJECTION%
  </script>
</head>
<body>
  <header>
    <div class="identity">
      <img src="/hub/assets/rtl-buddy-logo-80.png" alt="" width="40" height="40">
      <div>
        <h1>rtl-buddy hub</h1>
        <p id="subtitle">one project, every view of it</p>
      </div>
    </div>
    <span class="grow"></span>
    <nav class="switcher" id="switcher" aria-label="hub apps">
      <span class="here">⌂ hub</span>
    </nav>
  </header>

  <main>
    <section>
      <h2>what do you want to do</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section>
      <h2>this hub</h2>
      <dl class="kv" id="hub-state">
        <dt>project root</dt><dd id="st-root" class="none">…</dd>
        <dt>active model</dt><dd id="st-model" class="none">…</dd>
        <dt>connected peers</dt><dd id="st-peers" class="none">…</dd>
        <dt>design graph</dt><dd id="st-graph" class="none">…</dd>
      </dl>
      <div class="empty" id="empty" hidden>
        <img src="/hub/assets/rtl-buddy-mascot-240.png" alt="" width="120" height="120">
        <div id="empty-msg"></div>
      </div>
    </section>
  </main>

  <footer>
    <span><span class="dot connecting" id="conn-dot"></span> <span id="conn-status">connecting…</span></span>
    <span id="peers"></span>
    <span id="hub-version" class="muted"></span>
    <span class="grow"></span>
    <span id="hub-addr"></span>
    <span id="msg"></span>
  </footer>

<script>
(function () {
  'use strict';

  // The landing page is not a hub peer: a tab that only lists the apps must not
  // take an origin and evict the app you had open. State arrives by polling
  // /hub/state.json, not over /ws.
  var STATE_URL = '/hub/state.json';
  var POLL_MS = 4000;

  var els = {
    cards: document.getElementById('cards'),
    switcher: document.getElementById('switcher'),
    root: document.getElementById('st-root'),
    model: document.getElementById('st-model'),
    peersKv: document.getElementById('st-peers'),
    graph: document.getElementById('st-graph'),
    empty: document.getElementById('empty'),
    emptyMsg: document.getElementById('empty-msg'),
    hubVersion: document.getElementById('hub-version'),
    dot: document.getElementById('conn-dot'),
    status: document.getElementById('conn-status'),
    peers: document.getElementById('peers'),
    addr: document.getElementById('hub-addr'),
    msg: document.getElementById('msg')
  };

  // >>> origin-labels
  // Wire origin -> displayed name. Wire values (`view`, `graph`, `phys`) stay
  // until protocol v2; display names are `sch`, `gph` and `phy`. Used for the
  // peer list in both strips; an origin with no entry is shown verbatim.
  //
  // The app cards and switcher do not read this map: they use `name` and
  // `short` from /hub/state.json (APPS in hub/landing_page.py).
  //
  // Hand-duplicated into graph_page.html, cov_page.html, phys_page.html and the
  // SPA (rtl-buddy-sch viewer/src/displayNames.js); change all five together
  // (rtl-buddy-sch docs/hub-protocol.md section 13).
  var ORIGIN_LABELS = { view: 'sch', graph: 'gph', phys: 'phy' };

  function originLabel(origin) {
    var key = String(origin == null ? '' : origin);
    return Object.prototype.hasOwnProperty.call(ORIGIN_LABELS, key)
      ? ORIGIN_LABELS[key] : key;
  }
  // <<< origin-labels

  // >>> version-label
  // Version label shared by all hub surfaces (graph pane, coverage pane, SPA
  // buildInfo.js, this page); change the rule in every copy together. This page
  // reads the version from `hub.server_version` in /hub/state.json instead of a
  // welcome envelope.
  function versionLabel(raw) {
    var text = String(raw == null ? '' : raw);
    var plus = text.indexOf('+');
    var base = plus < 0 ? text : text.slice(0, plus);
    if (!base) { return null; }
    var local = plus < 0 ? '' : text.slice(plus + 1);
    var found = /(^|[.\-_])g([0-9a-fA-F]{4,})(?=$|[.\-_])/.exec(local);
    return found ? base + ' @ ' + found[2].slice(0, 9) : base;
  }
  // <<< version-label

  function text(node, value, emptyText) {
    if (value) { node.textContent = value; node.classList.remove('none'); }
    else { node.textContent = emptyText || '—'; node.classList.add('none'); }
  }

  // connected / connecting… / offline — the one vocabulary every hub app
  // uses for its bottom strip (see docs/concepts/hub.md, hub chrome).
  function setConnection(state) {
    els.dot.className = 'dot ' + state;
    els.status.textContent =
      state === 'connected' ? 'connected'
      : state === 'connecting' ? 'connecting…' : 'offline';
  }

  function note(message, level) {
    els.msg.textContent = message || '';
    els.msg.className =
      level === 'error' ? 'msg-error' : level === 'warn' ? 'msg-warn' : '';
  }

  function el(tag, cls, textContent) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (textContent != null) { n.textContent = textContent; }
    return n;
  }

  function ageText(seconds) {
    if (seconds == null) { return ''; }
    if (seconds < 90) { return Math.round(seconds) + 's ago'; }
    if (seconds < 5400) { return Math.round(seconds / 60) + 'm ago'; }
    if (seconds < 172800) { return Math.round(seconds / 3600) + 'h ago'; }
    return Math.round(seconds / 86400) + 'd ago';
  }

  function renderCard(app) {
    // A shipped app stays clickable without data: its own empty state names the
    // command that fixes it.
    var routable = app.status !== 'planned' && app.route;
    var node = routable ? el('a', 'card') : el('div', 'card off');
    if (routable) {
      node.href = app.route;
      if (!app.available) { node.className = 'card off'; }
    }
    node.appendChild(el('div', 'task', app.task));
    // The card introduces the long name; the chip beside it is the short one.
    var appLine = el('div', 'app');
    if (app.short) { appLine.appendChild(el('span', 'short', app.short)); }
    appLine.appendChild(document.createTextNode(
      app.route ? app.name + '  ' + app.route : app.name));
    node.appendChild(appLine);
    node.appendChild(el('div', 'why', app.why));
    var badges = el('div', 'badges');
    if (app.open) {
      // A second tab supersedes the first, so the warning belongs before the
      // click.
      badges.appendChild(el('span', 'badge open', 'already open — this replaces it'));
    }
    if (app.status === 'planned') {
      badges.appendChild(el('span', 'badge soon', 'coming soon'));
    } else if (!app.available) {
      badges.appendChild(el('span', 'badge nodata', 'no data yet'));
    }
    if (badges.childNodes.length) { node.appendChild(badges); }
    if (app.note) { node.appendChild(el('div', 'note', app.note)); }
    return node;
  }

  function renderSwitcher(apps) {
    // Rebuild only the sibling links; the ⌂ hub marker is static.
    var links = els.switcher.querySelectorAll('a');
    for (var i = 0; i < links.length; i++) { links[i].remove(); }
    apps.forEach(function (app) {
      if (app.status === 'planned' || !app.route) { return; }
      // Chrome is short names only — the long one belongs on the card.
      var a = el('a', null, app.short || app.name);
      a.href = app.route;
      a.title = app.task;
      els.switcher.appendChild(a);
    });
  }

  function render(state) {
    var apps = state.apps || [];
    els.cards.textContent = '';
    apps.forEach(function (app) { els.cards.appendChild(renderCard(app)); });
    renderSwitcher(apps);

    var hub = state.hub || {};
    text(els.root, hub.project_root, 'not a project hub');
    els.model.classList.toggle('prose', !hub.active_model);
    text(els.model, hub.active_model, 'none selected');
    var label = versionLabel(hub.server_version);
    els.hubVersion.textContent = label ? 'rtl-buddy ' + label : '';
    els.hubVersion.title = hub.server_version || '';
    var peers = state.peers || [];
    text(els.peersKv,
         peers.length ? peers.map(originLabel).join(', ') : '', 'none connected');
    els.peersKv.classList.toggle('prose', peers.length === 0);
    var graph = state.graph || {};
    els.graph.classList.toggle('prose', !graph.present);
    text(
      els.graph,
      graph.present
        ? (graph.path || 'graph.json') + '  ·  built ' + ageText(graph.age_seconds)
        : '',
      'not built — run `rb graph build`'
    );

    // Empty state: nothing built for any app. Not "no card is clickable": /sch
    // always answers.
    //
    // Every data-presence flag in the state must be in this test, or a project
    // with only `rb synth` output (which lights the phys card) is told it has
    // built nothing.
    var phys = state.phys || {};
    var nothingBuilt = !hub.active_model && !graph.present && !phys.present;
    els.empty.hidden = !nothingBuilt;
    if (nothingBuilt) {
      els.emptyMsg.textContent =
        'Nothing built for this project yet. Pick a model in the schematic ' +
        '(or start the hub with --model NAME), run `rb graph build` for the ' +
        'knowledge graph, or `rb synth` / `rb power` for the physical pane.';
    }

    els.addr.textContent = hub.addr || '';
    els.peers.textContent =
      peers.length ? 'peers: ' + peers.map(originLabel).join(' ') : 'no peers';
    setConnection('connected');
    note('');
  }

  function poll() {
    fetch(STATE_URL, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('GET ' + STATE_URL + ' → ' + r.status); }
        return r.json();
      })
      .then(render)
      .catch(function (err) {
        setConnection('offline');
        note(String(err && err.message ? err.message : err), 'error');
      });
  }

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
