name: Claude Code

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # Maintainer gate. The default GITHUB_TOKEN cannot read org teams
  # ("Resource not accessible by integration"), so gate on repo write
  # access instead — in this org that access is granted via the
  # maintainers team. An unauthorized actor (or a failed permission
  # lookup) skips the claude job rather than failing the run.
  gate:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check actor write permission
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
              const authorized = ['admin', 'maintain', 'write'].includes(data.permission);
              core.setOutput('authorized', authorized);
              if (!authorized) {
                core.notice(`${context.actor} has '${data.permission}' permission (write required) — skipping Claude run`);
              }
            } catch (e) {
              core.setOutput('authorized', false);
              core.notice(`permission lookup failed for ${context.actor}: ${e.message} — skipping Claude run`);
            }

  claude:
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read  # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # Maintains a comment on the PR/issue that Claude updates with its
          # result — the built-in channel for top-level feedback. Bash `gh`
          # calls are gated by the action's sandbox and cannot post, so the
          # comment MCP tools below are the only working write path.
          track_progress: true
          additional_permissions: |
            actions: read
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          claude_args: |
            --allowedTools Read,Write,Edit,Bash(git:*),mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment
            --model sonnet
            --effort medium
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE / PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Before doing anything else, read and follow the authoritative procedures in:
              - docs/development/reviews.md
              - docs/development/guidelines.md
              - docs/development/docs.md

            If this workflow was triggered by a PR being opened, marked ready for
            review (no comment), or a comment asking you to review, perform the review
            defined in docs/development/reviews.md.

            The GitHub tools for the feedback channels defined in
            docs/development/reviews.md are
            `mcp__github_comment__update_claude_comment` and
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`).
            Do not use `gh` to post comments — it is gated by the sandbox and will fail.
            Only post GitHub comments - don't submit review text as messages.

            Otherwise, the triggering comment and PR context are provided above.
            Perform the instructions from that comment.
