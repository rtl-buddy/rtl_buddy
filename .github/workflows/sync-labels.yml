name: Sync labels

# Source of truth for the shared label taxonomy (area/*, version/*, discussion)
# lives in .github/labels.json in this repo. On change, it is reconciled across
# every rtl-buddy repo listed in the matrix below.
#
# Requires a repo secret LABEL_SYNC_TOKEN: a PAT (classic: `repo` scope, or
# fine-grained: Issues=read/write on all target repos). The default GITHUB_TOKEN
# cannot write to other repositories, so a PAT is mandatory for cross-repo sync.

on:
  push:
    branches: [main]
    paths: ['.github/labels.json']
  workflow_dispatch:
    inputs:
      prune:
        description: 'Delete managed labels (area/*, version/*, discussion) not present in labels.json'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - rtl_buddy
          - rtl-buddy-cdc
          - rtl-buddy-view
          - rtl-buddy-xeno
          - rtl-buddy-axi-profiler
    steps:
      - uses: actions/checkout@v4

      - name: Sync labels to ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.LABEL_SYNC_TOKEN }}
          TARGET: rtl-buddy/${{ matrix.repo }}
          PRUNE: ${{ github.event.inputs.prune }}
        run: |
          set -euo pipefail
          echo "::group::Upserting labels into $TARGET"
          jq -c '.[]' .github/labels.json | while read -r row; do
            name=$(jq -r '.name'        <<<"$row")
            color=$(jq -r '.color'      <<<"$row")
            desc=$(jq -r '.description' <<<"$row")
            # create-or-update (idempotent)
            gh label create "$name" --repo "$TARGET" --color "$color" --description "$desc" --force
            echo "  upserted: $name"
          done
          echo "::endgroup::"

          if [ "${PRUNE:-false}" = "true" ]; then
            echo "::group::Pruning managed labels absent from labels.json"
            # only consider our managed namespaces so default labels are never touched
            comm -23 \
              <(gh label list --repo "$TARGET" --limit 200 --json name --jq '.[].name' \
                  | grep -E '^(area/|version/|discussion$)' | sort) \
              <(jq -r '.[].name' .github/labels.json | sort) \
            | while read -r stale; do
                [ -z "$stale" ] && continue
                gh label delete "$stale" --repo "$TARGET" --yes
                echo "  deleted: $stale"
              done
            echo "::endgroup::"
          else
            echo "Prune disabled (run via workflow_dispatch with prune=true to remove stale managed labels)."
          fi
