name: Lint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/check-vendored-tokenizer.sh'
  # No `branches:` filter: stacked PRs target their predecessor branch, and a
  # filter would skip their checks.
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/check-vendored-tokenizer.sh'

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install lint dependencies
        run: uv sync --group lint

      - name: Run Ruff
        run: uv run ruff check

      - name: Check Ruff formatting
        run: uv run ruff format --check

      - name: Hint — install pre-commit to catch this locally
        if: failure()
        run: |
          echo ""
          echo "Ruff check or format failed. Catch this before pushing by installing the pre-commit hook:"
          echo ""
          echo "  uv tool install pre-commit"
          echo "  pre-commit install"
          echo ""
          echo "After that, every commit will run Ruff automatically."

  # Advisory: a GitHub outage or rate limit must not block a PR.
  vendored-tokenizer:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Check the vendored Tcl tokenizer against upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-vendored-tokenizer.sh
