name: Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pytest.ini'
      - 'src/**/*.py'
      - 'tests/**/*.py'
  # No `branches:` filter — stacked PRs are based on their predecessor's
  # branch, not on main, and a base filter would silently skip their checks.
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pytest.ini'
      - 'src/**/*.py'
      - 'tests/**/*.py'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test dependencies
        # --extra graph-extract installs the bundled binding-tier
        # extractor (from PyPI since rtl-buddy-graph-extract 0.1.0), so
        # the extractor subprocess path and the merge-graphs cross-check
        # run for real here instead of being skip-if-missing everywhere.
        run: uv sync --group test --extra graph-extract

      - name: Run pytest with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
