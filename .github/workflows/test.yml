name: Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pytest.ini'
      - 'src/rtl_buddy/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
  # No `branches:` filter: stacked PRs target their predecessor branch, and a
  # filter would skip their checks.
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pytest.ini'
      - 'src/rtl_buddy/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test dependencies
        # graph-extract: runs the extractor subprocess tests instead of skipping them.
        # --managed-python: the runner's /usr/bin/python3 has no _tkinter, which
        # silently skips the `tcl` constraint-reader tests.
        run: uv sync --managed-python --python 3.12 --group test --extra graph-extract

      # Must print `tcl (...)`; `tokenizer` means _tkinter is missing and the tcl tests are skipped.
      - name: Report the constraint reader backend
        run: uv run --managed-python --python 3.12 python -c "from rtl_buddy.tool_manifest import constraint_reader_description as d; print('constraint reader:', d())"

      - name: Run pytest with coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/rtl-buddy.coverage
        run: |
          uv run --managed-python --python 3.12 pytest --cov --cov-report=term-missing --cov-report=xml --durations=25 --junitxml=pytest-results.xml
          uv run --managed-python --python 3.12 coverage report --include='*/elab_worker.py' --fail-under=80
          uv run --managed-python --python 3.12 coverage report --include='*/constraints/tcl_worker.py' --fail-under=80

      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: |
            coverage.xml
            pytest-results.xml
          if-no-files-found: warn
