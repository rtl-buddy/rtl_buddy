name: Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pytest.ini'
      - 'src/**/*.py'
      - 'tests/**/*.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pytest.ini'
      - 'src/**/*.py'
      - 'tests/**/*.py'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test dependencies
        # --group graph-extract installs the bundled binding-tier
        # extractor (git-pinned until its first PyPI release), so the
        # extractor subprocess path and the merge-graphs cross-check
        # run for real here instead of being skip-if-missing everywhere.
        # A dependency group, not an extra: groups stay out of the
        # published wheel metadata, so the wheel never advertises a
        # dependency PyPI cannot resolve.
        run: uv sync --group test --group graph-extract

      - name: Run pytest with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
