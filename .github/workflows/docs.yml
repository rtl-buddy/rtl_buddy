name: Docs

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  # No base-branch filter: stacked PRs may target their predecessor branch.
  pull_request:
    paths:
      - 'docs/**'
      - 'static/**'
      - 'src/css/**'
      - 'docusaurus.config.js'
      - 'sidebars.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - 'scripts/gen_cli_reference.py'
      - 'scripts/check_docs_frontmatter.py'
      - 'scripts/export_agent_docs.py'
      - 'scripts/publish_docusaurus.py'
      - 'src/rtl_buddy/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deployable: ${{ steps.target.outputs.deployable }}
      latest_version: ${{ steps.target.outputs.latest_version }}
      update_latest: ${{ steps.target.outputs.update_latest }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Python dependencies
        run: uv sync

      - name: Install documentation dependencies
        run: npm ci

      - name: Check generated docs files are up to date
        id: generated
        continue-on-error: true
        run: uv run python scripts/gen_cli_reference.py --check

      - name: Regenerate stale docs files
        if: steps.generated.outcome == 'failure'
        run: uv run python scripts/gen_cli_reference.py

      - name: Commit regenerated docs files
        if: steps.generated.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            exit 0
          fi
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Skipping auto-commit for forked pull request."
            exit 0
          fi
          if git diff --quiet -- docs/reference/cli.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/cli.md
          git commit -m "docs: regenerate generated docs artifacts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Check docs frontmatter
        run: |
          uv run python scripts/check_docs_frontmatter.py --check || {
            echo ""
            echo "Fix: add a 'description:' frontmatter field to each listed file."
            echo "See docs/CONTRIBUTING.md or run 'rb docs show CONTRIBUTING' for the required format."
            exit 1
          }

      - name: Read published versions
        id: published
        shell: bash
        run: |
          git fetch origin gh-pages --depth=1 || true
          versions="$(git show origin/gh-pages:versions.json 2>/dev/null | jq -r '[.[].version] | join(",")' || true)"
          latest="$(git show origin/gh-pages:versions.json 2>/dev/null | jq -r '.[] | select(.aliases | index("latest")) | .version' || true)"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

      - name: Compute docs target
        id: target
        shell: bash
        run: |
          deployable=false
          update_latest=false
          version=dev
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tag="${GITHUB_REF_NAME#v}"
              major="${tag%%.*}"
              version="v${major}"
              highest_major="$(git tag --list 'v*.*.*' | sed -nE 's/^v([0-9]+)\.[0-9]+\.[0-9]+$/\1/p' | sort -n | tail -1)"
              if [[ -n "${highest_major}" && "${major}" == "${highest_major}" ]]; then
                update_latest=true
              fi
              deployable=true
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            deployable=true
          fi
          versions="${{ steps.published.outputs.versions }}"
          if [[ ",${versions}," != *",${version},"* ]]; then
            versions="${versions:+${versions},}${version}"
          fi
          echo "deployable=${deployable}" >> "$GITHUB_OUTPUT"
          latest_version="${{ steps.published.outputs.latest }}"
          if [[ "${update_latest}" == "true" ]]; then
            latest_version="${version}"
          fi
          echo "latest_version=${latest_version}" >> "$GITHUB_OUTPUT"
          echo "update_latest=${update_latest}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "base_url=/rtl_buddy/${version}/" >> "$GITHUB_OUTPUT"

      - name: Build Docusaurus sites
        env:
          DOCS_BASE_URL: ${{ steps.target.outputs.base_url }}
          DOCS_ROOT_BASE_URL: /rtl_buddy/
          DOCS_VERSION: ${{ steps.target.outputs.version }}
          DOCS_VERSIONS: ${{ steps.target.outputs.versions }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            npm run build
            mkdir builds
            mv build "builds/${{ steps.target.outputs.version }}"
          else
            npm run build:all
          fi

      - name: Check site links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline builds/**/*.html
          fail: true

      - name: Upload site preview
        uses: actions/upload-artifact@v6
        with:
          name: docusaurus-site-${{ github.sha }}
          path: builds/

  deploy:
    if: github.event_name == 'push' && needs.build.outputs.deployable == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: docusaurus-site-${{ github.sha }}
          path: builds/

      - name: Configure git remote
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          test -n "$GH_PAGES_TOKEN" || {
            echo "GH_PAGES_TOKEN is required to publish versioned docs."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Check out GitHub Pages branch
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add "$RUNNER_TEMP/gh-pages" origin/gh-pages

      - name: Publish docs version
        env:
          DOCS_VERSION: ${{ needs.build.outputs.version }}
          LATEST_VERSION: ${{ needs.build.outputs.latest_version }}
          UPDATE_LATEST: ${{ needs.build.outputs.update_latest }}
        run: |
          for build_dir in builds/*; do
            version="${build_dir##*/}"
            args=(
              --build-dir "$build_dir"
              --pages-dir "$RUNNER_TEMP/gh-pages"
              --version "$version"
            )
            if [[ "$version" == "$LATEST_VERSION" ]]; then
              args+=(--update-latest)
            fi
            python3 scripts/publish_docusaurus.py "${args[@]}"
          done

      - name: Push GitHub Pages branch
        run: |
          git -C "$RUNNER_TEMP/gh-pages" add --all
          if git -C "$RUNNER_TEMP/gh-pages" diff --cached --quiet; then
            echo "Published documentation is already current."
            exit 0
          fi
          git -C "$RUNNER_TEMP/gh-pages" commit -m "docs: publish ${{ needs.build.outputs.version }}"
          git -C "$RUNNER_TEMP/gh-pages" push origin HEAD:gh-pages
