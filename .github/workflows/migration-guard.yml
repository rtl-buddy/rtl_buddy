name: Migration guard

# Fails a PR labeled `version/major` unless it adds a section to
# docs/migrations.md. This is the mechanical backstop for the rule in
# docs/development/guidelines.md (Releases): every major bump ships a
# migration section. Unlike a PR template, a required status check binds
# every PR equally — web UI, `gh pr create`, the REST API, and MCP tools.
#
# Deliberately has no `paths:` filter: a major bump that only touches code
# and forgets docs/migrations.md is exactly the case this must catch.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-migration-section:
    runs-on: ubuntu-latest
    steps:
      - name: Require a migrations.md section for version/major PRs
        uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            if (!labels.includes("version/major")) {
              core.info("PR is not labeled version/major — no migration section required.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const touched = files.some((f) => f.filename === "docs/migrations.md");

            if (touched) {
              core.info("version/major PR modifies docs/migrations.md ✓");
              return;
            }

            core.setFailed(
              [
                "This PR is labeled version/major but does not modify docs/migrations.md.",
                "",
                'Every major bump must add a "## vN to vM" section to docs/migrations.md',
                "documenting every breaking change and what users must update.",
                "See docs/development/guidelines.md → Releases.",
                "",
                "If this PR is not actually a breaking change, drop the version/major label.",
              ].join("\n"),
            );
