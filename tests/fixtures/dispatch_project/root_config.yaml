# CI dispatch integration fixture: a fake "verilator" builder whose
# simv prints PASS, so rb _test-job runs a full PRE->COMPILE->SIM->POST
# without a real simulator. Exercised by tests/test_dispatch_ci_shim.py
# with Slurm CLI shims on PATH (no real scheduler).
rtl-buddy-filetype: project_root_config

cfg-platforms:
  - os: "test-host"
    unames: ["Darwin", "Linux"]
    builder: "fakevrl"
    verible: "stub-verible"

cfg-rtl-builder:
  - name: "fakevrl"
    builder: "verilator"          # basename starts with "verilator" -> simv path convention
    simulator-family: "verilator" # engages share-build + enables time advice
    builder-simv: "simv"
    sim-rand-seed: 1
    sim-rand-seed-prefix: "+seed="
    builder-opts:
      reg:
        compile-time: "--binary"
        run-time: "+quiet"

cfg-verible:
  - name: "stub-verible"
    path: "/usr/bin"
    extra_args: {}

cfg-rtl-reg:
  reg-cfg-path: "regression.yaml"

cfg-dispatch:
  backend: slurm
  resources:
    cpus: 1
    mem: 512M
    time: "01:00:00"
