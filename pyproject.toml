[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rtl_buddy"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
  "ruamel.yaml >= 0.18.15",
  "typer >= 0.19.2",
  "click >= 8.3.0",
  "pyserde[yaml] >= 0.27.0",
  "rich >= 14.0.0",
  # <0.25: pywellen 0.25.0 rewrote the Waveform API to a streaming
  # surface, removing hierarchy/get_signal/get_signal_from_path used by
  # tools/surfer_wcp.py (rb wave annotations) and
  # tools/saif_from_trace.py (rb saif). Lift the bound when both are
  # ported (#263).
  "pywellen >= 0.20.0, <0.25",
  "jsonschema >= 4.21.0",
  "websockets >= 12.0",
]

authors = [
  { name = "Zhi-Hern Loh"},
  { name = "Xie Jiacheng"}
]

description = "Python CLI for Verilog and SystemVerilog RTL testing, randomized regressions, coverage, and simulator workflow automation."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
  "SystemVerilog",
  "Verilog",
  "RTL",
  "ASIC",
  "FPGA",
  "EDA",
  "Verilator",
  "VCS",
  "regression testing",
  "verification",
  "coverage",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
# `rb mut` mutation testing. rtl-buddy-xeno is a library rtl_buddy
# imports lazily (runner/mut_runner.py), not a subprocess tool, so it
# installs into the same environment via this extra rather than via
# `uv tool install`. The `>= 0.1.0` floor (first PyPI release) guards
# against API drift -- e.g. the ExpectedChange -> Prediction rename in
# rtl-buddy-xeno#5 -- at pip/uv resolve time. mut_runner repeats the
# same floor at import time (_check_xeno_version) for git/editable
# installs that bypass this resolve-time guard; keep the two in sync.
mut = ["rtl-buddy-xeno[verible,slang] >= 0.1.0"]
# `rb mcp`, the stdio Model Context Protocol server (#380). Optional on
# purpose: MCP is a *second* agent surface, and everything it serves is
# also reachable from the CLI with `--machine`, which needs no extra
# dependency. `rtl_buddy.mcp.toolset` therefore imports no SDK at all --
# only `rtl_buddy.mcp.server` does, lazily, behind `require_sdk()` -- so
# an install without this extra still imports, still runs, and fails
# only at `rb mcp` with an install hint. The `>= 1.2.0` floor is the
# first SDK release with the low-level stdio server this uses; both the
# 1.x decorator API and the 2.x constructor-callback API are supported
# by `mcp/server.py:build_server`.
mcp = ["mcp >= 1.2.0"]

[project.urls]
Source = "https://github.com/rtl-buddy/rtl_buddy"
Documentation = "https://rtl-buddy.github.io/rtl_buddy/"
Tracker = "https://github.com/rtl-buddy/rtl_buddy/issues"

# Development-time resolution for the graph-extract dependency group:
# no PyPI release exists yet, so uv resolves it from git. This table is
# uv-only metadata and the group below is unpublished, so nothing in the
# wheel references a name PyPI cannot resolve. Promote the group to a
# `[project.optional-dependencies]` extra (with a version floor) in the
# same PR that the first rtl-buddy-graph-extract PyPI release lands
# (tracked in rtl-buddy-graph-extract#1) and drop this pin.
[tool.uv.sources]
rtl-buddy-graph-extract = { git = "https://github.com/rtl-buddy/rtl-buddy-graph-extract" }

[tool.hatch.version]
source = "vcs"

# Source distribution only needs the inputs a downstream installer
# (pip, uv) actually requires: pyproject.toml, README.md, LICENSE, the
# package source under src/, and docs/ (because the bundled skill
# materializes them from the wheel). Dev/CI scaffolding (tests/,
# scripts/, .github/, .agents/, .claude/, mkdocs.yml, uv.lock,
# AGENTS.md, CLAUDE.md, .pre-commit-config.yaml, pytest.ini,
# CONTRIBUTORS) is not needed at install time and only inflates the
# release tarball.
[tool.hatch.build.targets.sdist]
include = [
  "src/rtl_buddy",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rtl_buddy"]
exclude = ["src/rtl_buddy/docs"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "rtl_buddy/docs"

[dependency-groups]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mike>=2.1.0",
]
lint = [
  "ruff>=0.11.0",
]
test = [
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "pytest-asyncio>=0.24.0",
  # So CI actually exercises the `rb mcp` SDK boundary. The tests that
  # need it still skip when it is absent (a contributor without the
  # extra must not see red), but the skip must not be the CI outcome.
  "mcp>=1.2.0",
]
# The bundled binding-tier extractor for `rb graph build` (#391): the
# clean-room implementation of the extract contract. A subprocess tool,
# not a library import. Deliberately a dependency GROUP and not a
# `[project.optional-dependencies]` extra: no PyPI release of the
# extractor exists yet, and groups stay out of published wheel
# metadata, so the wheel never advertises `rtl_buddy[graph-extract]`
# as something pip could satisfy (guarded by
# test_graph_extract_is_an_unpublished_dependency_group, which is also
# the reminder to flip this when the first PyPI release lands —
# rtl-buddy-graph-extract#1). Downstream users install the tool with
# `uv pip install git+https://github.com/rtl-buddy/rtl-buddy-graph-extract`
# (same command as the tool-check install hint). Deliberately NOT in
# the composite `dev` group below: an optional subprocess tool, not
# part of the baseline dev env — the two real-binary tests skip
# without it, and `uv sync --group graph-extract` opts in.
graph-extract = ["rtl-buddy-graph-extract"]
dev = [
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" },
]

[project.scripts]
rtl_buddy = "rtl_buddy.__main__:main"
rtl-buddy = "rtl_buddy.__main__:main"
rb = "rtl_buddy.__main__:main"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E7", "E9"]

[tool.ruff.lint.per-file-ignores]
"src/rtl_buddy/runner/test_runner.py" = ["F403", "F405"]

[tool.coverage.run]
branch = true
source = ["src/rtl_buddy"]
omit = [
  "src/rtl_buddy/skill/*",
  "src/rtl_buddy/docs/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 48
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
