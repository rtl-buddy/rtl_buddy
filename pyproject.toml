[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rtl_buddy"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
  "ruamel.yaml >= 0.18.15",
  "typer >= 0.19.2",
  "click >= 8.3.0",
  "pyserde[yaml] >= 0.27.0",
  "rich >= 14.0.0",
  # pywellen is pre-1.0 and changes its API on minor bumps. The floor has the
  # streaming panic fix; the cap makes the next rewrite fail at the lock bump.
  # Keep tests/test_pywellen_api.py and tools/pywellen_compat.py in step with this pin.
  "pywellen >=0.25.6,<0.26",
  "jsonschema >= 4.21.0",
  "websockets >= 12.0",
]

authors = [
  { name = "Zhi-Hern Loh"},
  { name = "Xie Jiacheng"}
]

description = "Python CLI for Verilog and SystemVerilog RTL testing, randomized regressions, coverage, and simulator workflow automation."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
  "SystemVerilog",
  "Verilog",
  "RTL",
  "ASIC",
  "FPGA",
  "EDA",
  "Verilator",
  "VCS",
  "regression testing",
  "verification",
  "coverage",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
# `rb elab` and `rb elab-regression`; imported only by the isolated worker.
elab = ["pyslang >= 10.0.0, <12"]
# `rb mut`. rtl-buddy-xeno is imported as a library, so it must share the
# environment. mut_runner repeats the version floor in _check_xeno_version;
# keep the two in sync.
mut = ["rtl-buddy-xeno[verible,slang] >= 0.1.0"]
# `rb mcp`, the stdio MCP server. Only `rtl_buddy.mcp.server` imports the SDK,
# lazily; without this extra everything else works and `rb mcp` prints an
# install hint. The floor is the first release with the low-level stdio server.
mcp = ["mcp >= 1.2.0"]
# Binding-tier extractor for `rb graph build`, run as a subprocess from PATH.
# Without it `rb graph build` skips the binding tier. The floor is the first
# release implementing the extract contract in graph/extract.py.
# Every extra must resolve on PyPI; test_graph_extract_is_a_published_extra guards this.
graph-extract = ["rtl-buddy-graph-extract >= 0.1.0"]

[project.urls]
Source = "https://github.com/rtl-buddy/rtl_buddy"
Documentation = "https://rtl-buddy.github.io/rtl_buddy/"
Tracker = "https://github.com/rtl-buddy/rtl_buddy/issues"

[tool.hatch.version]
source = "vcs"

# The sdist carries only what an installer needs: package source, README,
# LICENSE and docs/ (the bundled skill materializes docs from the wheel).
# Dev and CI scaffolding is excluded.
[tool.hatch.build.targets.sdist]
include = [
  "src/rtl_buddy",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rtl_buddy"]
exclude = ["src/rtl_buddy/docs"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "rtl_buddy/docs"

[dependency-groups]
lint = [
  "ruff>=0.11.0",
]
test = [
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "pytest-asyncio>=0.24.0",
  "pyslang>=10.0.0,<12",
  # Keeps the `rb mcp` tests from skipping in CI.
  "mcp>=1.2.0",
]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]

[project.scripts]
rtl_buddy = "rtl_buddy.__main__:main"
rtl-buddy = "rtl_buddy.__main__:main"
rb = "rtl_buddy.__main__:main"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E7", "E9"]

[tool.ruff.lint.per-file-ignores]
"src/rtl_buddy/runner/test_runner.py" = ["F403", "F405"]

[tool.coverage.run]
branch = true
source = ["src/rtl_buddy"]
omit = [
  "src/rtl_buddy/skill/*",
  "src/rtl_buddy/docs/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 48
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
