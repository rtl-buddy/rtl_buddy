[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rtl_buddy"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
  "ruamel.yaml >= 0.18.15",
  "typer >= 0.19.2",
  "click >= 8.3.0",
  "pyserde[yaml] >= 0.27.0",
  "rich >= 14.0.0",
  # >=0.25: tools/surfer_wcp.py and tools/saif_from_trace.py are ported to the
  # 0.25 random-access API (lifts the interim <0.25 bound from #264). Cap the
  # minor — pre-1.0 minors break the API — so the next rewrite fails the CI lock
  # bump, not in the field; test_pywellen_api.py guards the surface. See #263.
  "pywellen >=0.25.2,<0.26",
  "jsonschema >= 4.21.0",
  "websockets >= 12.0",
]

authors = [
  { name = "Zhi-Hern Loh"},
  { name = "Xie Jiacheng"}
]

description = "Python CLI for Verilog and SystemVerilog RTL testing, randomized regressions, coverage, and simulator workflow automation."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
  "SystemVerilog",
  "Verilog",
  "RTL",
  "ASIC",
  "FPGA",
  "EDA",
  "Verilator",
  "VCS",
  "regression testing",
  "verification",
  "coverage",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
# `rb mut` mutation testing. rtl-buddy-xeno is a library rtl_buddy
# imports lazily (runner/mut_runner.py), not a subprocess tool, so it
# installs into the same environment via this extra rather than via
# `uv tool install`. The `>= 0.1.0` floor (first PyPI release) guards
# against API drift -- e.g. the ExpectedChange -> Prediction rename in
# rtl-buddy-xeno#5 -- at pip/uv resolve time. mut_runner repeats the
# same floor at import time (_check_xeno_version) for git/editable
# installs that bypass this resolve-time guard; keep the two in sync.
mut = ["rtl-buddy-xeno[verible,slang] >= 0.1.0"]
# `rb mcp`, the stdio Model Context Protocol server (#380). Optional on
# purpose: MCP is a *second* agent surface, and everything it serves is
# also reachable from the CLI with `--machine`, which needs no extra
# dependency. `rtl_buddy.mcp.toolset` therefore imports no SDK at all --
# only `rtl_buddy.mcp.server` does, lazily, behind `require_sdk()` -- so
# an install without this extra still imports, still runs, and fails
# only at `rb mcp` with an install hint. The `>= 1.2.0` floor is the
# first SDK release with the low-level stdio server this uses; both the
# 1.x decorator API and the 2.x constructor-callback API are supported
# by `mcp/server.py:build_server`.
mcp = ["mcp >= 1.2.0"]
# The bundled binding-tier extractor for `rb graph build` (#391): the
# clean-room implementation of the extract contract. A subprocess tool,
# not a library import — it only needs to land on PATH in the same
# environment, which an extra does fine. Was deliberately a dependency
# GROUP while the extractor had no PyPI release (a wheel must never
# advertise an extra pip cannot resolve — the v6.26.0 lesson, see
# docs/known-issues.md); promoted to a real extra when
# rtl-buddy-graph-extract 0.1.0 landed on PyPI
# (rtl-buddy-graph-extract#1). The `>= 0.1.0` floor is the first
# release implementing the extract contract this repo's
# graph/extract.py drives. Guarded by
# test_graph_extract_is_a_published_extra. Still optional at runtime:
# `rb graph build` without it reports the binding tier as skipped.
graph-extract = ["rtl-buddy-graph-extract >= 0.1.0"]

[project.urls]
Source = "https://github.com/rtl-buddy/rtl_buddy"
Documentation = "https://rtl-buddy.github.io/rtl_buddy/"
Tracker = "https://github.com/rtl-buddy/rtl_buddy/issues"

[tool.hatch.version]
source = "vcs"

# Source distribution only needs the inputs a downstream installer
# (pip, uv) actually requires: pyproject.toml, README.md, LICENSE, the
# package source under src/, and docs/ (because the bundled skill
# materializes them from the wheel). Dev/CI scaffolding (tests/,
# scripts/, .github/, .agents/, .claude/, Docusaurus config, lock files,
# AGENTS.md, CLAUDE.md, .pre-commit-config.yaml, pytest.ini,
# CONTRIBUTORS) is not needed at install time and only inflates the
# release tarball.
[tool.hatch.build.targets.sdist]
include = [
  "src/rtl_buddy",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rtl_buddy"]
exclude = ["src/rtl_buddy/docs"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "rtl_buddy/docs"

[dependency-groups]
lint = [
  "ruff>=0.11.0",
]
test = [
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "pytest-asyncio>=0.24.0",
  # So CI actually exercises the `rb mcp` SDK boundary. The tests that
  # need it still skip when it is absent (a contributor without the
  # extra must not see red), but the skip must not be the CI outcome.
  "mcp>=1.2.0",
]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]

[project.scripts]
rtl_buddy = "rtl_buddy.__main__:main"
rtl-buddy = "rtl_buddy.__main__:main"
rb = "rtl_buddy.__main__:main"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E7", "E9"]

[tool.ruff.lint.per-file-ignores]
"src/rtl_buddy/runner/test_runner.py" = ["F403", "F405"]

[tool.coverage.run]
branch = true
source = ["src/rtl_buddy"]
omit = [
  "src/rtl_buddy/skill/*",
  "src/rtl_buddy/docs/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 48
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
